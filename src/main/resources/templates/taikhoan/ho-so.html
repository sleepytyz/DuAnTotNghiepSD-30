<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/client-head :: head('Thông tin cá nhân')}"></head>
<body class="fs-body">

<header th:replace="~{fragments/client-header :: header('account')}"></header>

<main class="fs-main">
    <div class="fs-container" style="padding:30px 0 60px;">
        <div class="fs-account-layout">
            <div th:replace="~{fragments/account-menu :: menu('ho-so')}"></div>

            <div class="fs-form-card">
                <h2 class="fs-h3" style="margin-bottom:18px;">Thông tin cá nhân</h2>

                <div class="fs-alert fs-alert-success" th:if="${thongBao}" th:text="${thongBao}"></div>

                <form th:action="@{/ca-nhan/cap-nhat}" th:object="${khachHang}" method="post">
                    <div class="fs-row-2">
                        <div class="fs-field">
                            <label>Họ và tên</label>
                            <input type="text" th:field="*{hoTen}" class="fs-input" th:classappend="${#fields.hasErrors('hoTen')} ? 'is-invalid'">
                            <div class="fs-field-error" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                        </div>
                        <div class="fs-field">
                            <label>Số điện thoại</label>
                            <input type="text" th:field="*{sdt}" class="fs-input" th:classappend="${#fields.hasErrors('sdt')} ? 'is-invalid'">
                            <div class="fs-field-error" th:if="${#fields.hasErrors('sdt')}" th:errors="*{sdt}"></div>
                        </div>
                    </div>
                    <div class="fs-row-2">
                        <div class="fs-field">
                            <label>Email</label>
                            <input type="email" th:field="*{email}" class="fs-input" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="fs-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="fs-field">
                            <label>Ngày sinh</label>
                            <input type="date" th:field="*{ngaySinh}" class="fs-input">
                        </div>
                    </div>
                    <div class="fs-field">
                        <label>Giới tính</label>
                        <select th:field="*{gioiTinh}" class="fs-input">
                            <option value="true">Nam</option>
                            <option value="false">Nữ</option>
                        </select>
                    </div>
                    <button type="submit" class="fs-btn fs-btn-primary">Lưu thay đổi</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/client-footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
