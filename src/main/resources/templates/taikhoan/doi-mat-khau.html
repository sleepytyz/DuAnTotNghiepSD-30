<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/client-head :: head('Đổi mật khẩu')}"></head>
<body class="fs-body">

<header th:replace="~{fragments/client-header :: header('account')}"></header>

<main class="fs-main">
    <div class="fs-container" style="padding:30px 0 60px;">
        <div class="fs-account-layout">
            <div th:replace="~{fragments/account-menu :: menu('mat-khau')}"></div>

            <div class="fs-form-card" style="max-width:480px;">
                <h2 class="fs-h3" style="margin-bottom:18px;">Đổi mật khẩu</h2>

                <div class="fs-alert fs-alert-danger" th:if="${loiMatKhauCu}" th:text="${loiMatKhauCu}"></div>

                <form th:action="@{/ca-nhan/doi-mat-khau}" th:object="${doiMatKhau}" method="post">
                    <div class="fs-field">
                        <label>Mật khẩu hiện tại <span class="req">*</span></label>
                        <input type="password" th:field="*{matKhauCu}" class="fs-input" th:classappend="${#fields.hasErrors('matKhauCu')} ? 'is-invalid'">
                        <div class="fs-field-error" th:if="${#fields.hasErrors('matKhauCu')}" th:errors="*{matKhauCu}"></div>
                    </div>
                    <div class="fs-field">
                        <label>Mật khẩu mới <span class="req">*</span></label>
                        <input type="password" th:field="*{matKhauMoi}" class="fs-input" th:classappend="${#fields.hasErrors('matKhauMoi')} ? 'is-invalid'">
                        <div class="fs-field-error" th:if="${#fields.hasErrors('matKhauMoi')}" th:errors="*{matKhauMoi}"></div>
                    </div>
                    <div class="fs-field">
                        <label>Xác nhận mật khẩu mới <span class="req">*</span></label>
                        <input type="password" th:field="*{xnMatKhauMoi}" class="fs-input" th:classappend="${#fields.hasErrors('xnMatKhauMoi')} ? 'is-invalid'">
                        <div class="fs-field-error" th:if="${#fields.hasErrors('xnMatKhauMoi')}" th:errors="*{xnMatKhauMoi}"></div>
                    </div>
                    <button type="submit" class="fs-btn fs-btn-primary fs-btn-block">Cập nhật mật khẩu</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/client-footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
