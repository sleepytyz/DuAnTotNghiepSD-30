<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đợt giảm giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .form-control:focus, .form-select:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
        }
        .form-label-custom {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-body">
        <div th:replace="fragments/header :: header('Chi tiết đợt giảm giá','Chi tiết đợt giảm giá')"></div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card card-custom mb-4 mt-3">
            <div class="card-header text-white" style="background:#c92327;">
                <h5 class="mb-0 d-flex align-items-center gap-2">
                    <i class="bi bi-sliders"></i>
                    <span>Quản lý & Lọc chi tiết đợt giảm giá</span>
                </h5>
            </div>
            <div class="card-body bg-light">

                <form th:action="@{/chi-tiet-dot-giam-gia/add}" method="post" class="mb-4 pb-4 border-bottom">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label-custom mb-1 d-block">Đợt giảm giá <span class="text-danger">*</span></label>
                            <select name="maGiamGia" id="selectDotGiamGia" class="form-select" required>
                                <option value="">-- Chọn đợt giảm giá --</option>
                                <option th:each="dgg : ${listDGG}" th:value="${dgg.maGiamGia}" th:text="${dgg.tenGiamGia}"></option>
                            </select>
                        </div>

                        <div class="col-md-7">
                            <label class="form-label-custom mb-1 d-block">Danh sách sản phẩm áp dụng <span class="text-danger">*</span></label>
                            <div class="border rounded p-2 bg-white" style="max-height: 120px; overflow-y: auto;">
                                <div class="row row-cols-1 row-cols-sm-3 row-cols-md-4 g-2">

                                    <div class="col" th:each="sp : ${listSP}">
                                        <div class="form-check m-0">
                                            <input class="form-check-input sp-checkbox" type="checkbox" name="maSanPhams"
                                                   th:value="${sp.maSanPham}"
                                                   th:id="'sp-' + ${sp.maSanPham}">

                                            <label class="form-check-label text-dark small text-truncate sp-label"
                                                   th:id="'label-sp-' + ${sp.maSanPham}"
                                                   th:for="'sp-' + ${sp.maSanPham}"
                                                   th:text="${sp.tenSanPham}"
                                                   style="max-width: 130px;">
                                            </label>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <div class="col-md-2">
                            <button type="submit" class="btn btn-danger w-100 fw-semibold" style="background:#c92327;">
                                <i class="bi bi-plus-lg"></i> Áp dụng
                            </button>
                        </div>
                    </div>
                </form>

                <form th:action="@{/chi-tiet-dot-giam-gia/loc}" method="get">
                    <div class="row align-items-end">
                        <div class="col-md-5">
                            <select name="searchMaGiamGia" class="form-select" onchange="this.form.submit()">
                                <option value="" th:selected="${selectedMaGiamGia == null || selectedMaGiamGia == ''}">-- Hiển thị tất cả sản phẩm giảm giá --</option>
                                <option th:each="dgg : ${listDGG}"
                                        th:value="${dgg.maGiamGia}"
                                        th:text="'[' + ${dgg.maGiamGia} + '] - ' + ${dgg.tenGiamGia}"
                                        th:selected="${selectedMaGiamGia == #strings.toString(dgg.maGiamGia)}">
                                </option>
                            </select>
                        </div>
                    </div>
                </form>

            </div>
        </div>

        <div class="table-card">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã CT</th>
                    <th>Đợt giảm giá</th>
                    <th>Sản phẩm</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ct,stt : ${listCTDGG}">
                    <td th:text="${currentPage != null} ? ${(currentPage * 7) + stt.count} : ${stt.count}"></td>
                    <td th:text="${'DGG' + ct.maChiTietGiamGia}"></td>
                    <td th:text="${ct.dotGiamGia.tenGiamGia}"></td>
                    <td th:text="${ct.sanPham.tenSanPham}"></td>
                    <td>
                        <a class="btn btn-outline-danger btn-sm px-2"
                           th:href="@{/chi-tiet-dot-giam-gia/delete/{id}(id=${ct.maChiTietGiamGia})}"
                           onclick="return confirm('Bạn có chắc chắn muốn gỡ sản phẩm này?')">
                            <i class="bi bi-trash3-fill"></i> Gỡ bỏ
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listCTDGG)}">
                    <td colspan="5" class="text-center text-muted py-3">Không có dữ liệu hiển thị</td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between align-items-center p-3 bg-white border-top" th:if="${totalPages != null && totalPages > 0}">
                <div class="small text-muted fw-semibold">
                    Tổng số bản ghi: <span th:text="${totalItems}">0</span> (Trang <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span>)
                </div>

                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm m-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link text-danger" th:href="@{/chi-tiet-dot-giam-gia/hien-thi(page=${currentPage - 1}, searchMaGiamGia=${selectedMaGiamGia})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${currentPage == i} ? 'active' : ''">
                            <a class="page-link"
                               th:href="@{/chi-tiet-dot-giam-gia/hien-thi(page=${i}, searchMaGiamGia=${selectedMaGiamGia})}"
                               th:text="${i + 1}"
                               th:style="${currentPage == i} ? 'background-color:#c92327; border-color:#c92327; color:#fff;' : 'color:#212529;'">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled' : ''">
                            <a class="page-link text-danger" th:href="@{/chi-tiet-dot-giam-gia/hien-thi(page=${currentPage + 1}, searchMaGiamGia=${selectedMaGiamGia})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('selectDotGiamGia').addEventListener('change', function() {
        const maGiamGia = this.value;
        const checkboxes = document.querySelectorAll('.sp-checkbox');
        const labels = document.querySelectorAll('.sp-label');

        // Nếu người dùng đưa về lựa chọn mặc định trống, reset tất cả checkbox
        if (!maGiamGia) {
            checkboxes.forEach(cb => {
                cb.checked = false;
                cb.disabled = false;
            });
            labels.forEach(lbl => {
                lbl.className = 'form-check-label text-dark small text-truncate sp-label';
            });
            return;
        }

        // Gọi API ngầm lấy danh sách các mã sản phẩm đã được áp dụng trong đợt này
        fetch(`/chi-tiet-dot-giam-gia/api/da-giam-gia/${maGiamGia}`)
            .then(response => response.json())
            .then(maSanPhamsDaGiam => {
                checkboxes.forEach(cb => {
                    const maSp = parseInt(cb.value);
                    const label = document.getElementById('label-sp-' + maSp);

                    if (maSanPhamsDaGiam.includes(maSp)) {
                        // Nếu sản phẩm đã áp dụng rồi: Tích chọn sẵn, Khóa tương tác, Gạch ngang làm mờ chữ
                        cb.checked = true;
                        cb.disabled = true;
                        if (label) {
                            label.className = 'form-check-label small text-truncate sp-label text-muted text-decoration-line-through';
                        }
                    } else {
                        // Nếu sản phẩm chưa áp dụng: Mở khóa để thao tác tự do
                        cb.checked = false;
                        cb.disabled = false;
                        if (label) {
                            label.className = 'form-check-label small text-truncate sp-label text-dark';
                        }
                    }
                });
            })
            .catch(error => console.error('Lỗi khi fetch dữ liệu giảm giá:', error));
    });
</script>
</body>
</html>
