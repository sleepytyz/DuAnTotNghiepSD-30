<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đợt giảm giá</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-body">

        <!-- Header -->
        <div th:replace="fragments/header :: header('Chi tiết đợt giảm giá','Chi tiết đợt giảm giá')"></div>

        <!-- FORM THÊM -->
        <div class="card card-custom mb-4">

            <div class="card-header text-white"
                 style="background:#c92327;">
                <h5 class="mb-0">
                    <i class="bi bi-plus-circle me-2"></i>
                    Thêm chi tiết đợt giảm giá
                </h5>
            </div>

            <div class="card-body">

                <form th:action="@{/chi-tiet-dot-giam-gia/add}"
                      method="post">

                    <div class="row g-3">

                        <!-- Đợt giảm giá -->
                        <div class="col-md-5">

                            <label class="form-label fw-semibold">
                                Đợt giảm giá
                            </label>

                            <select name="maGiamGia"
                                    class="form-select">

                                <option value="">
                                    -- Chọn đợt giảm giá --
                                </option>

                                <option th:each="dgg : ${listDGG}"
                                        th:value="${dgg.maGiamGia}"
                                        th:text="${dgg.tenGiamGia}">
                                </option>

                            </select>

                        </div>

                        <!-- Sản phẩm -->
                        <div class="col-md-5">

                            <label class="form-label fw-semibold">
                                Sản phẩm
                            </label>

                            <select name="maSanPham"
                                    class="form-select">

                                <option value="">
                                    -- Chọn sản phẩm --
                                </option>

                                <option th:each="sp : ${listSP}"
                                        th:value="${sp.maSanPham}"
                                        th:text="${sp.tenSanPham}">
                                </option>

                            </select>

                        </div>

                        <!-- Button -->
                        <div class="col-md-2">

                            <label class="form-label">&nbsp;</label>

                            <button type="submit"
                                    class="btn btn-danger w-100">

                                <i class="bi bi-plus-lg"></i>
                                Thêm

                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

        <!-- BẢNG -->
        <div class="table-card">

            <table class="table-custom">

                <thead>

                <tr>

                    <th>STT</th>
                    <th>Mã CT</th>
                    <th>Đợt giảm giá</th>
                    <th>Sản phẩm</th>
                    <th>Hành động</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="ct,stt : ${listCTDGG}">

                    <td th:text="${stt.count}"></td>

                    <td th:text="${ct.maChiTietGiamGia}"></td>

                    <td th:text="${ct.dotGiamGia.tenGiamGia}"></td>

                    <td th:text="${ct.sanPham.tenSanPham}"></td>

                    <td>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{/chi-tiet-dot-giam-gia/delete/{id}
                           (id=${ct.maChiTietGiamGia})}"
                           onclick="return confirm('Bạn có chắc muốn xóa?')">

                            <i class="bi bi-trash"></i>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
