<!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm mới Đợt giảm giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .card-custom { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section-title { color: #c92327; font-weight: 700; border-bottom: 2px solid #c92327; padding-bottom: 10px; margin-bottom: 20px; }
         .row-eq-height { display: flex; flex-wrap: wrap; }
        .card-custom { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 100%; }
        .table-responsive { border: 1px solid #dee2e6; border-radius: 8px; }
        .table { margin-bottom: 0; }
        .table th, .table td { vertical-align: middle; text-align: center; }
        .table td:nth-child(2) { text-align: left; }
    </style>
</head>
<body>

<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="content-body">
        <div th:replace="~{fragments/header :: header('Thêm đợt giảm giá', 'Chi tiết')}"></div>

        <div class="container-fluid mt-4">
            <form th:action="@{/dot-giam-gia/save-all}" th:object="${dggDTO}" method="post">
                <div class="row row-eq-height">
                    <div class="col-md-6 mb-4">
                        <div class="card card-custom p-4">
                            <h5 class="section-title"><i class="bi bi-info-circle"></i> Thông tin đợt giảm giá</h5>
                            <div class="row g-3">
                                <div class="col-12">
                                    <label>Tên đợt giảm giá <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{dotGiamGia.tenGiamGia}" class="form-control" >
                                    <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('dotGiamGia.tenGiamGia')}" th:errors="*{dotGiamGia.tenGiamGia}"></div>
                                    <div id="err-tenGiamGia"></div>
                                </div>
                                <div class="col-md-6">
                                    <label>Giá trị giảm (%)</label>
                                    <div class="input-group">
                                        <input type="number" th:field="*{dotGiamGia.giaTriGiam}" class="form-control" placeholder="0" >
                                        <span class="input-group-text">%</span>
                                    </div>
                                    <div id="err-giaTri" class="text-danger small mt-1"></div>
                                    <div class="invalid-feedback d-block fw-bold small"
                                         th:if="${#fields.hasErrors('dotGiamGia.giaTriGiam')}"
                                         th:errors="*{dotGiamGia.giaTriGiam}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label>Ngày bắt đầu</label>
                                    <input type="date" th:field="*{dotGiamGia.ngayBatDau}" class="form-control" >
                                    <div id="err-ngayBatDau" class="text-danger small mt-1"></div>
                                    <div class="invalid-feedback d-block fw-bold small"
                                         th:if="${#fields.hasErrors('dotGiamGia.ngayBatDau')}"
                                         th:errors="*{dotGiamGia.ngayBatDau}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label>Ngày kết thúc</label>
                                    <input type="date" th:field="*{dotGiamGia.ngayKetThuc}" class="form-control" >
                                    <div id="err-ngayKetThuc" class="text-danger small mt-1"></div>
                                    <div class="invalid-feedback d-block fw-bold small"
                                         th:if="${#fields.hasErrors('dotGiamGia.ngayKetThuc')}"
                                         th:errors="*{dotGiamGia.ngayKetThuc}">
                                    </div>
                                </div>
                                <div class="col-12"><label>Mô tả</label>
                                    <textarea th:field="*{dotGiamGia.moTa}" class="form-control" rows="3"></textarea></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <div class="card card-custom p-4">
                            <h5 class="section-title"><i class="bi bi-box-seam"></i> Chọn sản phẩm cha</h5>
                            <div class="table-responsive" style="max-height: 380px; overflow-y: auto;">
                                <table class="table table-hover">
                                    <thead class="table-light sticky-top">
                                    <tr>
                                        <th width="50">
                                            <input type="checkbox" id="selectAllSP" onclick="toggleAll(this, '.sp-check')">
                                        </th>
                                        <th>Tên sản phẩm</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="sp : ${listSP}">
                                        <td>
                                            <input type="checkbox"
                                                   class="sp-check"
                                                   name="listMaSanPham"
                                                   th:value="${sp.maSanPham}"
                                                   th:checked="${dggDTO.listMaSanPham != null && dggDTO.listMaSanPham.contains(sp.maSanPham)}"
                                                   onchange="updateAllBienThe()">
                                        </td>
                                        <td class="text-center" th:text="${sp.tenSanPham}"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card card-custom p-4 mb-4">
                    <h5 class="section-title"><i class="bi bi-list-check"></i> Danh sách biến thể (Sản phẩm chi tiết)</h5>
                    <div th:if="${errorBienThe}"
                         class="alert alert-danger">
                        <span th:text="${errorBienThe}"></span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead class="table-light">
                            <tr>
                                <th><input type="checkbox" id="selectAllBT" onclick="toggleAll(this, '.bt-check')"></th>
                                <th>STT</th>
                                <th>Mã SPCT</th>
                                <th>Sản phẩm</th>
                                <th>Size</th>
                                <th>Màu sắc</th>
                                <th>Giá nhập</th>
                                <th>Giá bán</th>
                                <th>Tồn kho</th>
                                <th>Trạng thái</th>
                                <th>Hình ảnh</th>
                            </tr>
                            </thead>
                            <tbody id="table-bien-the-body">
                            <tr>
                                <td colspan="3" class="text-center text-muted">Vui lòng chọn sản phẩm cha ở cột bên phải để tải danh sách biến thể</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="text-end mb-5">
                    <button type="submit" class="btn btn-lg" style="background:#c92327; color:white;">
                        <i class="bi bi-save"></i> Lưu đợt giảm giá
                    </button>
                </div>
                <input type="hidden"
                       id="selectedSP"
                       th:value="${dggDTO.listMaSanPham != null ? #strings.listJoin(dggDTO.listMaSanPham, ',') : ''}">
                <input type="hidden"
                       id="selectedSPCT"
                       th:value="${dggDTO.listMaSanPhamChiTiet != null ? #strings.listJoin(dggDTO.listMaSanPhamChiTiet, ',') : ''}">
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleAll(source, selector) {
        document.querySelectorAll(selector).forEach(cb => {
            cb.checked = source.checked;
        });

        if (selector === '.sp-check') {
            updateAllBienThe();
        }
    }

    function updateAllBienThe() {

        const selectedIds = Array.from(
            document.querySelectorAll('.sp-check:checked')
        ).map(cb => cb.value);

        const tbody = document.getElementById('table-bien-the-body');

        const selectedSPCT =
            (document.getElementById('selectedSPCT')?.value || "")
                .split(',')
                .filter(x => x);

        if (selectedIds.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11">Chưa chọn sản phẩm cha...</td></tr>';
            return;
        }

        fetch(`/api/get-bien-the-list?listMaSanPham=${selectedIds.join(',')}`)
            .then(res => res.json())
            .then(data => {

                console.log("BIEN THE:", data);

                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="11">Không có biến thể</td></tr>';
                    return;
                }

                data.forEach((c, index) => {

                    const checked = selectedSPCT.includes(String(c.maSanPhamChiTiet))
                        ? "checked"
                        : "";

                    const badgeClass =
                        c.trangThai === 'Còn hàng'
                            ? "bg-success-subtle text-success"
                            : "bg-secondary-subtle text-secondary";

                    const imgSrc = c.duongDanAnh
                        ? `/images/${c.duongDanAnh}`
                        : '/images/default-product.png';

                    tbody.innerHTML += `
<tr>
    <td>
        <input type="checkbox"
               class="bt-check"
               name="listMaSanPhamChiTiet"
               value="${c.maSanPhamChiTiet}"
               ${checked}>
    </td>

    <td>${index + 1}</td>
    <td>SPCT${c.maSanPhamChiTiet}</td>
    <td>${c.tenSanPham ?? ''}</td>
    <td>${c.tenKichThuoc ?? ''}</td>
    <td>${c.tenMauSac ?? ''}</td>

    <td>${new Intl.NumberFormat('vi-VN').format(c.giaNhap ?? 0)} đ</td>

    <td class="fw-bold text-danger">
        ${new Intl.NumberFormat('vi-VN').format(c.giaBan ?? 0)} đ
    </td>

    <td>${c.soLuongTon ?? 0}</td>

    <td>
        <span class="badge ${badgeClass}">
            ${c.trangThai ?? ''}
        </span>
    </td>

    <td>
        <img src="${imgSrc}" width="60" height="60"
             style="object-fit:cover; border-radius:6px;">
    </td>
</tr>`;
                });
            });
    }

    window.addEventListener('load', function () {

        const selectedSP =
            (document.getElementById('selectedSP')?.value || "")
                .split(',')
                .filter(x => x);

        selectedSP.forEach(id => {
            const cb = document.querySelector(`.sp-check[value="${id}"]`);
            if (cb) cb.checked = true;
        });

        setTimeout(() => {
            updateAllBienThe();
        }, 300);
    });
</script>
</body>
</html>
