<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/client-head :: head('Sản phẩm')}"></head>
<body class="fs-body">

<header th:replace="~{fragments/client-header :: header('shop')}"></header>

<main class="fs-main">
    <div class="fs-container">
        <div class="fs-breadcrumb">
            <a th:href="@{/}">Trang chủ</a><span class="sep">/</span><span class="current">Sản phẩm</span>
        </div>
    </div>

    <div class="fs-container" style="padding-bottom:60px;">
        <div class="fs-shop-layout">

            <aside>
                <form id="filterForm" method="get" th:action="@{/san-pham}">
                    <input type="hidden" name="q" th:value="${fQ}">

                    <div class="fs-filter-box">
                        <div class="fs-filter-title">Danh mục</div>
                        <div class="fs-filter-list">
                            <label><input type="radio" name="danhMuc" value="" onchange="this.form.submit()" th:checked="${fDanhMuc == null}"> Tất cả</label>
                            <label th:each="dm : ${danhMucs}">
                                <input type="radio" name="danhMuc" th:value="${dm.maDanhMuc}" onchange="this.form.submit()" th:checked="${fDanhMuc != null and fDanhMuc == dm.maDanhMuc}">
                                <span th:text="${dm.tenDanhMuc}">Danh mục</span>
                            </label>
                        </div>
                    </div>

                    <div class="fs-filter-box">
                        <div class="fs-filter-title">Thương hiệu</div>
                        <div class="fs-filter-list">
                            <label><input type="radio" name="thuongHieu" value="" onchange="this.form.submit()" th:checked="${fThuongHieu == null}"> Tất cả</label>
                            <label th:each="th : ${thuongHieus}">
                                <input type="radio" name="thuongHieu" th:value="${th.maThuongHieu}" onchange="this.form.submit()" th:checked="${fThuongHieu != null and fThuongHieu == th.maThuongHieu}">
                                <span th:text="${th.tenThuongHieu}">Brand</span>
                            </label>
                        </div>
                    </div>

                    <div class="fs-filter-box">
                        <div class="fs-filter-title">Kiểu giày</div>
                        <div class="fs-filter-list">
                            <label><input type="radio" name="kieuGiay" value="" onchange="this.form.submit()" th:checked="${fKieuGiay == null}"> Tất cả</label>
                            <label th:each="kg : ${kieuGiays}">
                                <input type="radio" name="kieuGiay" th:value="${kg.maKieuGiay}" onchange="this.form.submit()" th:checked="${fKieuGiay != null and fKieuGiay == kg.maKieuGiay}">
                                <span th:text="${kg.tenKieuGiay}">Kiểu</span>
                            </label>
                        </div>
                    </div>
                </form>
            </aside>

            <section>
                <div class="fs-section-head" style="margin-bottom:18px;">
                    <h2 class="fs-h3" style="text-transform:none;" th:text="'Tìm thấy ' + ${trang.totalElements} + ' sản phẩm'">Kết quả</h2>
                </div>

                <div class="fs-grid" th:if="${!#lists.isEmpty(sanPhams)}">
                    <div class="fs-card" th:each="sp : ${sanPhams}">
                        <a th:href="@{/san-pham/{id}(id=${sp.maSanPham})}" class="fs-card-link"></a>
                        <div class="fs-card-img">
                            <span class="fs-card-badge" th:if="${sp.phanTramGiam > 0}" th:text="'-' + ${sp.phanTramGiam} + '%'"></span>
                            <span class="fs-card-badge fs-badge-out" th:if="${!sp.conHang}">Hết hàng</span>
                            <img th:src="${sp.anh}" th:alt="${sp.tenSanPham}">
                        </div>
                        <div class="fs-card-body">
                            <div class="fs-card-brand" th:text="${sp.tenThuongHieu}">Brand</div>
                            <div class="fs-card-name" th:text="${sp.tenSanPham}">Tên sản phẩm</div>
                            <div class="fs-card-price">
                                <span class="now" th:text="${#numbers.formatDecimal(sp.giaSauGiam,0,'COMMA',0,'POINT')} + 'đ'">0đ</span>
                                <span class="old" th:if="${sp.phanTramGiam > 0}" th:text="${#numbers.formatDecimal(sp.giaGoc,0,'COMMA',0,'POINT')} + 'đ'"></span>
                            </div>
                            <a th:href="@{/san-pham/{id}(id=${sp.maSanPham})}" class="fs-card-add" style="text-align:center;display:block;text-decoration:none;">Xem chi tiết</a>
                        </div>
                    </div>
                </div>

                <div class="fs-empty-state" th:if="${#lists.isEmpty(sanPhams)}">
                    <i class="bi bi-search"></i>
                    <h3>Không tìm thấy sản phẩm phù hợp</h3>
                    <p>Hãy thử bỏ bớt bộ lọc hoặc tìm kiếm với từ khoá khác.</p>
                    <a th:href="@{/san-pham}" class="fs-btn fs-btn-dark">Xem tất cả sản phẩm</a>
                </div>

                <div class="fs-pagination" th:if="${trang.totalPages > 1}">
                    <a th:if="${trang.number > 0}"
                       th:href="@{/san-pham(danhMuc=${fDanhMuc}, thuongHieu=${fThuongHieu}, kieuGiay=${fKieuGiay}, q=${fQ}, page=${trang.number - 1})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <span th:each="i : ${#numbers.sequence(0, trang.totalPages - 1)}">
                        <a th:if="${i != trang.number}"
                           th:href="@{/san-pham(danhMuc=${fDanhMuc}, thuongHieu=${fThuongHieu}, kieuGiay=${fKieuGiay}, q=${fQ}, page=${i})}"
                           th:text="${i + 1}">1</a>
                        <span th:if="${i == trang.number}" class="active" th:text="${i + 1}">1</span>
                    </span>
                    <a th:if="${trang.number < trang.totalPages - 1}"
                       th:href="@{/san-pham(danhMuc=${fDanhMuc}, thuongHieu=${fThuongHieu}, kieuGiay=${fKieuGiay}, q=${fQ}, page=${trang.number + 1})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/client-footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/storefront/js/storefront.js}"></script>
</body>
</html>
