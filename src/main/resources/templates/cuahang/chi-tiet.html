<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/client-head :: head(${sp.tenSanPham})}"></head>
<body class="fs-body">

<header th:replace="~{fragments/client-header :: header('shop')}"></header>

<main class="fs-main">
    <div class="fs-container">
        <div class="fs-breadcrumb">
            <a th:href="@{/}">Trang chủ</a><span class="sep">/</span>
            <a th:href="@{/san-pham}">Sản phẩm</a><span class="sep">/</span>
            <span class="current" th:text="${sp.tenSanPham}">Tên sản phẩm</span>
        </div>
    </div>

    <div class="fs-container" style="padding-bottom:60px;">
        <div class="fs-detail">
            <div>
                <div class="fs-detail-gallery-main">
                    <img id="mainImg" th:src="${!#lists.isEmpty(bienThe)} ? ${bienThe[0].anh} : '/storefront/img/no-image.svg'" alt="ảnh sản phẩm">
                </div>
            </div>

            <div>
                <div class="fs-card-brand" th:text="${sp.thuongHieu != null ? sp.thuongHieu.tenThuongHieu : ''}">Brand</div>
                <h1 class="fs-h2" style="text-transform:none;" th:text="${sp.tenSanPham}">Tên sản phẩm</h1>

                <div class="fs-detail-price">
                    <span class="now" id="priceNow">—</span>
                    <span class="old" id="priceOld" style="display:none;"></span>
                    <span class="pct" id="pricePct" style="display:none;"></span>
                </div>

                <div class="fs-option-group">
                    <label class="fs-option-label">Màu sắc</label>
                    <div class="fs-swatches" id="colorSwatches"></div>
                </div>

                <div class="fs-option-group">
                    <label class="fs-option-label">Kích thước</label>
                    <div class="fs-swatches" id="sizeSwatches"></div>
                </div>

                <div class="fs-qty-row">
                    <div class="fs-qty-stepper">
                        <button type="button" data-qty-step="-1">−</button>
                        <input type="number" id="qtyInput" value="1" min="1" max="10">
                        <button type="button" data-qty-step="1">+</button>
                    </div>
                    <span class="fs-stock-note" id="stockNote">Vui lòng chọn màu và kích thước</span>
                </div>

                <div class="fs-detail-actions">
                    <button type="button" id="btnAddCart" class="fs-btn fs-btn-dark js-add-to-cart" data-qty-input="#qtyInput" disabled>
                        <i class="bi bi-bag-plus"></i> Thêm vào giỏ
                    </button>
                    <a th:href="@{/gio-hang}" class="fs-btn fs-btn-outline"><i class="bi bi-bag-check"></i> Xem giỏ hàng</a>
                </div>

                <div class="fs-info-tabs">
                    <h3 class="fs-h3">Mô tả sản phẩm</h3>
                    <p th:text="${sp.moTa != null ? sp.moTa : 'Đang cập nhật mô tả cho sản phẩm này.'}">Mô tả</p>
                </div>
            </div>
        </div>

        <div class="fs-section" th:if="${!#lists.isEmpty(lienQuan)}">
            <div class="fs-section-head"><h2 class="fs-h2">Sản phẩm liên quan</h2></div>
            <div class="fs-grid">
                <div class="fs-card" th:each="rsp : ${lienQuan}">
                    <a th:href="@{/san-pham/{id}(id=${rsp.maSanPham})}" class="fs-card-link"></a>
                    <div class="fs-card-img">
                        <span class="fs-card-badge" th:if="${rsp.phanTramGiam > 0}" th:text="'-' + ${rsp.phanTramGiam} + '%'"></span>
                        <img th:src="${rsp.anh}" th:alt="${rsp.tenSanPham}">
                    </div>
                    <div class="fs-card-body">
                        <div class="fs-card-brand" th:text="${rsp.tenThuongHieu}">Brand</div>
                        <div class="fs-card-name" th:text="${rsp.tenSanPham}">Tên</div>
                        <div class="fs-card-price">
                            <span class="now" th:text="${#numbers.formatDecimal(rsp.giaSauGiam,0,'COMMA',0,'POINT')} + 'đ'">0đ</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/client-footer :: footer}"></footer>

<script th:inline="javascript">
    var bienThe = /*[[${bienThe}]]*/ [];
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/storefront/js/storefront.js}"></script>
<script th:src="@{/storefront/js/product-detail.js}"></script>
</body>
</html>
