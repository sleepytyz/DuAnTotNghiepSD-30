<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý kiểu giày - FS Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .form-control:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
        }
        /* Custom Pagination Đồng bộ hệ thống */
        .pagination .page-item .page-link {
            color: #495057;
            background-color: #f8f9fa;
            transition: all 0.2s ease;
        }
        .pagination .page-item .page-link:hover {
            background-color: #e9ecef;
            color: #c92327;
        }
        .pagination .page-item.active .page-link {
            background-color: #c92327 !important;
            color: #fff !important;
            border-color: #c92327 !important;
            box-shadow: 0 4px 10px rgba(201, 35, 39, 0.2);
        }
        .pagination .page-item.disabled .page-link {
            background-color: #f8f9fa;
            color: #6c757d;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-body px-3">

        <div th:replace="fragments/header :: header('Quản lý kiểu giày', 'Kiểu giày')"></div>

        <div th:if="${mess}" class="alert alert-danger alert-dismissible fade show mt-3 shadow-sm border-0" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${mess}" class="fw-medium"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${successMess}" class="alert alert-success alert-dismissible fade show mt-3 shadow-sm border-0" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMess}" class="fw-medium"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <section class="card card-custom mb-4 shadow-sm border-0 mt-3">
            <div class="card-header text-white" style="background:#c92327;">
                <h5 class="mb-0 d-flex align-items-center gap-2 py-1">
                    <i class="bi bi-collection-fill"></i>
                    <span>Thêm kiểu giày mới</span>
                </h5>
            </div>

            <div class="card-body bg-white p-4">
                <form th:action="@{/kieugiay/add}" th:object="${kieugiay}" method="post">
                    <div class="row g-3 align-items-end">

                        <div class="col-xl-6 col-md-8">
                            <label class="form-label fw-semibold text-dark small mb-2">Tên kiểu giày <span class="text-danger">*</span></label>
                            <input type="text"
                                   class="form-control border-secondary-subtle"
                                   th:field="*{tenKieuGiay}"
                                   placeholder="Nhập kiểu giày (VD: Giày thể thao, Giày lười, Sneaker...)"
                                   style="height: 38px;">

                            <div class="text-danger small mt-1 fw-medium"
                                 th:if="${#fields.hasErrors('tenKieuGiay')}"
                                 th:text="${#fields.errors('tenKieuGiay')[0]}">
                            </div>
                        </div>

                        <div class="col-xl-3 col-md-4">
                            <button type="submit" class="btn text-white fw-semibold px-4 w-100 d-flex align-items-center justify-content-center gap-2" style="background: #c92327; height: 38px;">
                                <i class="bi bi-plus-circle"></i> Thêm mới
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </section>

        <section class="card card-custom shadow-sm border-0 mt-4">
            <div class="table-header bg-white border-bottom p-3">
                <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                    <i class="bi bi-list-stars text-danger"></i> Danh sách kiểu giày hệ thống
                </h5>
            </div>

            <div class="table-card p-3 pb-0">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th style="width: 80px;">STT</th>
                        <th>MÃ KIỂU GIÀY</th>
                        <th>TÊN KIỂU GIÀY</th>
                        <th>TRẠNG THÁI</th>
                        <th>HÀNH ĐỘNG</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="kg,stt : ${listkg}">
                        <td th:text="${(currentPage * 5) + stt.count}"></td>
                        <td class="fw-semibold text-secondary" th:text="${'KG' + kg.maKieuGiay}"></td>
                        <td class="fw-bold text-dark" th:text="${kg.tenKieuGiay}"></td>
                        <td>
                            <span th:if="${kg.trangThai}" class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">Đang hoạt động</span>
                            <span th:unless="${kg.trangThai}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1">Ngừng hoạt động</span>
                        </td>

                        <td>
                            <a th:if="${kg.trangThai}"
                               th:href="@{/kieugiay/capnhatt/{id}(id=${kg.maKieuGiay})}"
                               class="btn btn-sm btn-link text-success p-1 border-0"
                               title="Đang hoạt động - Nhấn để ngừng"
                               onclick="return confirm('Bạn có chắc chắn muốn NGỪNG hoạt động kiểu giày này?')">
                                <i class="bi bi-toggle2-on fs-4"></i>
                            </a>

                            <a th:unless="${kg.trangThai}"
                               th:href="@{/kieugiay/capnhatt/{id}(id=${kg.maKieuGiay})}"
                               class="btn btn-sm btn-link text-secondary p-1 border-0"
                               title="Đang ngừng hoạt động - Nhấn để kích hoạt lại"
                               onclick="return confirm('Bạn có muốn KÍCH HOẠT LẠI kiểu giày này không?')">
                                <i class="bi bi-toggle2-off fs-4"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listkg)}">
                        <td colspan="5" class="text-center text-muted py-4">Chưa có dữ liệu kiểu giày nào được tạo.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center px-4 py-3" th:if="${totalPages > 0}">
                <div class="small text-muted fw-semibold">
                    Tổng số bản ghi: <span class="fw-semibold text-dark" th:text="${totalItems}">0</span>
                    (Trang <span class="fw-semibold text-dark" th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span>)
                </div>

                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0 gap-1">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link rounded-2 border-0 d-flex align-items-center justify-content-center text-danger"
                               th:href="@{/kieugiay/index(page=${currentPage - 1})}"
                               style="width: 32px; height: 32px;">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${currentPage == i} ? 'active' : ''">
                            <a class="page-link rounded-2 border-0 d-flex align-items-center justify-content-center fw-semibold"
                               th:href="@{/kieugiay/index(page=${i})}"
                               th:text="${i + 1}"
                               th:style="${currentPage == i} ? 'background-color:#c92327; border-color:#c92327; color:#fff;' : 'color:#212529; width: 32px; height: 32px;'">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled' : ''">
                            <a class="page-link rounded-2 border-0 d-flex align-items-center justify-content-center text-danger"
                               th:href="@{/kieugiay/index(page=${currentPage + 1})}"
                               style="width: 32px; height: 32px;">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </section>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
