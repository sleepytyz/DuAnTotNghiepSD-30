<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Quản Lý Giảm Giá</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">

  <style>
    .modal-content {
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .modal-header-custom {
      background: #c92327;
      color: white;
      padding: 1rem 1.5rem;
      border-bottom: none;
    }
    .modal-body {
      padding: 2rem 1.5rem;
      background-color: #f8f9fa;
    }
    .modal-footer {
      background-color: #ffffff;
      border-top: 1px solid #dee2e6;
      padding: 1rem 1.5rem;
    }
    .form-label-custom {
      font-weight: 600;
      color: #495057;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-control, .form-select {
      border-radius: 6px;
      border: 1px solid #ced4da;
      padding: 0.55rem 0.75rem;
      transition: all 0.2s ease-in-out;
    }
    .form-control:focus, .form-select:focus {
      border-color: #c92327 !important;
      box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
    }
    .radio-group {
      background: #ffffff;
      border: 1px solid #ced4da;
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .radio-group input[type="radio"] {
      accent-color: #c92327;
    }
  </style>
</head>

<body>

<div class="wrapper">
  <div sec:authorize="hasRole('ADMIN')">
    <div th:replace="fragments/sidebaradmin :: sidebar-admin"></div>
  </div>

  <div sec:authorize="hasRole('STAFF')">
    <div th:replace="fragments/sidebarstaff :: sidebar-staff"></div>
  </div>

  <div class="content-body">
    <div th:replace="fragments/header :: header('Quản lý giảm giá', 'Giảm giá')"></div>

    <div th:if="${mess}" class="alert alert-danger alert-dismissible fade show mt-2" role="alert">
      <span th:text="${mess}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card card-custom mt-3">
      <div class="card-header text-white" style="background:#c92327;">
        <h5 class="mb-0 d-flex align-items-center gap-2" style="font-size: 1rem; font-weight: 600;">
          <i class="bi bi-search"></i>
          <span>Bộ lọc tìm kiếm chương trình giảm giá</span>
        </h5>
      </div>

      <div class="card-body bg-light p-3">
        <div class="row g-3 align-items-end">

          <div class="col-md-3">
            <form th:action="@{/giamgia/locten}" method="get">
              <label class="form-label-custom mb-1 d-block" style="font-size: 0.85rem;">Tìm kiếm theo tên/mã</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-secondary fw-bold">GG</span>
                <input type="text" name="ten" th:value="${param.ten}" class="form-control" placeholder="Nhập tên/mã rồi ấn Enter...">
                <button class="btn text-white" type="submit" style="background: #c92327;"><i class="bi bi-search"></i></button>
              </div>
            </form>
          </div>

          <div class="col-md-2">
            <form th:action="@{/giamgia/loctt}" method="get" id="formLocTT">
              <label class="form-label-custom mb-1 d-block" style="font-size: 0.85rem;">Trạng thái</label>
              <select name="tt" class="form-select" onchange="document.getElementById('formLocTT').submit()">
                <option value="" th:selected="${param.tt == null || param.tt[0] == ''}">Tất cả</option>
                <option value="Hoạt động" th:selected="${param.tt != null && param.tt[0] == 'Hoạt động'}">Hoạt động</option>
                <option value="Ngừng hoạt động" th:selected="${param.tt != null && param.tt[0] == 'Ngừng hoạt động'}">Ngừng hoạt động</option>
              </select>
            </form>
          </div>

          <div class="col-md-2">
            <form th:action="@{/giamgia/loclg}" method="get" id="formLocLG">
              <label class="form-label-custom mb-1 d-block" style="font-size: 0.85rem;">Loại giảm</label>
              <select name="lg" class="form-select" onchange="document.getElementById('formLocLG').submit()">
                <option value="" th:selected="${param.lg == null || param.lg[0] == ''}">Tất cả</option>
                <option value="PhanTram" th:selected="${param.lg != null && param.lg[0] == 'PhanTram'}">Phần trăm</option>
                <option value="Số tiền" th:selected="${param.lg != null && param.lg[0] == 'Số tiền'}">Số tiền cụ thể</option>
              </select>
            </form>
          </div>

          <div class="col-md-5">
            <form th:action="@{/giamgia/locngay}" method="get" class="row g-2 align-items-end">
              <div class="col-sm-5">
                <label class="form-label-custom mb-1 d-block" style="font-size: 0.85rem;">Từ ngày</label>
                <input type="datetime-local" name="ngaybdau" th:value="${param.ngaybdau}" class="form-control" required>
              </div>
              <div class="col-sm-5">
                <label class="form-label-custom mb-1 d-block" style="font-size: 0.85rem;">Đến ngày</label>
                <input type="datetime-local" name="ngaykthuc" th:value="${param.ngaykthuc}" class="form-control" required>
              </div>
              <div class="col-sm-2 text-end">
                <button type="submit" class="btn text-white w-100 fw-semibold" style="background:#c92327; padding: 0.55rem 0;">
                  Lọc
                </button>
              </div>
            </form>
          </div>

        </div>

        <div class="row mt-3">
          <div class="col-md-12 d-flex justify-content-between">
            <a th:href="@{/giamgia/index}" class="btn btn-outline-secondary fw-semibold">
              <i class="bi bi-arrow-clockwise"></i> Reset bộ lọc
            </a>
            <button type="button" class="btn fw-semibold text-white px-4" style="background:#c92327;" data-bs-toggle="modal" data-bs-target="#giamGiaModal" onclick="openAddModal()">
              <i class="bi bi-plus-lg"></i> Thêm mới giảm giá
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-card mt-3" style="overflow-x: auto;">
      <table class="table-custom">
        <thead>
        <tr>
          <th>STT</th>
          <th>Mã</th>
          <th>Tên chương trình</th>
          <th>Phân loại</th>
          <th>Hình thức</th>
          <th>Giá trị giảm</th>
          <th>Số lượng</th>
          <th>Giảm tối đa</th>
          <th>Bắt đầu</th>
          <th>Kết thúc</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="gg, stt : ${list}">
          <td th:text="${stt.count}"></td>
          <td th:text="${ 'GG' + gg.maGiamGia}"></td>
          <td th:text="${gg.tenGiamGia}"></td>
          <td>
            <span th:if="${gg.loaiVoucher == 'HOA_DON'}" class="badge bg-primary text-white">Hóa đơn</span>
            <span th:if="${gg.loaiVoucher == 'SHIP'}" class="badge bg-info text-dark">Freeship</span>
            <span th:if="${gg.loaiVoucher == null || gg.loaiVoucher == ''}" class="text-muted">-</span>
          </td>
          <td th:text="${gg.loaiGiamGia == 'PhanTram' ? 'Phần trăm (%)' : 'Số tiền cố định'}"></td>
          <td th:text="${#numbers.formatDecimal(gg.giaTriGiam, 0, 'COMMA', 0, 'POINT') + (gg.loaiGiamGia == 'PhanTram' ? '%' : 'đ')}"></td>
          <td class="fw-bold" th:text="${gg.soLuong}">0</td>
          <td th:text="${gg.giamToiDa != null && gg.giamToiDa > 0 ? #numbers.formatDecimal(gg.giamToiDa, 0, 'COMMA', 0, 'POINT') + 'đ' : 'Không giới hạn'}"></td>
          <td th:text="${gg.ngayBatDau != null ? #temporals.format(gg.ngayBatDau, 'dd/MM/yyyy HH:mm') : '-'}"></td>
          <td th:text="${gg.ngayKetThuc != null ? #temporals.format(gg.ngayKetThuc, 'dd/MM/yyyy HH:mm') : '-'}"></td>
          <td>
            <span th:if="${gg.trangThai == 'Hoạt động'}" class="badge-active">Hoạt động</span>
            <span th:unless="${gg.trangThai == 'Hoạt động'}" class="badge-locked">Ngừng</span>
          </td>
          <td>
            <a class="btn-action-lock" th:href="@{/giamgia/edit/{id}(id=${gg.maGiamGia})}">
              <i class="bi bi-pencil-square"></i> Sửa
            </a>
            <a class="btn-trash ms-2" th:href="@{/giamgia/delete/{id}(id=${gg.maGiamGia})}" onclick="return confirm('Bạn có chắc chắn muốn ngừng hoạt động chương trình này?')">
              <i class="bi bi-trash3"></i>
            </a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(list)}">
          <td colspan="12" class="text-center text-muted py-4">Không tìm thấy chương trình giảm giá nào.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="giamGiaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header-custom d-flex align-items-center justify-content-between">
          <h5 class="mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-plus-circle"></i>
            <span>Thông Tin Chương Trình Giảm Giá</span>
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form th:object="${giamGia}" method="post">

          <input type="hidden"
                 th:name="${_csrf.parameterName}"
                 th:value="${_csrf.token}">

          <div class="modal-body">
            <input type="hidden" id="modalMaGiamGia" th:field="*{maGiamGia}">

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label-custom">Tên chương trình <span class="text-danger">*</span></label>
                <input type="text" th:field="*{tenGiamGia}" placeholder="Nhập tên chương trình..." th:classappend="${#fields.hasErrors('tenGiamGia')} ? 'is-invalid' : ''" class="form-control">
                <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('tenGiamGia')}" th:errors="*{tenGiamGia}"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label-custom">Áp dụng cho (Phân loại) <span class="text-danger">*</span></label>
                <select class="form-select" th:field="*{loaiVoucher}" th:classappend="${#fields.hasErrors('loaiVoucher')} ? 'is-invalid' : ''">
                  <option value="">-- Chọn phạm vi áp dụng --</option>
                  <option value="HOA_DON">Giảm giá tiền hàng (Hóa đơn)</option>
                  <option value="SHIP">Giảm giá phí vận chuyển (Freeship)</option>
                </select>
                <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('loaiVoucher')}" th:errors="*{loaiVoucher}"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label-custom">Hình thức giảm giá <span class="text-danger">*</span></label>
                <select class="form-select" th:field="*{loaiGiamGia}" th:classappend="${#fields.hasErrors('loaiGiamGia')} ? 'is-invalid' : ''">
                  <option value="">-- Chọn hình thức giảm --</option>
                  <option value="PhanTram">Phần trăm (%)</option>
                  <option value="Số tiền">Số tiền cụ thể (đ)</option>
                </select>
                <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('loaiGiamGia')}" th:errors="*{loaiGiamGia}"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label-custom">Giá trị giảm <span class="text-danger">*</span></label>
                <input type="number" step="0.01" th:field="*{giaTriGiam}" placeholder="Ví dụ: 10 (với %) hoặc 50000 (với tiền mặt)" th:classappend="${#fields.hasErrors('giaTriGiam')} ? 'is-invalid' : ''" class="form-control">
                <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('giaTriGiam')}" th:errors="*{giaTriGiam}"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label-custom">Số lượng phát hành <span class="text-danger">*</span></label>
                <input type="number" th:field="*{soLuong}" placeholder="Nhập số lượng mã (ví dụ: 100)..." th:classappend="${#fields.hasErrors('soLuong')} ? 'is-invalid' : ''" class="form-control">
                <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('soLuong')}" th:errors="*{soLuong}"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label-custom">Mức giảm tối đa</label>
                <input type="number" step="0.01" th:field="*{giamToiDa}" placeholder="Giới hạn số tiền giảm tối đa (nếu có)" th:classappend="${#fields.hasErrors('giamToiDa')} ? 'is-invalid' : ''" class="form-control">
                <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('giamToiDa')}" th:errors="*{giamToiDa}"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label-custom">Ngày bắt đầu <span class="text-danger">*</span></label>
                <input type="datetime-local"
                       th:value="${giamGia.ngayBatDau != null ? #temporals.format(giamGia.ngayBatDau,'yyyy-MM-dd''T''HH:mm') : ''}"
                       name="ngayBatDau"
                       class="form-control">
                <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('ngayBatDau')}" th:errors="*{ngayBatDau}"></div>
              </div>

              <div class="col-md-6">
                <label class="form-label-custom">Ngày kết thúc <span class="text-danger">*</span></label>
                <input type="datetime-local"
                       th:value="${giamGia.ngayKetThuc != null ? #temporals.format(giamGia.ngayKetThuc,'yyyy-MM-dd''T''HH:mm') : ''}"
                       name="ngayKetThuc"
                       class="form-control">
                <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('ngayKetThuc')}" th:errors="*{ngayKetThuc}"></div>
              </div>

              <div class="col-md-12">
                <label class="form-label-custom">Trạng thái hoạt động <span class="text-danger">*</span></label>
                <div class="radio-group" th:classappend="${#fields.hasErrors('trangThai')} ? 'is-invalid border-danger' : ''">
                  <div class="form-check m-0">
                    <input type="radio" class="form-check-input" th:field="*{trangThai}" value="Hoạt động" id="statusActive">
                    <label class="form-check-label" for="statusActive">Hoạt động</label>
                  </div>
                  <div class="form-check m-0">
                    <input type="radio" class="form-check-input" th:field="*{trangThai}" value="Ngừng hoạt động" id="statusInactive">
                    <label class="form-check-label" for="statusInactive">Ngừng hoạt động</label>
                  </div>
                </div>
                <div class="invalid-feedback d-block fw-bold small" th:if="${#fields.hasErrors('trangThai')}" th:errors="*{trangThai}"></div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">
              <i class="bi bi-x-circle"></i> Đóng
            </button>
            <button type="submit" id="btn-add-submit" th:formaction="@{/giamgia/add}" class="btn px-4" style="background:#c92327;color:white">
              <i class="bi bi-plus-circle-fill"></i> Lưu thông tin (Thêm)
            </button>
            <button type="submit" id="btn-update-submit" th:formaction="@{/giamgia/update}" class="btn btn-warning px-4" style="display: none;">
              <i class="bi bi-check-circle-fill"></i> Lưu cập nhật
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
  document.addEventListener("DOMContentLoaded", function () {
    /*[Th:inline]*/
    var showModalValue = /*[[${showModal != null ? showModal : false}]]*/ false;

    if (showModalValue) {
      var myModal = new bootstrap.Modal(document.getElementById('giamGiaModal'));
      myModal.show();

      var maGiamGia = document.getElementById("modalMaGiamGia").value;
      if (maGiamGia && maGiamGia !== "0") {
        document.getElementById("btn-add-submit").style.display = "none";
        document.getElementById("btn-update-submit").style.display = "block";
      } else {
        document.getElementById("btn-add-submit").style.display = "block";
        document.getElementById("btn-update-submit").style.display = "none";
      }
    }
  });

  function openAddModal() {
    document.getElementById("modalMaGiamGia").value = "0";
    document.getElementById("tenGiamGia").value = "";
    document.getElementById("giaTriGiam").value = "";
    document.getElementById("giamToiDa").value = "";
    document.getElementById("soLuong").value = ""; // Clear số lượng khi mở bảng thêm mới
    document.getElementById("ngayBatDau").value = "";
    document.getElementById("ngayKetThuc").value = "";
    document.getElementById("loaiGiamGia").selectedIndex = 0;
    document.getElementById("loaiVoucher").selectedIndex = 0; // Clear phân loại voucher

    document.querySelectorAll("input[name='trangThai']").forEach(r => r.checked = false);

    document.getElementById("btn-add-submit").style.display = "block";
    document.getElementById("btn-update-submit").style.display = "none";
  }
</script>
</body>
</html>
