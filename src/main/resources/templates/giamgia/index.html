<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quản Lý Giảm Giá</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">

  <style>
    .modal-content {
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .modal-header-custom {
      background: #c92327;
      color: white;
      padding: 1rem 1.5rem;
      border-bottom: none;
    }
    .modal-body {
      padding: 2rem 1.5rem;
      background-color: #f8f9fa;
    }
    .modal-footer {
      background-color: #ffffff;
      border-top: 1px solid #dee2e6;
      padding: 1rem 1.5rem;
    }
    .form-label-custom {
      font-weight: 600;
      color: #495057;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-control, .form-select {
      border-radius: 6px;
      border: 1px solid #ced4da;
      padding: 0.55rem 0.75rem;
      transition: all 0.2s ease-in-out;
    }
    .form-control:focus, .form-select:focus {
      border-color: #c92327 !important;
      box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
    }
    .radio-group {
      background: #ffffff;
      border: 1px solid #ced4da;
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .radio-group input[type="radio"] {
      accent-color: #c92327;
    }
  </style>
</head>

<body>

<div class="wrapper">
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <div class="content-body">
    <div th:replace="fragments/header :: header('Quản lý giảm giá', 'Giảm giá')"></div>

    <div th:if="${mess}" class="alert alert-danger alert-dismissible fade show mt-2" role="alert">
      <span th:text="${mess}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show mt-2" role="alert">
      <span th:text="${param.error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card card-custom mt-3">
      <div class="card-header text-white" style="background:#c92327;">
        <h5 class="mb-0 d-flex align-items-center gap-2" style="font-size: 1rem; font-weight: 600;">
          <i class="bi bi-search"></i>
          <span>Bộ lọc tìm kiếm chương trình giảm giá</span>
        </h5>
      </div>

      <div class="card-body bg-light p-3">
        <div class="row g-3 align-items-end">

          <form th:action="@{/giamgia/index}" method="get" id="searchForm" class="row g-3 align-items-end">

            <div class="col-md-3">
              <label class="form-label-custom mb-1 d-block">Tìm kiếm</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-secondary fw-bold">GG</span>
                <input type="text" name="keyword" th:value="${param.keyword}" class="form-control" placeholder="Nhập tên/mã...">
              </div>
            </div>

            <div class="col-md-2">
              <label class="form-label-custom mb-1 d-block">Trạng thái</label>
              <select name="tt" class="form-select" onchange="document.getElementById('searchForm').submit()">
                <option value="">Tất cả</option>
                <option value="Hoạt động" th:selected="${param.tt == 'Hoạt động'}">Hoạt động</option>
                <option value="Sắp hoạt động" th:selected="${param.tt == 'Sắp hoạt động'}">Sắp hoạt động</option>
                <option value="Ngừng hoạt động" th:selected="${param.tt == 'Ngừng hoạt động'}">Ngừng hoạt động</option>
              </select>
            </div>

            <div class="col-md-2">
              <label class="form-label-custom mb-1 d-block">Loại giảm</label>
              <select name="lg" class="form-select" onchange="document.getElementById('searchForm').submit()">
                <option value="">Tất cả</option>
                <option value="PhanTram" th:selected="${param.lg == 'PhanTram'}">Phần trăm</option>
                <option value="Sotien" th:selected="${param.lg == 'Sotien'}">Số tiền cụ thể</option>
              </select>
            </div>

            <div class="col-md-5 d-flex gap-2">
              <div class="flex-grow-1">
                <label class="form-label-custom mb-1 d-block">Từ ngày</label>
                <input type="datetime-local" name="ngaybdau" th:value="${param.ngaybdau}" class="form-control">
              </div>
              <div class="flex-grow-1">
                <label class="form-label-custom mb-1 d-block">Đến ngày</label>
                <input type="datetime-local" name="ngaykthuc" th:value="${param.ngaykthuc}" class="form-control">
              </div>
              <button type="submit" class="btn text-white" style="background:#c92327; margin-top: 22px;">
                <i class="bi bi-funnel"></i> Lọc
              </button>
            </div>
          </form>

        </div>

        <div class="row mt-3">
          <div class="col-md-12 d-flex justify-content-between">
            <a th:href="@{/giamgia/index}" class="btn btn-outline-secondary fw-semibold">
              <i class="bi bi-arrow-clockwise"></i> Reset bộ lọc
            </a>
            <a th:href="@{/giamgia/create}" class="btn fw-semibold text-white px-4" style="background:#c92327;">
              <i class="bi bi-plus-lg"></i> Thêm mới giảm giá
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="table-card mt-3" style="overflow-x: auto;">
      <table class="table-custom">
        <thead>
        <tr>
          <th>STT</th>
          <th>Mã giảm gi</th>
          <th>Tên giảm giá</th>
          <th>Loại phiếu</th>
          <th>Giá trị giảm</th>
          <th>Đơn tối thiếu</th>
          <th>Số lượng</th>
          <th>Giảm tối đa</th>
          <th>Bắt đầu</th>
          <th>Kết thúc</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="gg, stt : ${list}">
          <td th:text="${stt.count}"></td>
          <td th:text="${ 'GG' + gg.maGiamGia}"></td>
          <td th:text="${gg.tenGiamGia}"></td>

          <td>
            <span th:if="${gg.loaiApDung == 1}" class="badge bg-danger text-white">Công khai</span>
            <span th:if="${gg.loaiApDung == 2}" class="badge bg-danger text-white">Cá nhân</span>
            <span th:if="${gg.loaiApDung == null}" class="text-muted">-</span>
          </td>

          <td th:text="${#numbers.formatDecimal(gg.giaTriGiam, 0, 'COMMA', 0, 'POINT') + (gg.loaiGiamGia == 'PhanTram' ? '%' : 'đ')}"></td>
          <td th:text="${#numbers.formatDecimal(gg.donToiThieu, 0, 'COMMA', 0, 'POINT') + (gg.donToiThieu == 'PhanTram' ? '%' : 'đ')}"></td>
          <td class="fw-bold" th:text="${gg.soLuong}">0</td>
          <td th:text="${gg.giamToiDa != null && gg.giamToiDa > 0 ? #numbers.formatDecimal(gg.giamToiDa, 0, 'COMMA', 0, 'POINT') + 'đ' : 'Không giới hạn'}"></td>
          <td th:text="${gg.ngayBatDau != null ? #temporals.format(gg.ngayBatDau, 'dd/MM/yyyy HH:mm') : '-'}"></td>
          <td th:text="${gg.ngayKetThuc != null ? #temporals.format(gg.ngayKetThuc, 'dd/MM/yyyy HH:mm') : '-'}"></td>
          <td>
    <span th:if="${gg.trangThai != null}"
          class="badge bg-danger text-white"
          th:text="${gg.trangThai}">
    </span>
            <span th:if="${gg.trangThai == null}" class="text-muted">-</span>
          </td>
          <td>
            <a class="btn btn-sm btn-danger text-white" th:href="@{/giamgia/edit/{id}(id=${gg.maGiamGia})}">
              <i class="bi bi-pencil-square"></i>
            </a>
            <a class="btn btn-sm btn-danger ms-2 text-white" th:href="@{/giamgia/delete/{id}(id=${gg.maGiamGia})}" onclick="return confirm('Bạn có chắc chắn muốn ngừng hoạt động chương trình này?')">
              <i class="bi bi-trash3"></i>
            </a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(list)}">
          <td colspan="12" class="text-center text-muted py-4">Không tìm thấy chương trình giảm giá nào.</td>
        </tr>
        </tbody>
      </table>
      <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center px-4 py-3" th:if="${totalPages > 0}">
        <div class="small text-muted fw-semibold">
          Tổng số bản ghi: <span class="fw-semibold text-dark" th:text="${totalItems}">0</span>
          (Trang <span class="fw-semibold text-dark" th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span>)
        </div>

        <nav aria-label="Page navigation">
          <ul class="pagination pagination-sm mb-0 gap-1">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
              <a class="page-link rounded-2 border-0 d-flex align-items-center justify-content-center text-danger"
                 th:href="@{/giamgia/index(page=${currentPage - 1}, keyword=${param.keyword}, tt=${param.tt}, lg=${param.lg})}">
                <i class="bi bi-chevron-left"></i>
              </a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${currentPage == i} ? 'active'">
              <a class="page-link rounded-2 border-0 d-flex align-items-center justify-content-center fw-semibold"
                 th:style="${currentPage == i} ? 'background-color:#c92327; color:#fff;' : ''"
                 th:href="@{/giamgia/index(page=${i}, keyword=${param.keyword}, tt=${param.tt}, lg=${param.lg})}"
                 th:text="${i + 1}">
              </a>
            </li>

            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
              <a class="page-link rounded-2 border-0 d-flex align-items-center justify-content-center text-danger"
                 th:href="@{/giamgia/index(page=${currentPage + 1}, keyword=${param.keyword}, tt=${param.tt}, lg=${param.lg})}">
                <i class="bi bi-chevron-right"></i>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
  document.addEventListener("DOMContentLoaded", function () {
    /*[Th:inline]*/
    var showModalValue = /*[[${showModal != null ? showModal : false}]]*/ false;

    if (showModalValue) {
      var myModal = new bootstrap.Modal(document.getElementById('giamGiaModal'));
      myModal.show();

      var maGiamGia = document.getElementById("modalMaGiamGia").value;
      if (maGiamGia && maGiamGia !== "0") {
        document.getElementById("btn-add-submit").style.display = "none";
        document.getElementById("btn-update-submit").style.display = "block";
      } else {
        document.getElementById("btn-add-submit").style.display = "block";
        document.getElementById("btn-update-submit").style.display = "none";
      }
    }
  });

  function openAddModal() {
    document.getElementById("modalMaGiamGia").value = "0";
    document.getElementById("tenGiamGia").value = "";
    document.getElementById("giaTriGiam").value = "";
    document.getElementById("giamToiDa").value = "";
    document.getElementById("soLuong").value = "";
    document.getElementById("ngayBatDau").value = "";
    document.getElementById("ngayKetThuc").value = "";
    document.getElementById("loaiGiamGia").selectedIndex = 0;
    document.getElementById("loaiVoucher").selectedIndex = 0;

    document.querySelectorAll("input[name='trangThai']").forEach(r => r.checked = false);

    document.getElementById("btn-add-submit").style.display = "block";
    document.getElementById("btn-update-submit").style.display = "none";
  }


    function submitForm() {
    document.getElementById('filterForm').submit();
  }

</script>
</body>
</html>
