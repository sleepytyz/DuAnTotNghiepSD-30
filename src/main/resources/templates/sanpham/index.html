<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm - FS Shop</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS chung -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-wrapper">

        <div th:replace="fragments/header :: header('Quản lý sản phẩm', 'Sản phẩm')"></div>

        <div class="content-body">

        <div th:if="${mess}" class="alert alert-danger"><span th:text="${mess}"></span></div>

            <div class="card card-custom mb-4">

                <div class="card-header text-white"
                     style="background:#c92327;">
                    <h5 class="mb-0">
                        <i class="bi bi-pencil-square me-2"></i>
                        Thông tin sản phẩm
                    </h5>
                </div>

            <form method="post" th:object="${sanpham}" class="card-body">

                <div class="row g-3">

                    <!-- Mã SP -->
                    <div class="col-md-6">
                        <label class="filter-label">Mã sản phẩm</label>
                        <input type="text" th:field="*{maSanPham}" readonly class="form-control bg-light">
                    </div>

                    <!-- Danh mục -->
                    <div class="col-md-6">
                        <label class="filter-label">Danh mục</label>
                        <select th:field="*{danhMucSanPham.maDanhMuc}" class="form-select">
                            <option th:each="c : ${listdmsp}"
                                    th:value="${c.maDanhMuc}"
                                    th:text="${c.maDanhMuc + ' - ' + c.tenDanhMuc}">
                            </option>
                        </select>
                    </div>

                    <!-- Tên SP -->
                    <div class="col-md-6">
                        <label class="filter-label">Tên sản phẩm</label>
                        <input type="text" th:field="*{tenSanPham}" class="form-control">
                        <div th:if="${#fields.hasErrors('tenSanPham')}" th:errors="*{tenSanPham}"></div>
                    </div>

                    <!-- Mô tả -->
                    <div class="col-md-6">
                        <label class="filter-label">Mô tả</label>
                        <input type="text" th:field="*{moTa}" class="form-control">
                        <div th:if="${#fields.hasErrors('moTa')}" th:errors="*{moTa}"></div>
                    </div>

                    <!-- Chất liệu -->
                    <div class="col-md-6">
                        <label class="filter-label">Chất liệu</label>
                        <input type="text" th:field="*{chatLieu}" class="form-control">
                        <div th:if="${#fields.hasErrors('chatLieu')}" th:errors="*{chatLieu}"></div>

                    </div>

                    <!-- Trạng thái -->
                    <div class="col-md-6">
                        <label class="filter-label">Trạng thái</label>
                        <div>
                            <input type="radio" th:field="*{trangThai}" value="true"> Còn bán
                            <input type="radio" th:field="*{trangThai}" value="false" class="ms-3"> Ngừng bán
                        </div>
                        <div th:if="${#fields.hasErrors('trangThai')}" th:errors="*{trangThai}"></div>

                    </div>

                    <!-- Ngày tạo -->
                    <div class="col-md-6">
                        <label class="filter-label">Ngày tạo</label>
                        <input type="date"
                               th:value="${#temporals.format(sanpham.ngayTao, 'yyyy-MM-dd')}"
                               class="form-control bg-light" readonly>
                    </div>

                    <!-- Ngày cập nhật -->
                    <div class="col-md-6">
                        <label class="filter-label">Ngày cập nhật</label>
                        <input type="date"
                               th:value="${#temporals.format(sanpham.ngayCapNhat, 'yyyy-MM-dd')}"
                               class="form-control bg-light" readonly>
                    </div>

                </div>

                <!-- BUTTON -->
                <div class="d-flex gap-2 mt-3">

                    <button type="submit" class="btn-add-account" formaction="/sanpham/add">
                        <i class="bi bi-plus-lg"></i> Thêm
                    </button>

                    <button type="submit" class="btn-action-lock" formaction="/sanpham/update">
                        Sửa
                    </button>

                    <input type="button" class="btn btn-secondary" onclick="resetForm()" value="Reset">

                    <a class="btn btn-primary" th:href="@{/sanphamct/index}">
                        Sản phẩm chi tiết
                    </a>

                </div>

            </form>
        </div>

        <!-- TABLE -->
        <div class="table-card mt-4">

            <table class="table-custom">

                <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã SP</th>
                    <th>Danh mục</th>
                    <th>Tên SP</th>
                    <th>Mô tả</th>
                    <th>Chất liệu</th>
                    <th>Ngày tạo</th>
                    <th>Ngày cập nhật</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="c,count : ${listsp}">

                    <td th:text="${count.count}"></td>
                    <td th:text="${c.maSanPham}"></td>
                    <td th:text="${c.danhMucSanPham.maDanhMuc + '-' + c.danhMucSanPham.tenDanhMuc}"></td>
                    <td th:text="${c.tenSanPham}"></td>
                    <td th:text="${c.moTa}"></td>
                    <td th:text="${c.chatLieu}"></td>
                    <td th:text="${c.ngayTao}"></td>
                    <td th:text="${c.ngayCapNhat}"></td>

                    <td>
                        <span th:if="${c.trangThai}" class="badge-active">Còn bán</span>
                        <span th:if="${!c.trangThai}" class="badge-locked">Ngừng bán</span>
                    </td>

                    <td>
                        <a class="btn-action-lock"
                           th:href="@{/sanpham/edit/{id}(id=${c.maSanPham})}">
                            Xem
                        </a>

                        <a class="btn-trash ms-2"
                           th:href="@{/sanpham/delete/{id}(id=${c.maSanPham})}"
                           onclick="return confirm('Xóa sản phẩm này?')">
                            <i class="bi bi-trash3"></i>
                        </a>
                    </td>

                </tr>
                </tbody>

            </table>

        </div>

    </div>
</div>

<!-- SCRIPT -->
<script>
    function resetForm(){
        document.querySelectorAll("form input").forEach(i => {
            if(i.type !== "radio" && i.type !== "submit") i.value = "";
        });

        document.querySelectorAll("input[type=radio]").forEach(r => r.checked = false);
    }
</script>

</body>
</html>
