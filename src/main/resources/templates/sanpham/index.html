<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<div th:if="${mess}" class="alert alert-danger"><span th:text="${mess}"></span></div>



<form method="post" th:object="${sanpham}">


    <label >Mã Sản phẩm</label>
    <input type="text" th:field="*{maSanPham}" readonly class="form-control" id="masanpham">
    <div th:if="${#fields.hasErrors('maSanPham')}" th:errors="*{maSanPham}"></div>
    <br>


    <div>
        <label>Mã danh mục</label>
        <div>
            <select id="madanhmuc" th:field="*{danhMucSanPham.maDanhMuc}" class="form-control">
                <option th:each="c : ${listdmsp}" th:value="${c.maDanhMuc}" th:text="${c.maDanhMuc + '-' + c.tenDanhMuc}"></option>
            </select>
        </div>
    </div>

    <label >Tên Sản phẩm</label>
    <input type="text" th:field="*{tenSanPham}" class="form-control" id="tensanpham">
    <div th:if="${#fields.hasErrors('tenSanPham')}" th:errors="*{tenSanPham}"></div>
    <br>

    <label >Mô tả</label>
    <input type="text" th:field="*{moTa}" class="form-control" id="mota">
    <div th:if="${#fields.hasErrors('moTa')}" th:errors="*{moTa}"></div>
    <br>

    <label >Chất liệu</label>
    <input type="text" th:field="*{chatLieu}" class="form-control" id="chatlieu">
    <div th:if="${#fields.hasErrors('chatLieu')}" th:errors="*{chatLieu}"></div>
    <br>

    <label >Trạng thái</label>
    <input type="radio" th:field="*{trangThai}" id="1" value="true"> Còn bán
    <input type="radio" th:field="*{trangThai}" id="2"  value="false"> Ngừng bán
    <div th:if="${#fields.hasErrors('trangThai')}" th:errors="*{trangThai}"></div>
    <br>

    <label >Ngày tạo</label>
    <input type="date" th:value="${#temporals.format(sanpham.ngayTao, 'yyyy-MM-dd')}"  name="ngayTao" class="form-control" id="ngaytao" readonly>
    <div th:if="${#fields.hasErrors('maSanPham')}" th:errors="*{maSanPham}"></div>
    <br>

    <label >Ngày cập nhật</label>
    <input type="date" th:value="${#temporals.format(sanpham.ngayCapNhat, 'yyyy-MM-dd')}"  name="ngayCapNhat" class="form-control" id="ngaycapnhat" readonly>
    <div th:if="${#fields.hasErrors('ngayCapNhat')}" th:errors="*{ngayCapNhat}"></div>
    <br>

    <div>
        <button type="submit" class="btn" formaction="/sanpham/add">Them</button>
        <button type="submit" class="btn" formaction="/sanpham/update">Sua</button>
        <input type="button" onclick="resetForm()" value="Reset">
        <a type="submit" class="btn btn-primary" th:href="@{/sanphamct/index}" >Sản phẩm chi tiết</a>
    </div>

</form>

</div>

<table class="table">
    <thead>
        <th>STT</th>
        <th>Mã sản phẩm</th>
        <th>Mã danh mục</th>
        <th>Tên sản phẩm</th>
        <th>Mô tả</th>
        <th>Chất liệu</th>
        <th>Ngày tạo</th>
        <th>Ngày cập nhật</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
    </thead>
    <tbody>
        <tr th:each="c,count : ${listsp}">
            <td th:text="${count.count}"></td>
            <td th:text="${c.maSanPham}"></td>
            <td th:text="${c.danhMucSanPham.maDanhMuc + '-' + c.danhMucSanPham.tenDanhMuc}"></td>
            <td th:text="${c.tenSanPham}"></td>
            <td th:text="${c.moTa}"></td>
            <td th:text="${c.chatLieu}"></td>
            <td th:text="${c.ngayTao}"></td>
            <td th:text="${c.ngayCapNhat}"></td>
            <td th:text="${c.trangThai == true ? 'Còn bán':'Ngừng bán'}"></td>
            <td>
                <a th:href="@{/sanpham/edit/{id}(id=${c.maSanPham})}"> Xem</a>
                <a th:href="@{/sanpham/delete/{id}(id=${c.maSanPham})}"> Xoa</a>
            </td>
        </tr>
    </tbody>
</table>

<script>
    function resetForm(){
        document.getElementById("masanpham").value = "";
        document.getElementById("tensanpham").value = "";
        document.getElementById("ngaytao").value = "";
        document.getElementById("ngaycapnhat").value = "";
        document.getElementById("1").checked = false;
        document.getElementById("2").checked = false;
        document.getElementById("chatlieu").value = "";
        document.getElementById("mota").value = "";
    }
</script>

</body>
</html>
