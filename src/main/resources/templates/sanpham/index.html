<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm - FS Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .content-wrapper{
            width: calc(100% - 250px);
        }

    </style>
</head>

<body>
<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-wrapper">

        <div th:replace="fragments/header :: header('Quản lý sản phẩm', 'Sản phẩm')"></div>

        <div class="content-body">

        <div th:if="${mess}" class="alert alert-danger"><span th:text="${mess}"></span></div>

            <div class="card card-custom mb-4">

                <div class="card-header text-white"
                     style="background:#c92327;">
                    <h5 class="mb-0">
                        <i class="bi bi-pencil-square me-2"></i>
                        Bộ lọc & tìm kiếm sản phẩm
                    </h5>
                </div>

                <div class="card-body">

                    <div class="row g-3 align-items-end">

                        <div class="col-md-3">
                            <form action="/sanpham/locdmsp" method="get">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-tags"></i> Danh mục
                                </label>

                                <select name="maDanhMuc"
                                        class="form-select"
                                        onchange="this.form.submit()">

                                    <option value="">Tất cả danh mục</option>

                                    <option th:each="c : ${listdmsp}"
                                            th:value="${c.maDanhMuc}"
                                            th:text="${c.maDanhMuc + ' - ' + c.tenDanhMuc}">
                                    </option>

                                </select>
                            </form>
                        </div>

                        <div class="col-md-3">
                            <form action="/sanpham/loctt" method="get">

                                <label class="form-label fw-bold">
                                    <i class="bi bi-check-circle"></i> Trạng thái
                                </label>

                                <div class="mt-2">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="tt"
                                           value="true"
                                           onchange="this.form.submit()">
                                    Còn bán

                                    <input class="form-check-input ms-3"
                                           type="radio"
                                           name="tt"
                                           value="false"
                                           onchange="this.form.submit()">
                                    Ngừng bán
                                </div>

                            </form>
                        </div>

                        <div class="col-md-4">
                            <form action="/sanpham/timkiem"
                                  method="get">

                                <label class="form-label fw-bold">
                                    <i class="bi bi-search"></i> Tìm kiếm
                                </label>

                                <div class="input-group">

                                    <input type="text"
                                           class="form-control"
                                           placeholder="Nhập mã hoặc tên sản phẩm"
                                           name="t">

                                    <button class="btn btn-primary"
                                            type="submit">
                                        <i class="bi bi-search"></i>
                                    </button>

                                </div>

                            </form>
                        </div>

                        <div class="col-md-2 text-end">

                            <button type="button"
                                    class="btn  me-2"
                                    data-bs-toggle="modal"
                                    data-bs-target="#sanPhamModal" onclick="openAddModal()" style="background:#c92327; color: white">

                                <i class="bi bi-plus-lg"></i>
                                Thêm

                            </button>

                            <a th:href="@{/templates/sanpham/index}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-clockwise"></i>
                                Reset

                            </a>

                        </div>

                    </div>

                </div>

        <div class="table-card mt-4">

            <table class="table-custom">

                <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã SP</th>
                    <th>Danh mục</th>
                    <th>Tên SP</th>
                    <th>Mô tả</th>
                    <th>Chất liệu</th>
                    <th>Ngày tạo</th>
                    <th>Ngày cập nhật</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="c,count : ${listsp}">

                    <td th:text="${count.count}"></td>
                    <td th:text="${c.maSanPham}"></td>
                    <td th:text="${c.danhMucSanPham.maDanhMuc + '-' + c.danhMucSanPham.tenDanhMuc}"></td>
                    <td th:text="${c.tenSanPham}"></td>
                    <td th:text="${c.moTa}"></td>
                    <td th:text="${c.chatLieu.tenChatLieu}"></td>
                    <td th:text="${c.ngayTao}"></td>
                    <td th:text="${c.ngayCapNhat}"></td>

                    <td>
                        <span th:if="${c.trangThai}" class="badge-active">Còn bán</span>
                        <span th:if="${!c.trangThai}" class="badge-locked">Ngừng bán</span>
                    </td>

                    <td>
                        <a class="btn-action-lock"
                           th:href="@{/templates/sanpham/edit/{id}(id=${c.maSanPham})}">
                            Xem
                        </a>

                        <a class="btn-trash ms-2"
                           th:href="@{/templates/sanpham/delete/{id}(id=${c.maSanPham})}"
                           onclick="return confirm('Xóa sản phẩm này?')">
                            <i class="bi bi-trash3"></i>
                        </a>
                    </td>

                </tr>
                </tbody>

            </table>

        </div>

    </div>
</div>
<script>
    function resetForm(){
        document.querySelectorAll("form input").forEach(i => {
            if(i.type !== "radio" && i.type !== "submit") i.value = "";
        });

        document.querySelectorAll("input[type=radio]").forEach(r => r.checked = false);
    }
</script>
    <div class="modal fade" id="sanPhamModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle"></i>
                        Thêm & Sửa sản phẩm
                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <form method="post"
                      th:action="@{/templates/sanpham/add}"
                      th:object="${sanpham}">

                    <div class="modal-body">

                        <div class="row g-3">
                            <input type="hidden" th:field="*{maSanPham}">

                            <div class="col-md-6">
                                <label>Tên sản phẩm</label>
                                <input type="text"
                                       th:field="*{tenSanPham}"
                                       class="form-control">

                                <div class="text-danger"
                                     th:if="${#fields.hasErrors('tenSanPham')}"
                                     th:text="${#fields.errors('tenSanPham')[0]}">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label>Mô tả</label>
                                <input type="text"
                                       th:field="*{moTa}"
                                       class="form-control">

                                <div class="text-danger"
                                     th:if="${#fields.hasErrors('moTa')}"
                                     th:text="${#fields.errors('moTa')[0]}">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label>Chất liệu</label>
                                <select class="form-control" th:field="*{chatLieu.maChatLieu}">
                                    <option th:each="c : ${listcl}" th:value="${c.maChatLieu}" th:text="${c.tenChatLieu}"></option>
                                </select>

                                <div class="text-danger"
                                     th:if="${#fields.hasErrors('chatLieu')}"
                                     th:text="${#fields.errors('chatLieu')[0]}">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label>Danh mục</label>

                                <select th:field="*{danhMucSanPham.maDanhMuc}"
                                        class="form-select">

                                    <option th:each="c : ${listdmsp}"
                                            th:value="${c.maDanhMuc}"
                                            th:text="${c.tenDanhMuc}">
                                    </option>

                                </select>
                            </div>

                            <div class="col-md-6">
                                <label>Trạng thái</label>

                                <div>
                                    <input type="radio"
                                           th:field="*{trangThai}"
                                           value="true">
                                    Còn bán

                                    <input type="radio"
                                           th:field="*{trangThai}"
                                           value="false"
                                           class="ms-3">
                                    Ngừng bán
                                </div>

                                <div class="text-danger"
                                     th:if="${#fields.hasErrors('trangThai')}"
                                     th:text="${#fields.errors('trangThai')[0]}">
                                </div>
                            </div>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            <i class="bi bi-x-circle"></i> Đóng
                        </button>

                        <button type="submit"
                                formaction="/sanpham/add"
                                class="btn "
                                th:if="${isEdit == null}" style="background:#c92327; color: white">
                            <i class="bi bi-plus-circle"></i> Thêm
                        </button>

                        <button type="submit"
                                formaction="/sanpham/update"
                                class="btn btn-warning"
                                th:if="${isEdit != null}">
                            <i class="bi bi-pencil-square"></i> Sửa
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${showModal}">
    document.addEventListener("DOMContentLoaded", function () {
        new bootstrap.Modal(
            document.getElementById('sanPhamModal')
        ).show();
    });
</script>
<script>
    function openAddModal() {

        document.querySelector("[name='maSanPham']").value = "";
        document.querySelector("[name='tenSanPham']").value = "";
        document.querySelector("[name='moTa']").value = "";
        document.querySelector("[name='chatLieu']").value = "";

        document.querySelectorAll("input[name='trangThai']")
            .forEach(r => r.checked = false);

        document.getElementById("btnThem").classList.remove("d-none");
        document.getElementById("btnSua").classList.add("d-none");

        bootstrap.Modal.getOrCreateInstance(
            document.getElementById("sanPhamModal")
        ).show();
    }
</script>
</body>
</html>
