<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm - FS Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        /* ===== TOAST ===== */
        .toast-container-custom {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 420px;
            width: 100%;
        }
        .toast-custom {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #dc3545;
            animation: slideInRight 0.4s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .toast-custom.success {
            border-left-color: #28a745;
        }
        .toast-custom.warning {
            border-left-color: #ffc107;
        }
        .toast-custom .toast-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .toast-custom .toast-content {
            flex: 1;
        }
        .toast-custom .toast-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #2d3748;
        }
        .toast-custom .toast-message {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 2px;
        }
        .toast-custom .toast-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #adb5bd;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .toast-custom .toast-close:hover {
            color: #dc3545;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* ===== CUSTOM CSS ===== */
        .content-wrapper {
            width: calc(100% - 250px);
        }

        /* Card styling */
        .card-custom {
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .card-custom:hover {
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08) !important;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #c92327 0%, #a01a1e 100%);
            border: none;
            padding: 14px 24px;
        }
        .card-header-custom h5 {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.3px;
            color: white;
        }
        .card-header-custom .bi {
            font-size: 1.2rem;
        }

        /* Filter form */
        .filter-form {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }
        .filter-form .form-label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #2d3748;
            margin-bottom: 4px;
        }
        .filter-form .form-control,
        .filter-form .form-select {
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 0.85rem;
            padding: 8px 12px;
            transition: all 0.3s ease;
        }
        .filter-form .form-control:focus,
        .filter-form .form-select:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.2rem rgba(201, 35, 39, 0.12) !important;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }
        .toolbar .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar .btn-toolbar {
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar .btn-add {
            background: #c92327;
            color: white;
            border: none;
        }
        .toolbar .btn-add:hover {
            background: #a01a1e;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(201, 35, 39, 0.3);
        }
        .toolbar .btn-export {
            background: #28a745;
            color: white;
            border: none;
        }
        .toolbar .btn-export:hover {
            background: #1e7e34;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }
        .toolbar .btn-reset-toolbar {
            background: #6c757d;
            color: white;
            border: none;
        }
        .toolbar .btn-reset-toolbar:hover {
            background: #5a6268;
            color: white;
            transform: translateY(-1px);
        }

        /* Table */
        .table-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
        }
        .table-custom {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            table-layout: fixed;
        }
        .table-custom thead {
            background: linear-gradient(135deg, #f8f9fa 0%, #f1f3f5 100%);
            border-bottom: 2px solid #e9ecef;
        }
        .table-custom thead th {
            padding: 10px 8px;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #495057;
            border-bottom: none;
            white-space: nowrap;
            text-align: center;
        }
        .table-custom tbody tr {
            transition: all 0.2s ease;
            border-bottom: 1px solid #f1f3f5;
        }
        .table-custom tbody tr:hover {
            background: #fff5f5 !important;
        }
        .table-custom tbody td {
            padding: 10px 8px;
            vertical-align: middle;
            color: #2d3748;
            text-align: center;
            word-break: break-word;
        }

        /* ===== ĐỘ RỘNG CÁC CỘT ===== */
        .table-custom .col-stt {
            width: 35px;
            min-width: 35px;
            max-width: 35px;
        }
        .table-custom .col-ma {
            width: 80px;
            min-width: 80px;
            max-width: 80px;
        }
        .table-custom .col-ten {
            width: 150px;
            min-width: 150px;
            max-width: 150px;
        }
        .table-custom .col-thuonghieu {
            width: 110px;
            min-width: 110px;
            max-width: 110px;
        }
        .table-custom .col-mota {
            width: 150px;
            min-width: 150px;
            max-width: 150px;
        }
        .table-custom .col-gia {
            width: 130px;
            min-width: 130px;
            max-width: 130px;
        }
        .table-custom .col-ton {
            width: 60px;
            min-width: 60px;
            max-width: 60px;
        }
        .table-custom .col-trangthai {
            width: 100px;
            min-width: 100px;
            max-width: 100px;
        }
        .table-custom .col-hanhdong {
            width: 145px;
            min-width: 145px;
            max-width: 145px;
        }

        /* Căn trái cho các cột văn bản */
        .table-custom .text-left {
            text-align: left;
        }
        .table-custom .text-center {
            text-align: center;
        }

        /* Price range */
        .price-range {
            font-weight: 600;
            color: #c92327;
        }

        /* Badge */
        .badge-active {
            background: #d4edda;
            color: #155724;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .badge-locked {
            background: #f8d7da;
            color: #721c24;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* Buttons */
        .btn-action {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .btn-action-view {
            border-color: #c92327;
            color: #c92327;
            background: transparent;
        }
        .btn-action-view:hover {
            background: #c92327;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 35, 39, 0.25);
        }
        .btn-action-edit {
            border-color: #0d6efd;
            color: #0d6efd;
            background: transparent;
        }
        .btn-action-edit:hover {
            background: #0d6efd;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
        }

        /* Custom Switch */
        .custom-switch {
            width: 2.5em !important;
            height: 1.2em !important;
            cursor: pointer;
        }
        .custom-switch:checked {
            background-color: #c92327 !important;
            border-color: #c92327 !important;
        }
        .custom-switch:focus {
            box-shadow: 0 0 0 0.2rem rgba(201, 35, 39, 0.2) !important;
        }

        /* ===== PAGINATION ===== */
        .pagination-custom {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0;
            padding: 0;
            list-style: none;
            flex-wrap: wrap;
        }
        .pagination-custom .page-item {
            display: inline-block;
        }
        .pagination-custom .page-item .page-link {
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            color: #495057;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: transparent;
            min-width: 36px;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .pagination-custom .page-item .page-link:hover {
            background: #fff5f5;
            color: #c92327;
        }
        .pagination-custom .page-item.active .page-link {
            background: linear-gradient(135deg, #c92327, #a01a1e);
            color: white;
            box-shadow: 0 2px 8px rgba(201, 35, 39, 0.3);
        }
        .pagination-custom .page-item.disabled .page-link {
            color: #adb5bd;
            cursor: not-allowed;
            pointer-events: none;
        }
        .pagination-custom .page-item .page-link i {
            font-size: 0.8rem;
        }

        /* Stats */
        .stats-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .stats-item {
            background: #f8f9fa;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }
        .stats-item .num {
            font-weight: 700;
            color: #c92327;
            font-size: 1rem;
        }

        /* Footer table */
        .table-footer {
            background: #f8f9fa;
            padding: 12px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-footer .info-text {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .table-footer .info-text strong {
            color: #2d3748;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .table-custom .col-ten {
                width: 130px;
                min-width: 130px;
                max-width: 130px;
            }
            .table-custom .col-mota {
                width: 130px;
                min-width: 130px;
                max-width: 130px;
            }
            .table-custom .col-thuonghieu {
                width: 100px;
                min-width: 100px;
                max-width: 100px;
            }
        }

        @media (max-width: 992px) {
            .table-custom .col-ten {
                width: 110px;
                min-width: 110px;
                max-width: 110px;
            }
            .table-custom .col-mota {
                width: 110px;
                min-width: 110px;
                max-width: 110px;
            }
            .table-custom .col-thuonghieu {
                width: 90px;
                min-width: 90px;
                max-width: 90px;
            }
            .table-custom .col-gia {
                width: 110px;
                min-width: 110px;
                max-width: 110px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .toolbar-left,
            .toolbar .toolbar-right {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .content-wrapper {
                width: 100%;
            }
            .table-custom {
                font-size: 0.75rem;
                table-layout: auto;
            }
            .table-custom thead th,
            .table-custom tbody td {
                padding: 6px 6px;
            }
            .table-custom .col-stt {
                width: 30px;
                min-width: 30px;
                max-width: 30px;
            }
            .table-custom .col-ma {
                width: 70px;
                min-width: 70px;
                max-width: 70px;
            }
            .table-custom .col-ten {
                width: 100px;
                min-width: 100px;
                max-width: 100px;
            }
            .table-custom .col-thuonghieu {
                width: 80px;
                min-width: 80px;
                max-width: 80px;
            }
            .table-custom .col-mota {
                width: 90px;
                min-width: 90px;
                max-width: 90px;
            }
            .table-custom .col-gia {
                width: 100px;
                min-width: 100px;
                max-width: 100px;
            }
            .table-custom .col-ton {
                width: 50px;
                min-width: 50px;
                max-width: 50px;
            }
            .table-custom .col-trangthai {
                width: 90px;
                min-width: 90px;
                max-width: 90px;
            }
            .table-custom .col-hanhdong {
                width: 120px;
                min-width: 120px;
                max-width: 120px;
            }
            .btn-action {
                width: 26px;
                height: 26px;
                font-size: 0.7rem;
            }
            .stats-bar {
                gap: 10px;
            }
            .stats-item {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
            .pagination-custom .page-item .page-link {
                padding: 4px 10px;
                font-size: 0.75rem;
                min-width: 30px;
            }
            .table-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .toolbar .toolbar-left,
            .toolbar .toolbar-right {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        @media (max-width: 576px) {
            .filter-form {
                padding: 12px;
            }
            .table-custom {
                font-size: 0.65rem;
            }
            .table-custom thead th,
            .table-custom tbody td {
                padding: 4px 4px;
            }
            .table-custom .col-stt {
                width: 25px;
                min-width: 25px;
                max-width: 25px;
            }
            .table-custom .col-ma {
                width: 55px;
                min-width: 55px;
                max-width: 55px;
            }
            .table-custom .col-ten {
                width: 80px;
                min-width: 80px;
                max-width: 80px;
            }
            .table-custom .col-thuonghieu {
                width: 70px;
                min-width: 70px;
                max-width: 70px;
            }
            .table-custom .col-mota {
                width: 70px;
                min-width: 70px;
                max-width: 70px;
            }
            .table-custom .col-gia {
                width: 80px;
                min-width: 80px;
                max-width: 80px;
            }
            .table-custom .col-ton {
                width: 35px;
                min-width: 35px;
                max-width: 35px;
            }
            .table-custom .col-trangthai {
                width: 75px;
                min-width: 75px;
                max-width: 75px;
            }
            .table-custom .col-hanhdong {
                width: 95px;
                min-width: 95px;
                max-width: 95px;
            }
            .btn-action {
                width: 22px;
                height: 22px;
                font-size: 0.6rem;
            }
            .badge-active, .badge-locked {
                font-size: 0.6rem;
                padding: 2px 8px;
            }
            .custom-switch {
                width: 2em !important;
                height: 1em !important;
            }
        }

        /* Select2 override */
        .select2-container .select2-selection--single {
            height: 38px !important;
            border-radius: 8px !important;
            border: 1px solid #e0e0e0 !important;
        }
        .select2-container .select2-selection--single .select2-selection__rendered {
            line-height: 36px !important;
            padding-left: 12px !important;
            font-size: 0.85rem;
        }
        .select2-container .select2-selection--single .select2-selection__arrow {
            height: 36px !important;
        }
        .select2-container--open .select2-dropdown {
            border-radius: 8px !important;
            border-color: #c92327 !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .select2-container--default .select2-search--dropdown .select2-search__field {
            border-radius: 6px !important;
            border: 1px solid #e0e0e0 !important;
        }
        .select2-container--default .select2-results__option--highlighted.select2-results__option--selectable {
            background-color: #c92327 !important;
        }
    </style>
</head>

<body>
<div class="wrapper">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="content-wrapper">

        <div th:replace="~{fragments/header :: header('Quản lý sản phẩm', 'Sản phẩm')}"></div>

        <div class="content-body px-3 py-3">

            <!-- Toast Container -->
            <div class="toast-container-custom" id="toastContainer"></div>

            <!-- Alerts cũ - chuyển sang toast -->
            <div th:if="${mess}" class="alert alert-danger alert-dismissible fade show mt-2" role="alert" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${mess}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${successMess}" class="alert alert-success alert-dismissible fade show mt-2" role="alert" style="display: none;">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMess}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Filter Card -->
            <div class="card card-custom mb-4 shadow-sm border-0">
                <div class="card-header-custom">
                    <h5 class="mb-0 d-flex align-items-center gap-2 py-1">
                        <i class="bi bi-funnel-fill"></i>
                        <span>Bộ lọc & Tìm kiếm sản phẩm</span>
                    </h5>
                </div>

                <div class="card-body bg-white p-4">
                    <form id="filterForm" th:action="@{/sanpham/index}" method="get" class="filter-form">
                        <div class="row g-3">
                            <div class="col-lg-2 col-md-4 col-sm-6">
                                <label class="form-label">
                                    <i class="bi bi-tag-fill text-danger me-1"></i>Thương hiệu
                                </label>
                                <select name="maTH" class="form-select select2-search" onchange="this.form.submit()">
                                    <option value="">-- Tất cả --</option>
                                    <option th:each="th : ${listth}"
                                            th:value="${th.maThuongHieu}"
                                            th:text="${th.tenThuongHieu}"
                                            th:selected="${#strings.toString(th.maThuongHieu) == #strings.toString(param.maTH)}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-lg-2 col-md-4 col-sm-6">
                                <label class="form-label">
                                    <i class="bi bi-shoe-prints-fill text-danger me-1"></i>Kiểu giày
                                </label>
                                <select name="maKG" class="form-select select2-search" onchange="this.form.submit()">
                                    <option value="">-- Tất cả --</option>
                                    <option th:each="kg : ${listkg}"
                                            th:value="${kg.maKieuGiay}"
                                            th:text="${kg.tenKieuGiay}"
                                            th:selected="${#strings.toString(kg.maKieuGiay) == #strings.toString(param.maKG)}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-lg-2 col-md-4 col-sm-6">
                                <label class="form-label">
                                    <i class="bi bi-grid-3x3-gap-fill text-danger me-1"></i>Danh mục
                                </label>
                                <select name="maDanhMuc" class="form-select select2-search" onchange="this.form.submit()">
                                    <option value="">-- Tất cả --</option>
                                    <option th:each="dm : ${listdmsp}"
                                            th:value="${dm.maDanhMuc}"
                                            th:text="${dm.tenDanhMuc}"
                                            th:selected="${#strings.toString(dm.maDanhMuc) == #strings.toString(param.maDanhMuc)}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-lg-2 col-md-4 col-sm-6">
                                <label class="form-label">
                                    <i class="bi bi-circle-fill text-danger me-1"></i>Trạng thái
                                </label>
                                <select name="tt" class="form-select select2-search" onchange="this.form.submit()">
                                    <option value="">-- Tất cả --</option>
                                    <option value="true" th:selected="${param.tt != null && param.tt == 'true'}">Còn bán</option>
                                    <option value="false" th:selected="${param.tt != null && param.tt == 'false'}">Ngừng bán</option>
                                </select>
                            </div>

                            <div class="col-lg-3 col-md-6 col-sm-12">
                                <label class="form-label">
                                    <i class="bi bi-search text-danger me-1"></i>Từ khóa
                                </label>
                                <div class="input-group">
                                    <input type="text" class="form-control" placeholder="Mã hoặc tên sản phẩm..." name="t" th:value="${param.t}">
                                    <button class="btn btn-danger" type="submit">
                                        <i class="bi bi-search me-1"></i>Tìm
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-bar">
                <div class="stats-item">
                    <i class="bi bi-box-seam-fill text-danger"></i>
                    Tổng sản phẩm: <span class="num" th:text="${totalItems}">0</span>
                </div>
                <div class="stats-item">
                    <i class="bi bi-check-circle-fill text-success"></i>
                    Đang bán: <span class="num" th:text="${totalActive}">0</span>
                </div>
                <div class="stats-item">
                    <i class="bi bi-x-circle-fill text-danger"></i>
                    Ngừng bán: <span class="num" th:text="${totalInactive}">0</span>
                </div>
            </div>

            <!-- ===== TOOLBAR - NÚT CHỨC NĂNG ===== -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <a th:href="@{/sanpham/add-view}" class="btn-toolbar btn-add" title="Thêm sản phẩm mới">
                        <i class="bi bi-plus-circle"></i>Thêm sản phẩm
                    </a>
                    <a th:href="@{/sanpham/export-excel(
                        maDanhMuc=${param.maDanhMuc},
                        tt=${param.tt},
                        maTH=${param.maTH},
                        maKG=${param.maKG},
                        t=${param.t}
                    )}"
                       class="btn-toolbar btn-export"
                       title="Xuất Excel">
                        <i class="bi bi-file-earmark-excel"></i>Xuất Excel
                    </a>
                </div>
                <div class="toolbar-right">
                    <a th:href="@{/sanpham/index}" class="btn-toolbar btn-reset-toolbar" title="Reset bộ lọc">
                        <i class="bi bi-arrow-counterclockwise"></i>Reset
                    </a>
                </div>
            </div>

            <!-- Table -->
            <div class="table-card">
                <div class="table-responsive">
                    <table class="table-custom">
                        <thead>
                        <tr>
                            <th class="col-stt">STT</th>
                            <th class="col-ma">Mã SP</th>
                            <th class="col-ten text-left">Tên sản phẩm</th>
                            <th class="col-thuonghieu text-left">Thương hiệu</th>
                            <th class="col-mota text-left">Mô tả</th>
                            <th class="col-gia">Giá bán</th>
                            <th class="col-ton">Tồn kho</th>
                            <th class="col-trangthai">Trạng thái</th>
                            <th class="col-hanhdong">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c,count : ${listsp}">
                            <td class="col-stt text-center fw-semibold" th:text="${count.count}"></td>
                            <td class="col-ma">
                                <span class="fw-semibold text-danger" th:text="${c.maSanPham}"></span>
                            </td>
                            <td class="col-ten text-left" th:text="${c.tenSanPham}"></td>
                            <td class="col-thuonghieu text-left" th:text="${c.tenThuongHieu}"></td>
                            <td class="col-mota text-left text-muted small" th:text="${c.moTa}"></td>
                            <td class="col-gia">
                                <span class="price-range" th:text="${c.giaBanDisplay}">0₫</span>
                            </td>
                            <td class="col-ton text-center">
                                <span class="fw-bold" th:text="${c.tongTon}">0</span>
                            </td>
                            <td class="col-trangthai text-center">
                                    <span th:if="${c.trangThai}" class="badge-active">
                                        <i class="bi bi-check-circle-fill"></i>Còn bán
                                    </span>
                                <span th:if="${!c.trangThai}" class="badge-locked">
                                        <i class="bi bi-x-circle-fill"></i>Ngừng bán
                                    </span>
                            </td>
                            <td class="col-hanhdong text-center">
                                <div class="d-flex align-items-center justify-content-center gap-1">
                                    <!-- View -->
                                    <a class="btn-action btn-action-view"
                                       th:href="@{/sanpham/detail/{id}(
                                               id=${c.maSanPham},
                                               page=${currentPage},
                                               maDanhMuc=${param.maDanhMuc},
                                               tt=${param.tt},
                                               maTH=${param.maTH},
                                               maKG=${param.maKG},
                                               t=${param.t})}"
                                       title="Xem chi tiết">
                                        <i class="bi bi-eye-fill"></i>
                                    </a>
                                    <!-- Toggle Status -->
                                    <form th:action="@{/sanpham/toggle-status/{id}(id=${c.maSanPham})}"
                                          method="get" class="m-0 d-flex align-items-center">
                                        <input type="hidden" name="status" th:value="${!c.trangThai}">
                                        <input type="hidden" name="page" th:value="${currentPage}">
                                        <input type="hidden" name="maDanhMuc" th:value="${param.maDanhMuc}">
                                        <input type="hidden" name="tt" th:value="${param.tt}">
                                        <input type="hidden" name="maTH" th:value="${param.maTH}">
                                        <input type="hidden" name="maKG" th:value="${param.maKG}">
                                        <input type="hidden" name="t" th:value="${param.t}">
                                        <div class="form-check form-switch m-0">
                                            <input class="form-check-input custom-switch"
                                                   type="checkbox"
                                                   role="switch"
                                                   th:checked="${c.trangThai}"
                                                   onchange="this.closest('form').submit();"
                                                   title="Bật/Tắt trạng thái">
                                        </div>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listsp)}">
                            <td colspan="9" class="text-center text-muted py-4">
                                <i class="bi bi-inbox" style="font-size: 2rem; display: block; margin-bottom: 8px;"></i>
                                Không có dữ liệu hiển thị
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Table Footer with Pagination -->
                <div class="table-footer" th:if="${totalPages > 0}">
                    <div class="info-text">
                        <i class="bi bi-database me-1"></i>
                        Tổng: <strong th:text="${totalItems}">0</strong> bản ghi
                        <span class="mx-1">|</span>
                        Trang <strong th:text="${currentPage + 1}">1</strong> / <strong th:text="${totalPages}">1</strong>
                    </div>

                    <nav aria-label="Page navigation">
                        <ul class="pagination-custom">
                            <!-- First -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/sanpham/index(page=0, size=5, maDanhMuc=${param.maDanhMuc}, tt=${param.tt}, maTH=${param.maTH}, maKG=${param.maKG}, t=${param.t})}">
                                    <i class="bi bi-chevron-double-left"></i>
                                </a>
                            </li>

                            <!-- Prev -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/sanpham/index(page=${currentPage - 1}, size=5, maDanhMuc=${param.maDanhMuc}, tt=${param.tt}, maTH=${param.maTH}, maKG=${param.maKG}, t=${param.t})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>

                            <!-- Pages -->
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:if="${i >= 0 && i < totalPages && (
                                    (i >= currentPage - 2 && i <= currentPage + 2) ||
                                    i == 0 ||
                                    i == totalPages - 1
                                )}"
                                th:classappend="${currentPage == i} ? 'active' : ''">

                                <span class="page-link" th:if="${i == 2 && currentPage > 3}" style="border: none; background: transparent; cursor: default;">...</span>

                                <a class="page-link" th:unless="${i == 2 && currentPage > 3}"
                                   th:href="@{/sanpham/index(page=${i}, size=5, maDanhMuc=${param.maDanhMuc}, tt=${param.tt}, maTH=${param.maTH}, maKG=${param.maKG}, t=${param.t})}"
                                   th:text="${i + 1}">
                                </a>

                                <span class="page-link" th:if="${i == totalPages - 3 && currentPage < totalPages - 4}" style="border: none; background: transparent; cursor: default;">...</span>
                            </li>

                            <!-- Next -->
                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/sanpham/index(page=${currentPage + 1}, size=5, maDanhMuc=${param.maDanhMuc}, tt=${param.tt}, maTH=${param.maTH}, maKG=${param.maKG}, t=${param.t})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>

                            <!-- Last -->
                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/sanpham/index(page=${totalPages - 1}, size=5, maDanhMuc=${param.maDanhMuc}, tt=${param.tt}, maTH=${param.maTH}, maKG=${param.maKG}, t=${param.t})}">
                                    <i class="bi bi-chevron-double-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>

    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" th:classappend="${showModal} ? 'show d-block'" style="background: rgba(0,0,0,0.5);" th:if="${showModal}">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <form th:action="@{/sanpham/update}" method="post" id="editForm">

            <input type="hidden" name="page" th:value="${currentPage}">
            <input type="hidden" name="source" th:value="${source}">
            <input type="hidden" name="maSanPham" th:value="${sanpham.maSanPham}">

            <div class="modal-content modal-content-custom">

                <div class="modal-header-custom">
                    <h5 class="modal-title">
                        <i class="bi bi-pencil-square me-2"></i>Cập nhật sản phẩm
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body-custom">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-tag-fill text-danger me-1"></i>Tên sản phẩm <span class="text-danger">*</span>
                        </label>
                        <input type="text" name="tenSanPham" th:value="${sanpham.tenSanPham}" class="form-control" placeholder="Nhập tên sản phẩm...">
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-grid-3x3-gap-fill text-danger me-1"></i>Danh mục
                            </label>
                            <select name="maDanhMuc" class="form-select">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="dm : ${listdmsp}"
                                        th:value="${dm.maDanhMuc}"
                                        th:selected="${sanpham.danhMucSanPham != null && dm.maDanhMuc == sanpham.danhMucSanPham.maDanhMuc}"
                                        th:text="${dm.tenDanhMuc}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-building-fill text-danger me-1"></i>Thương hiệu
                            </label>
                            <select name="maThuongHieu" class="form-select">
                                <option th:each="th : ${listth}"
                                        th:value="${th.maThuongHieu}"
                                        th:selected="${th.maThuongHieu == sanpham.thuongHieu.maThuongHieu}"
                                        th:text="${th.tenThuongHieu}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-droplet-fill text-danger me-1"></i>Chất liệu
                            </label>
                            <select name="maChatLieu" class="form-select">
                                <option th:each="cl : ${listcl}"
                                        th:value="${cl.maChatLieu}"
                                        th:selected="${cl.maChatLieu == sanpham.chatLieu.maChatLieu}"
                                        th:text="${cl.tenChatLieu}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-shoe-prints-fill text-danger me-1"></i>Kiểu giày
                            </label>
                            <select name="maKieuGiay" class="form-select">
                                <option th:each="kg : ${listkg}"
                                        th:value="${kg.maKieuGiay}"
                                        th:selected="${kg.maKieuGiay == sanpham.kieuGiay.maKieuGiay}"
                                        th:text="${kg.tenKieuGiay}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-card-text text-danger me-1"></i>Mô tả
                        </label>
                        <textarea name="moTa" class="form-control" rows="3" th:text="${sanpham.moTa}" placeholder="Nhập mô tả sản phẩm..."></textarea>
                    </div>

                </div>

                <div class="modal-footer-custom d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-1"></i>Hủy
                    </button>
                    <button type="submit" class="btn" style="background: #c92327; color: white;" onclick="showToast('Đang cập nhật sản phẩm...', 'warning')">
                        <i class="bi bi-save me-1"></i>Lưu thay đổi
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>

<!-- Scripts -->
<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {
        $('.select2-search').select2({
            placeholder: "Chọn...",
            allowClear: true,
            width: '100%',
            dropdownParent: $('body')
        });
    });

    // ===== SHOW TOAST =====
    function showToast(message, type, title) {
        var container = document.getElementById('toastContainer');
        if (!container) return;

        var icons = {
            error: 'bi bi-x-circle-fill text-danger',
            success: 'bi bi-check-circle-fill text-success',
            warning: 'bi bi-exclamation-triangle-fill text-warning'
        };

        var titles = {
            error: 'Lỗi!',
            success: 'Thành công!',
            warning: 'Cảnh báo!'
        };

        var toast = document.createElement('div');
        toast.className = 'toast-custom ' + type;
        toast.innerHTML = `
            <div class="toast-icon">
                <i class="${icons[type] || icons.error}"></i>
            </div>
            <div class="toast-content">
                <div class="toast-title">${title || titles[type] || 'Thông báo'}</div>
                <div class="toast-message">${message}</div>
            </div>
            <button class="toast-close" onclick="this.closest('.toast-custom').remove()">
                <i class="bi bi-x"></i>
            </button>
        `;

        container.appendChild(toast);

        setTimeout(function() {
            if (toast.parentNode) {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(function() { toast.remove(); }, 300);
            }
        }, 5000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.custom-switch').forEach(function(switchEl) {
            switchEl.addEventListener('change', function() {
                var isChecked = this.checked;
                var message = isChecked ? 'Đã bật sản phẩm!' : 'Đã tắt sản phẩm!';
                sessionStorage.setItem('toastMessage', message);
                sessionStorage.setItem('toastType', 'success');
            });
        });

        // Hiển thị toast từ sessionStorage
        var message = sessionStorage.getItem('toastMessage');
        var type = sessionStorage.getItem('toastType');
        if (message) {
            showToast(message, type || 'success');
            sessionStorage.removeItem('toastMessage');
            sessionStorage.removeItem('toastType');
        }
    });
</script>
</body>
</html>
