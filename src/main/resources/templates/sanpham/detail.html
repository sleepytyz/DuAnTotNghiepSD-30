<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm - FS Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        html, body { height: 100%; margin: 0; padding: 0; background: #f4f6f9; }
        .wrapper {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            flex-shrink: 0;
        }
        .content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 250px);
            min-width: 0;
        }

        /* ===== CONTENT BODY ===== */
        .content-body {
            padding: 24px;
            flex-grow: 1;
            background-color: #f4f6f9;
        }

        /* ===== TOAST ===== */
        .toast-container-custom {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 420px;
            width: 100%;
        }
        .toast-custom {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #dc3545;
            animation: slideInRight 0.4s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .toast-custom.success {
            border-left-color: #28a745;
        }
        .toast-custom.warning {
            border-left-color: #ffc107;
        }
        .toast-custom .toast-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .toast-custom .toast-content {
            flex: 1;
        }
        .toast-custom .toast-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #2d3748;
        }
        .toast-custom .toast-message {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 2px;
        }
        .toast-custom .toast-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #adb5bd;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .toast-custom .toast-close:hover {
            color: #dc3545;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* ===== CARD ===== */
        .card-custom {
            border-radius: 16px;
            overflow: hidden;
            border: none;
            transition: all 0.3s ease;
        }
        .card-custom:hover {
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08) !important;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #c92327 0%, #a01a1e 100%);
            border: none;
            padding: 16px 24px;
        }
        .card-header-custom h5 {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.3px;
            color: white;
        }
        .card-header-custom .bi {
            font-size: 1.2rem;
        }

        /* ===== INFO GRID ===== */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 40px;
        }
        .info-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px dashed #e9ecef;
        }
        .info-item .label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #6c757d;
            min-width: 100px;
        }
        .info-item .value {
            font-weight: 500;
            font-size: 0.9rem;
            color: #2d3748;
        }
        .info-item .value.text-danger {
            font-weight: 700;
            color: #c92327 !important;
        }

        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }

        /* ===== TABLE ===== */
        .table-card {
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            border: 1px solid #e9ecef;
        }
        .table-header {
            background: #f8f9fa;
            padding: 14px 20px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .table-header .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-custom {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .table-custom thead {
            background: linear-gradient(135deg, #f8f9fa 0%, #f1f3f5 100%);
        }
        .table-custom thead th {
            padding: 12px 14px;
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #495057;
            border-bottom: 2px solid #e9ecef;
            white-space: nowrap;
            text-align: center;
        }
        .table-custom tbody tr {
            transition: all 0.2s ease;
            border-bottom: 1px solid #f1f3f5;
        }
        .table-custom tbody tr:hover {
            background: #fff5f5 !important;
        }
        .table-custom tbody td {
            padding: 10px 14px;
            vertical-align: middle;
            color: #2d3748;
            text-align: center;
        }

        /* ===== BADGE ===== */
        .badge-active {
            background: #d4edda;
            color: #155724;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .badge-locked {
            background: #f8d7da;
            color: #721c24;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .badge-out-of-stock {
            background: #fff3cd;
            color: #856404;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* ===== BUTTONS ===== */
        .btn-action {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            font-size: 0.9rem;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-action-edit {
            border-color: #0d6efd;
            color: #0d6efd;
            background: transparent;
        }
        .btn-action-edit:hover {
            background: #0d6efd;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
        }

        .btn-back {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn-back:hover {
            background: #5a6268;
            color: white;
            transform: translateY(-1px);
        }

        /* ===== SWITCH ===== */
        .custom-switch {
            width: 2.5em !important;
            height: 1.2em !important;
            cursor: pointer;
        }
        .custom-switch:checked {
            background-color: #c92327 !important;
            border-color: #c92327 !important;
        }
        .custom-switch:focus {
            box-shadow: 0 0 0 0.2rem rgba(201, 35, 39, 0.2) !important;
        }

        /* ===== IMAGE ===== */
        .img-zoom {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .img-zoom:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        /* ===== MODAL ===== */
        .modal-content-custom {
            border-radius: 16px !important;
            border: none !important;
            overflow: hidden;
        }
        .modal-header-custom {
            background: linear-gradient(135deg, #c92327 0%, #a01a1e 100%);
            border: none;
            padding: 16px 24px;
        }
        .modal-header-custom .modal-title {
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .modal-header-custom .btn-close {
            filter: brightness(0) invert(1);
        }
        .modal-body-custom {
            padding: 24px;
            background: #f8f9fa;
        }
        .modal-body-custom .form-label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #2d3748;
        }
        .modal-body-custom .form-control,
        .modal-body-custom .form-select {
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 0.85rem;
            padding: 8px 12px;
            transition: all 0.3s ease;
        }
        .modal-body-custom .form-control:focus,
        .modal-body-custom .form-select:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.2rem rgba(201, 35, 39, 0.12) !important;
        }

        .preview-box {
            width: 100%;
            height: 150px;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fff;
            margin-bottom: 8px;
        }
        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .table-custom {
                font-size: 0.8rem;
            }
            .table-custom thead th,
            .table-custom tbody td {
                padding: 8px 10px;
            }
        }

        @media (max-width: 768px) {
            .content-wrapper {
                width: 100%;
            }
            .table-custom {
                font-size: 0.75rem;
            }
            .table-custom thead th,
            .table-custom tbody td {
                padding: 6px 8px;
            }
            .btn-action {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
            }
            .table-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .table-header .right {
                width: 100%;
                justify-content: flex-start;
            }
        }

        @media (max-width: 576px) {
            .table-custom {
                font-size: 0.7rem;
            }
            .table-custom thead th,
            .table-custom tbody td {
                padding: 4px 6px;
            }
            .btn-action {
                width: 24px;
                height: 24px;
                font-size: 0.65rem;
            }
            .badge-active, .badge-locked, .badge-out-of-stock {
                font-size: 0.6rem;
                padding: 2px 8px;
            }
            .custom-switch {
                width: 2em !important;
                height: 1em !important;
            }
            .preview-box {
                height: 100px;
            }
        }

        /* Select2 override */
        .select2-container .select2-selection--single {
            height: 38px !important;
            border-radius: 8px !important;
            border: 1px solid #e0e0e0 !important;
        }
        .select2-container .select2-selection--single .select2-selection__rendered {
            line-height: 36px !important;
            padding-left: 12px !important;
            font-size: 0.85rem;
        }
        .select2-container .select2-selection--single .select2-selection__arrow {
            height: 36px !important;
        }
        .select2-container--open .select2-dropdown {
            border-radius: 8px !important;
            border-color: #c92327 !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .select2-container--default .select2-results__option--highlighted.select2-results__option--selectable {
            background-color: #c92327 !important;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div th:replace="~{fragments/sidebaradmin :: sidebar-admin}"></div>

    <div class="content-wrapper">
        <div th:replace="~{fragments/header :: header('Chi tiết sản phẩm', 'Sản phẩm')}"></div>

        <div class="content-body">
            <!-- Toast Container -->
            <div class="toast-container-custom" id="toastContainer"></div>

            <!-- ===== INFO CARD ===== -->
            <div class="card card-custom shadow-sm mb-4">
                <div class="card-header-custom">
                    <h5 class="mb-0 d-flex align-items-center gap-2">
                        <i class="bi bi-box-seam-fill"></i>
                        <span>Thông tin sản phẩm</span>
                        <span class="ms-2 badge bg-light text-dark" th:text="${sanpham?.maSanPham}"></span>
                    </h5>
                </div>
                <div class="card-body p-4">
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="label"><i class="bi bi-tag-fill text-danger me-1"></i>Mã SP:</span>
                            <span class="value text-danger fw-bold" th:text="${sanpham?.maSanPham}"></span>
                        </div>
                        <div class="info-item">
                            <span class="label"><i class="bi bi-box-seam text-danger me-1"></i>Tên SP:</span>
                            <span class="value fw-bold" th:text="${sanpham?.tenSanPham}"></span>
                        </div>
                        <div class="info-item">
                            <span class="label"><i class="bi bi-grid-3x3-gap-fill text-danger me-1"></i>Danh mục:</span>
                            <span class="value" th:text="${sanpham?.danhMucSanPham?.tenDanhMuc}"></span>
                        </div>
                        <div class="info-item">
                            <span class="label"><i class="bi bi-building-fill text-danger me-1"></i>Thương hiệu:</span>
                            <span class="value" th:text="${sanpham?.thuongHieu?.tenThuongHieu}"></span>
                        </div>
                        <div class="info-item">
                            <span class="label"><i class="bi bi-droplet-fill text-danger me-1"></i>Chất liệu:</span>
                            <span class="value" th:text="${sanpham?.chatLieu?.tenChatLieu}"></span>
                        </div>
                        <div class="info-item">
                            <span class="label"><i class="bi bi-shoe-prints-fill text-danger me-1"></i>Kiểu giày:</span>
                            <span class="value" th:text="${sanpham?.kieuGiay?.tenKieuGiay}"></span>
                        </div>
                        <div class="info-item" style="grid-column: 1 / -1;">
                            <span class="label"><i class="bi bi-card-text text-danger me-1"></i>Mô tả:</span>
                            <span class="value" th:text="${sanpham?.moTa}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== TABLE CARD ===== -->
            <div class="table-card">
                <div class="table-header">
                    <div class="left">
                        <i class="bi bi-list-ul text-danger fs-5"></i>
                        <h5 class="mb-0 fw-bold text-dark">Danh sách biến thể</h5>
                        <span class="badge bg-secondary" th:text="${listBienThe?.size()} + ' biến thể'"></span>
                    </div>
                    <div class="right">
                        <a th:href="@{/sanpham/index}" class="btn-back">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại
                        </a>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table-custom" id="variantTable">
                        <thead>
                        <tr>
                            <th style="width: 45px;">STT</th>
                            <th style="min-width: 130px;">Mã SPCT</th>
                            <th style="min-width: 60px;">Size</th>
                            <th style="min-width: 90px;">Màu sắc</th>
                            <th style="min-width: 120px;">Giá bán</th>
                            <th style="min-width: 70px;">Tồn kho</th>
                            <th style="min-width: 100px;">Trạng thái</th>
                            <th style="min-width: 80px;">Hình ảnh</th>
                            <th style="min-width: 130px;">Hành động</th>
                        </tr>
                        </thead>
                        <tbody id="variantTableBody">
                        <tr th:each="bt, row : ${listBienThe}" th:id="'row-' + ${bt.maSanPhamChiTiet}">
                            <td class="fw-semibold" th:text="${row.count}"></td>
                            <td class="fw-semibold text-danger" th:text="${bt.maSanPhamChiTiet}"></td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${bt.kichThuoc.tenKichThuoc}"></span>
                            </td>
                            <td>
                                <span class="badge" style="background: #e9ecef; color: #2d3748;" th:text="${bt.mauSac.tenMauSac}"></span>
                            </td>
                            <td class="fw-bold text-danger giaBanDisplay" th:text="${#numbers.formatDecimal(bt.giaBan, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                            <td class="fw-bold soLuongDisplay" th:text="${bt.soLuongTon}"></td>
                            <td>
            <span th:id="'status-' + ${bt.maSanPhamChiTiet}"
                  th:classappend="${bt.trangThai == 'Còn hàng'} ? 'badge-active' :
                                  (${bt.trangThai == 'Sắp hết'} ? 'badge-out-of-stock' : 'badge-locked')"
                  th:text="${bt.trangThai}">
            </span>
                            </td>
                            <td>
                                <img th:if="${bt.duongDanAnh != null && !bt.duongDanAnh.isEmpty()}"
                                     th:src="@{'/images/' + ${bt.duongDanAnh}}"
                                     width="50" height="50"
                                     class="img-zoom rounded border"
                                     style="object-fit:cover;"
                                     alt="Ảnh sản phẩm"
                                     onerror="this.src='/images/default-product.png'">
                                <span th:if="${bt.duongDanAnh == null || bt.duongDanAnh.isEmpty()}" class="text-muted small">Chưa có ảnh</span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center justify-content-center gap-1">
                                    <button class="btn-action btn-action-edit"
                                            th:data-id="${bt.maSanPhamChiTiet}"
                                            th:data-masp="${sanpham.maSanPham}"
                                            th:data-kichthuoc="${bt.kichThuoc.maKichThuoc}"
                                            th:data-mausac="${bt.mauSac.maMauSac}"
                                            th:data-giaban="${bt.giaBan}"
                                            th:data-soluong="${bt.soLuongTon}"
                                            th:data-anh="${bt.duongDanAnh}"
                                            th:data-tenkichthuoc="${bt.kichThuoc.tenKichThuoc}"
                                            th:data-tenmausac="${bt.mauSac.tenMauSac}"
                                            onclick="openEditModalFromButton(this)"
                                            title="Chỉnh sửa">
                                        <i class="bi bi-pencil-fill"></i>
                                    </button>

                                    <!-- Toggle Status -->
                                    <div class="form-check form-switch m-0">
                                        <input class="form-check-input custom-switch" type="checkbox" role="switch"
                                               th:checked="${bt.trangThai == 'Còn hàng'}"
                                               onchange="toggleStatus(this)"
                                               th:data-id="${bt.maSanPhamChiTiet}"
                                               title="Bật/Tắt trạng thái">
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listBienThe)}">
                            <td colspan="10" class="text-center text-muted py-4">
                                <i class="bi bi-boxes" style="font-size: 2.5rem; display: block; margin-bottom: 8px;"></i>
                                Chưa có biến thể nào cho sản phẩm này
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===== MODAL CẬP NHẬT ===== -->
<div class="modal fade" id="spctModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header-custom">
                <h5 class="modal-title d-flex align-items-center gap-2">
                    <i class="bi bi-pencil-square"></i>
                    <span>Cập nhật biến thể sản phẩm</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body-custom">
                <form id="updateForm" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="source" value="detail">
                    <input type="hidden" name="maSanPhamGoc" id="maSanPhamGoc" th:value="${sanpham.maSanPham}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Mã SPCT <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-light" id="maSanPhamChiTiet" name="maSanPhamChiTiet" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Sản phẩm chính <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-light" th:value="${sanpham?.maSanPham + ' - ' + sanpham?.tenSanPham}" readonly>
                            <input type="hidden" name="sanPham.maSanPham" th:value="${sanpham.maSanPham}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Kích cỡ <span class="text-danger">*</span></label>
                            <select class="form-select select2-modal" id="kichThuoc" name="kichThuoc.maKichThuoc">
                                <option value="">-- Chọn kích cỡ --</option>
                                <option th:each="c : ${lists}" th:value="${c.maKichThuoc}" th:text="${c.tenKichThuoc}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Màu sắc <span class="text-danger">*</span></label>
                            <select class="form-select select2-modal" id="mauSac" name="mauSac.maMauSac">
                                <option value="">-- Chọn màu sắc --</option>
                                <option th:each="c : ${listms}" th:value="${c.maMauSac}" th:text="${c.tenMauSac}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Giá bán <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">₫</span>
                                <input type="text" class="form-control money-input" id="giaBan" name="giaBan"
                                       placeholder="0"
                                       oninput="formatMoneyInput(this)"
                                       onblur="formatMoneyBlur(this)"
                                       onfocus="formatMoneyFocus(this)">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số lượng <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="soLuongTon" name="soLuongTon" placeholder="0" min="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Hình ảnh</label>
                            <div class="preview-box mb-2">
                                <img id="imgPreview" src="/images/default-product.png" alt="Preview">
                            </div>
                            <input type="file" name="fileAnh" class="form-control" accept="image/*" onchange="previewImage(this)">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            <i class="bi bi-x-circle me-1"></i>Hủy
                        </button>
                        <button type="button" class="btn btn-warning" onclick="submitUpdateForm()">
                            <i class="bi bi-save me-1"></i>Cập nhật
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // =============================================
    // SELECT2
    // =============================================
    $(document).ready(function() {
        $('.select2-modal').select2({
            placeholder: "Chọn...",
            allowClear: true,
            width: '100%',
            dropdownParent: $('#spctModal')
        });
    });

    // =============================================
    // DOM READY
    // =============================================
    document.addEventListener("DOMContentLoaded", function() {
        var showModal = /*[[${showModal}]]*/ false;
        if (showModal) {
            new bootstrap.Modal(document.getElementById('spctModal')).show();
        }

        var successMsg = /*[[${successMess}]]*/ null;
        var errorMsg = /*[[${errorMess}]]*/ null;
        if (successMsg) {
            showToast(successMsg, 'success');
        }
        if (errorMsg) {
            showToast(errorMsg, 'error');
        }

        // Xử lý phím tắt: ESC để đóng modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                var modal = bootstrap.Modal.getInstance(document.getElementById('spctModal'));
                if (modal) modal.hide();
            }
        });

        // Reset modal khi đóng
        var modalElement = document.getElementById('spctModal');
        if (modalElement) {
            modalElement.addEventListener('hidden.bs.modal', function() {
                resetModalForm();
            });
        }
    });

    // =============================================
    // RESET MODAL FORM
    // =============================================
    function resetModalForm() {
        document.getElementById('giaBan').value = '';
        document.getElementById('soLuongTon').value = '';
        document.getElementById('imgPreview').src = '/images/default-product.png';
        document.getElementById('kichThuoc').value = '';
        document.getElementById('mauSac').value = '';
        if (typeof $ !== 'undefined') {
            $('#kichThuoc').trigger('change');
            $('#mauSac').trigger('change');
        }
    }

    // =============================================
    // SHOW TOAST
    // =============================================
    function showToast(message, type, title) {
        var container = document.getElementById('toastContainer');
        if (!container) return;

        var icons = {
            error: 'bi bi-x-circle-fill text-danger',
            success: 'bi bi-check-circle-fill text-success',
            warning: 'bi bi-exclamation-triangle-fill text-warning'
        };

        var titles = {
            error: 'Lỗi!',
            success: 'Thành công!',
            warning: 'Cảnh báo!'
        };

        var toast = document.createElement('div');
        toast.className = 'toast-custom ' + type;
        toast.innerHTML = `
        <div class="toast-icon">
            <i class="${icons[type] || icons.error}"></i>
        </div>
        <div class="toast-content">
            <div class="toast-title">${title || titles[type] || 'Thông báo'}</div>
            <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" onclick="this.closest('.toast-custom').remove()">
            <i class="bi bi-x"></i>
        </button>
    `;

        container.appendChild(toast);

        setTimeout(function() {
            if (toast.parentNode) {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(function() { toast.remove(); }, 300);
            }
        }, 5000);
    }

    // =============================================
    // FORMAT TIỀN TỆ
    // =============================================

    /**
     * Format khi người dùng nhập - chỉ hiển thị số với dấu phân cách
     */
    function formatMoneyInput(input) {
        // Lấy giá trị, loại bỏ tất cả ký tự không phải số
        let value = input.value.replace(/[^0-9]/g, '');
        if (value === '') {
            input.value = '';
            return;
        }
        // Format với dấu phân cách hàng nghìn
        input.value = parseInt(value).toLocaleString('vi-VN');
    }

    /**
     * Format khi mất focus - thêm đơn vị VNĐ
     */
    function formatMoneyBlur(input) {
        let value = input.value.replace(/[^0-9]/g, '');
        if (value === '') {
            input.value = '';
            return;
        }
        input.value = parseInt(value).toLocaleString('vi-VN') + ' VNĐ';
    }

    /**
     * Format khi focus - bỏ đơn vị, chỉ giữ số
     */
    function formatMoneyFocus(input) {
        let value = input.value.replace(/[^0-9]/g, '');
        if (value === '') {
            input.value = '';
            return;
        }
        input.value = parseInt(value).toLocaleString('vi-VN');
    }

    /**
     * Lấy giá trị số từ input đã format
     */
    function getRawMoneyValue(input) {
        if (!input) return 0;
        const value = input.value.replace(/[^0-9]/g, '');
        return parseInt(value) || 0;
    }

    /**
     * Format số thành tiền tệ (hiển thị)
     */
    function formatCurrency(amount) {
        if (!amount && amount !== 0) return '0 ₫';
        return new Intl.NumberFormat('vi-VN', {
            style: 'currency',
            currency: 'VND',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }).format(amount);
    }

    /**
     * Format số thành tiền tệ (không có ký hiệu ₫)
     */
    function formatNumber(amount) {
        if (!amount && amount !== 0) return '0';
        return new Intl.NumberFormat('vi-VN').format(amount);
    }

    // =============================================
    // OPEN EDIT MODAL
    // =============================================

    function openEditModal(id, kichThuoc, mauSac, giaBan, soLuong, anh) {
        console.log('Open edit modal:', {id, kichThuoc, mauSac, giaBan, soLuong, anh});

        // Set giá trị
        document.getElementById('maSanPhamChiTiet').value = id || '';
        document.getElementById('kichThuoc').value = kichThuoc || '';
        document.getElementById('mauSac').value = mauSac || '';

        // Format giá tiền khi hiển thị
        var giaBanInput = document.getElementById('giaBan');
        if (giaBanInput && giaBan) {
            giaBanInput.value = formatNumber(giaBan) + ' VNĐ';
        } else {
            giaBanInput.value = '';
        }

        document.getElementById('soLuongTon').value = soLuong || 0;

        // Cập nhật preview ảnh
        var imgPreview = document.getElementById('imgPreview');
        if (anh && anh !== '' && anh !== 'null' && anh !== 'undefined') {
            imgPreview.src = '/images/' + anh;
        } else {
            imgPreview.src = '/images/default-product.png';
        }

        // Trigger change cho Select2
        if (typeof $ !== 'undefined') {
            $('#kichThuoc').trigger('change');
            $('#mauSac').trigger('change');
        }

        // Hiển thị modal
        var modal = new bootstrap.Modal(document.getElementById('spctModal'));
        modal.show();
    }

    function openEditModalFromButton(btn) {
        var id = btn.getAttribute('data-id');
        var kichThuoc = btn.getAttribute('data-kichthuoc');
        var mauSac = btn.getAttribute('data-mausac');
        var giaBan = btn.getAttribute('data-giaban');
        var soLuong = btn.getAttribute('data-soluong');
        var anh = btn.getAttribute('data-anh');

        console.log('Button data:', {id, kichThuoc, mauSac, giaBan, soLuong, anh});

        openEditModal(id, kichThuoc, mauSac, giaBan, soLuong, anh);
    }

    // =============================================
    // SUBMIT UPDATE FORM
    // =============================================

    function submitUpdateForm() {
        var form = document.getElementById('updateForm');
        var formData = new FormData(form);
        var csrfToken = document.querySelector("input[name='_csrf']")?.value || '';

        // Lấy giá trị số từ input đã format
        var giaBanInput = document.getElementById('giaBan');
        var giaBanValue = getRawMoneyValue(giaBanInput);

        // Cập nhật lại giá trị trong FormData
        formData.set('giaBan', giaBanValue);

        console.log('=== SUBMIT UPDATE ===');
        console.log('GiaBan raw:', giaBanValue);
        for (var pair of formData.entries()) {
            console.log(pair[0] + ': ' + pair[1]);
        }

        showToast('Đang cập nhật biến thể...', 'warning');

        fetch('/sanphamct/update-ajax', {
            method: 'POST',
            headers: {
                'X-CSRF-TOKEN': csrfToken
            },
            body: formData
        })
            .then(function(response) {
                var contentType = response.headers.get('content-type');
                if (contentType && contentType.indexOf('application/json') !== -1) {
                    return response.json();
                } else {
                    return response.text().then(function(text) {
                        throw new Error(text.substring(0, 200) || 'Lỗi server!');
                    });
                }
            })
            .then(function(data) {
                console.log('Update response:', data);

                // Đóng modal
                var modal = bootstrap.Modal.getInstance(document.getElementById('spctModal'));
                if (modal) modal.hide();

                if (data.success) {
                    showToast(data.message || 'Cập nhật biến thể thành công!', 'success');
                    // Cập nhật dòng dữ liệu trên bảng
                    updateRowData(data);
                } else {
                    showToast(data.message || 'Cập nhật thất bại!', 'error');
                }
            })
            .catch(function(error) {
                console.error('Update error:', error);
                showToast('Lỗi: ' + error.message, 'error');
            });
    }

    // =============================================
    // UPDATE ROW DATA
    // =============================================

    function updateRowData(data) {
        var maBienThe = data.maBienThe;
        console.log('Updating row for:', maBienThe);

        var row = document.getElementById('row-' + maBienThe);
        if (!row) {
            console.warn('Row not found, reloading page');
            location.reload();
            return;
        }

        var cells = row.querySelectorAll('td');
        if (cells.length >= 9) {
            // Cập nhật Size (cột 2 - index 2)
            var sizeCell = cells[2];
            if (sizeCell && data.tenKichThuoc) {
                sizeCell.innerHTML = '<span class="badge bg-light text-dark border">' + data.tenKichThuoc + '</span>';
            }

            // Cập nhật Màu sắc (cột 3 - index 3)
            var colorCell = cells[3];
            if (colorCell && data.tenMauSac) {
                colorCell.innerHTML = '<span class="badge" style="background: #e9ecef; color: #2d3748;">' + data.tenMauSac + '</span>';
            }

            // Cập nhật Giá bán (cột 4 - index 4) - FORMAT ĐẸP
            var giaBanCell = cells[4];
            if (giaBanCell && data.giaBan) {
                giaBanCell.innerHTML = '<span class="fw-bold text-danger">' + formatCurrency(data.giaBan) + '</span>';
            }

            // Cập nhật Số lượng (cột 5 - index 5)
            var soLuongCell = cells[5];
            if (soLuongCell && data.soLuongTon !== undefined) {
                soLuongCell.textContent = data.soLuongTon;
            }

            // Cập nhật Trạng thái (cột 6 - index 6)
            var statusSpan = document.getElementById('status-' + maBienThe);
            if (statusSpan && data.trangThai) {
                statusSpan.textContent = data.trangThai;
                if (data.trangThai === 'Còn hàng') {
                    statusSpan.className = 'badge-active';
                } else if (data.trangThai === 'Sắp hết') {
                    statusSpan.className = 'badge-out-of-stock';
                } else {
                    statusSpan.className = 'badge-locked';
                }
            }

            // Cập nhật Hình ảnh (cột 7 - index 7)
            var imgCell = cells[7];
            if (imgCell) {
                if (data.duongDanAnh && data.duongDanAnh !== '') {
                    imgCell.innerHTML = '<img src="/images/' + data.duongDanAnh + '" width="50" height="50" class="img-zoom rounded border" style="object-fit:cover;" alt="Ảnh sản phẩm" onerror="this.src=\'/images/default-product.png\'">';
                } else {
                    imgCell.innerHTML = '<span class="text-muted small">Chưa có ảnh</span>';
                }
            }

            // Cập nhật data attribute của button
            var editButton = row.querySelector('.btn-action-edit');
            if (editButton) {
                editButton.setAttribute('data-kichthuoc', data.maKichThuoc || '');
                editButton.setAttribute('data-mausac', data.maMauSac || '');
                editButton.setAttribute('data-giaban', data.giaBan || 0);
                editButton.setAttribute('data-soluong', data.soLuongTon || 0);
                editButton.setAttribute('data-anh', data.duongDanAnh || '');
                editButton.setAttribute('data-tenkichthuoc', data.tenKichThuoc || '');
                editButton.setAttribute('data-tenmausac', data.tenMauSac || '');
            }

            // Cập nhật switch
            var switchInput = row.querySelector('.custom-switch');
            if (switchInput && data.trangThai) {
                switchInput.checked = (data.trangThai === 'Còn hàng');
                switchInput.setAttribute('data-id', data.maBienThe);
                switchInput.disabled = false;
            }
        }
    }

    // =============================================
    // TOGGLE STATUS - SỬA LẠI HOÀN CHỈNH
    // =============================================

    function toggleStatus(el) {
        var id = el.getAttribute('data-id');
        console.log('=== TOGGLE STATUS ===');
        console.log('Element:', el);
        console.log('ID:', id);
        console.log('Checked:', el.checked);

        if (!id || id === '' || id === 'null' || id === 'undefined') {
            showToast('Không tìm thấy ID sản phẩm!', 'error');
            el.checked = !el.checked;
            return;
        }

        var active = el.checked;
        var token = document.querySelector("input[name='_csrf']")?.value || '';

        // Hiển thị loading
        el.disabled = true;

        // Gọi API
        fetch('/sanphamct/api/toggle-status/' + id + '?active=' + active, {
            method: "POST",
            headers: {
                "X-CSRF-TOKEN": token,
                "Content-Type": "application/json"
            }
        })
            .then(function(response) {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                // Đọc response dưới dạng text trước để debug
                return response.text().then(function(text) {
                    console.log('Response text:', text);

                    // Nếu response không ok, throw error
                    if (!response.ok) {
                        try {
                            var errorData = JSON.parse(text);
                            throw new Error(errorData.message || 'Lỗi server: ' + response.status);
                        } catch (e) {
                            throw new Error(text || 'Lỗi server: ' + response.status);
                        }
                    }

                    // Parse JSON
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        throw new Error('Invalid JSON response: ' + text);
                    }
                });
            })
            .then(function(data) {
                console.log('Success data:', data);
                el.disabled = false;

                if (data.success) {
                    // Cập nhật trạng thái hiển thị
                    var statusSpan = document.getElementById('status-' + id);
                    if (statusSpan) {
                        statusSpan.textContent = data.trangThai;
                        // Cập nhật class
                        if (data.trangThai === 'Còn hàng') {
                            statusSpan.className = 'badge-active';
                        } else if (data.trangThai === 'Sắp hết') {
                            statusSpan.className = 'badge-out-of-stock';
                        } else {
                            statusSpan.className = 'badge-locked';
                        }
                    }

                    // Cập nhật số lượng nếu có
                    if (data.soLuongTon !== undefined) {
                        var row = document.getElementById('row-' + id);
                        if (row) {
                            var cells = row.querySelectorAll('td');
                            if (cells.length >= 6) {
                                cells[5].textContent = data.soLuongTon;
                            }
                        }
                    }

                    showToast(data.message || 'Cập nhật trạng thái thành công!', 'success');
                } else {
                    showToast(data.message || 'Cập nhật thất bại!', 'error');
                    el.checked = !el.checked;
                }
            })
            .catch(function(error) {
                console.error('ERROR:', error);
                el.disabled = false;
                showToast('Lỗi: ' + error.message, 'error');
                el.checked = !el.checked;
            });
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imgPreview').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // =============================================
    // XỬ LÝ PHÍM ENTER CHO INPUT GIÁ
    // =============================================

    document.addEventListener('DOMContentLoaded', function() {
        var giaBanInput = document.getElementById('giaBan');
        if (giaBanInput) {
            // Chỉ cho phép nhập số
            giaBanInput.addEventListener('keypress', function(event) {
                var key = event.key;
                if (!/^[0-9]$/.test(key) && key !== 'Backspace' && key !== 'Delete' &&
                    key !== 'ArrowLeft' && key !== 'ArrowRight' && key !== 'Tab') {
                    event.preventDefault();
                }
            });

            // Xử lý Enter để submit
            giaBanInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    submitUpdateForm();
                }
            });
        }

        var soLuongInput = document.getElementById('soLuongTon');
        if (soLuongInput) {
            soLuongInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    submitUpdateForm();
                }
            });
        }
    });
</script>

</body>
</html>
