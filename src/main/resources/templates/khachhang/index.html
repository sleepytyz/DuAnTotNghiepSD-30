<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Khách Hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-control:focus, .form-select:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-body">

        <div th:replace="fragments/header :: header('Quản lý khách hàng', 'Khách hàng') "></div>

        <div class="card card-custom mb-4">
            <div class="card-header text-white" style="background:#c92327;">
                <h5 class="mb-0 d-flex align-items-center gap-2">
                    <i class="bi bi-person-lines-fill"></i>
                    <span>Danh sách khách hàng</span>
                </h5>
            </div>

            <div class="card-body bg-light border-bottom">
                <div class="row g-3 align-items-center">

                    <div class="col-xl-5 col-md-6">
                        <form th:action="@{/khach-hang/locsdt}" method="get">
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="bi bi-telephone"></i></span>
                                <input type="text" name="sdt" class="form-control" placeholder="Tìm theo số điện thoại...">
                                <button type="submit" class="btn btn-primary px-3 fw-semibold">
                                    <i class="bi bi-search me-1"></i> Tìm SĐT
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="col-xl-5 col-md-4">
                        <form th:action="@{/khach-hang/lochang}" method="get">
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="bi bi-award"></i></span>
                                <select name="hang" class="form-select">
                                    <option value="">-- Chọn hạng khách hàng --</option>
                                    <option value="Mới">Mới</option>
                                    <option value="Thành viên">Thành viên</option>
                                    <option value="Vip">Vip</option>
                                </select>
                                <button type="submit" class="btn btn-success px-3 fw-semibold">
                                    <i class="bi bi-funnel me-1"></i> Lọc
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="col-xl-2 col-md-2 text-md-end">
                        <a th:href="@{/khach-hang/hien-thi}" class="btn btn-outline-secondary w-100 fw-semibold">
                            <i class="bi bi-arrow-clockwise"></i> Reset
                        </a>
                    </div>

                </div>
            </div>

            <div class="table-card p-3">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th>STT</th>
                        <th>Mã KH</th>
                        <th>Họ tên</th>
                        <th>SĐT</th>
                        <th>Email</th>
                        <th>Địa chỉ</th>
                        <th>Ngày sinh</th>
                        <th>Giới tính</th>
                        <th>Hạng KH</th>
                        <th>Ngày đăng ký</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="ok,row : ${khachHang}">
                        <td th:text="${row.count}"></td>
                        <td th:text="${ok.maKH}"></td>
                        <td th:text="${ok.hoTen}"></td>
                        <td th:text="${ok.sdt}"></td>
                        <td th:text="${ok.email}"></td>
                        <td th:text="${ok.diaChi}"></td>
                        <td th:text="${ok.ngaySinh}"></td>
                        <td th:text="${ok.gioiTinh == true ? 'Nam' : (ok.gioiTinh == false ? 'Nữ' : 'Chưa cập nhật')}"></td>
                        <td th:text="${ok.hangKhachHang}"></td>
                        <td th:text="${ok.ngayDangKy}"></td>
                        <td>
                            <span th:if="${ok.trangThai}" class="badge-active">Hoạt động</span>
                            <span th:if="${!ok.trangThai}" class="badge-locked">Ngừng hoạt động</span>
                        </td>
                        <td>
                            <a class="btn-action-lock" th:href="@{/khach-hang/edit/{id}(id=${ok.maKH})}">
                                Xem
                            </a>
                            <a class="btn-trash ms-2" th:href="@{'/khach-hang/delete/' + ${ok.maKH}}" onclick="return confirm('Bạn có chắc xóa không?')">
                                <i class="bi bi-trash3"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(khachHang)}">
                        <td colspan="12" class="text-center text-muted py-3">
                            Không có dữ liệu khách hàng
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<div class="modal fade" id="khachHangModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background:#c92327; color:white;">
                <h5 class="modal-title">Thông tin khách hàng</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <form th:object="${kh}" method="post">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mã khách hàng</label>
                            <input class="form-control bg-light" th:field="*{maKH}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Họ tên</label>
                            <input class="form-control" th:field="*{hoTen}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Số điện thoại</label>
                            <input class="form-control" th:field="*{sdt}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email</label>
                            <input class="form-control" th:field="*{email}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Địa chỉ</label>
                            <input class="form-control" th:field="*{diaChi}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày sinh</label>
                            <input type="date" class="form-control" th:field="*{ngaySinh}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold mb-2 d-block">Giới tính</label>
                            <div class="form-check form-check-inline">
                                <input type="radio" class="form-check-input" th:field="*{gioiTinh}" value="true" id="gtNam">
                                <label class="form-check-label" for="gtNam">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="radio" class="form-check-input" th:field="*{gioiTinh}" value="false" id="gtNu">
                                <label class="form-check-label" for="gtNu">Nữ</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold mb-2 d-block">Trạng thái</label>
                            <div class="form-check form-check-inline">
                                <input type="radio" class="form-check-input" th:field="*{trangThai}" value="true" id="ttHoatDong">
                                <label class="form-check-label" for="ttHoatDong">Hoạt động</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="radio" class="form-check-input" th:field="*{trangThai}" value="false" id="ttNgung">
                                <label class="form-check-label" for="ttNgung">Ngừng</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Điểm tích lũy</label>
                            <input type="number" class="form-control" th:field="*{diemTichLuy}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Hạng khách hàng</label>
                            <input class="form-control" th:field="*{hangKhachHang}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày đăng ký</label>
                            <input type="date" class="form-control bg-light" th:field="*{ngayDangKy}" readonly>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Ghi chú</label>
                            <input class="form-control" th:field="*{ghiChu}">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:if="${showModal}">
    document.addEventListener("DOMContentLoaded", function () {
        new bootstrap.Modal(document.getElementById('khachHangModal')).show();
    });
</script>
<script>
    function openAddKhachHang() {
        const form = document.querySelector("#khachHangModal form");
        form.querySelector("[name='maKH']").value = "";
        form.querySelector("[name='hoTen']").value = "";
        form.querySelector("[name='sdt']").value = "";
        form.querySelector("[name='email']").value = "";
        form.querySelector("[name='diaChi']").value = "";
        form.querySelector("[name='ngaySinh']").value = "";
        form.querySelector("[name='diemTichLuy']").value = "";
        form.querySelector("[name='hangKhachHang']").value = "";
        form.querySelector("[name='ngayDangKy']").value = "";
        form.querySelector("[name='ghiChu']").value = "";

        form.querySelectorAll("input[name='gioiTinh']").forEach(r => r.checked = false);
        form.querySelectorAll("input[name='trangThai']").forEach(r => r.checked = false);

        document.querySelector("button[formaction='/khach-hang/add']").style.display = "inline-block";
        document.querySelector("button[formaction='/khach-hang/update']").style.display = "none";
    }
</script>
</body>
</html>
