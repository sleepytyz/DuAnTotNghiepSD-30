<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Khách Hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-body">

        <div th:replace="fragments/header :: header('Quản lý khách hàng', 'Khách hàng') "></div>

        <div class="card card-custom mb-4">

        <div class="card-header text-white"
             style="background:#c92327;">
            <h5 class="mb-0">
                <i class="bi bi-pencil-square me-2"></i>
                Thông tin khách hàng
            </h5>
        </div>

            <div class="card p-3 mb-3">

                <div class="row g-2">

                    <!-- LỌC SĐT -->
                    <form th:action="@{/khach-hang/locsdt}" method="get" class="col-md-6 row g-2">

                        <div class="col-md-8">
                            <input type="text"
                                   name="sdt"
                                   class="form-control"
                                   placeholder="Tìm theo số điện thoại">
                        </div>

                        <div class="col-md-4">
                            <button class="btn btn-primary w-100">Tìm SĐT</button>
                        </div>

                    </form>

                    <form th:action="@{/khach-hang/lochang}" method="get" class="col-md-6 row g-2">

                        <div class="col-md-8">
                            <select name="hang" class="form-select">
                                <option value="">-- Chọn hạng --</option>
                                <option value="Mới">Mới</option>
                                <option value="Thành viên">Thành viên</option>
                                <option value="Vip">Vip</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <button class="btn btn-success w-100">Lọc</button>
                        </div>

                    </form>


                        <a th:href="@{/khach-hang/hien-thi}"
                           class="btn btn-secondary">

                            <i class="bi bi-arrow-clockwise"></i>
                            Reset

                        </a></form>

                    <button class="btn btn-danger mb-3"
                            data-bs-toggle="modal"
                            data-bs-target="#khachHangModal"
                            onclick="openAddKhachHang()">
                        Thêm khách hàng
                    </button>

                </div>

            </div>

        <div class="table-card mt-4">

            <table class="table-custom">

                <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã KH</th>
                    <th>Họ tên</th>
                    <th>SĐT</th>
                    <th>Email</th>
                    <th>Địa chỉ</th>
                    <th>Ngày sinh</th>
                    <th>Giới tính</th>
                    <th>Hạng KH</th>
                    <th>Ngày đăng ký</th>
                    <th>Trang thai</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="ok,row : ${khachHang}">

                    <td th:text="${row.count}"></td>

                    <td th:text="${ok.maKH}"></td>

                    <td th:text="${ok.hoTen}"></td>

                    <td th:text="${ok.sdt}"></td>

                    <td th:text="${ok.email}"></td>

                    <td th:text="${ok.diaChi}"></td>

                    <td th:text="${ok.ngaySinh}"></td>

                    <td th:text="${ok.gioiTinh ? 'Nam' : 'Nữ'}"></td>

                    <td th:text="${ok.hangKhachHang}"></td>

                    <td th:text="${ok.ngayDangKy}"></td>

                    <td>
                        <span th:if="${ok.trangThai}" class="badge-active">Hoạt động</span>
                        <span th:if="${!ok.trangThai}" class="badge-locked">Ngừng hoạt động</span>
                    </td>


                    <td>
                        <a class="btn-action-lock"
                           th:href="@{/khach-hang/edit/{id}(id=${ok.maKH})}">
                            Xem
                        </a>

                        <a class="btn-trash ms-2"
                           th:href="@{'/khach-hang/delete/' + ${ok.maKH}}"
                           onclick="return confirm('Bạn có chắc xóa không?')">

                            <i class="bi bi-trash3"></i>
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(khachHang)}">
                    <td colspan="11" class="text-center">
                        Không có dữ liệu khách hàng
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<div class="modal fade" id="khachHangModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header" style="background:#c92327; color:white;">
                <h5 class="modal-title">Thông tin khách hàng</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <form th:object="${kh}" method="post">

                <div class="modal-body">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label>Mã khách hàng</label>
                            <input class="form-control bg-light" th:field="*{maKH}" readonly>
                        </div>

                        <div class="col-md-6">
                            <label>Họ tên</label>
                            <input class="form-control" th:field="*{hoTen}" required>
                        </div>

                        <div class="col-md-6">
                            <label>Số điện thoại</label>
                            <input class="form-control" th:field="*{sdt}" required>
                        </div>

                        <div class="col-md-6">
                            <label>Email</label>
                            <input class="form-control" th:field="*{email}" required>
                        </div>

                        <div class="col-md-6">
                            <label>Địa chỉ</label>
                            <input class="form-control" th:field="*{diaChi}" required>
                        </div>

                        <div class="col-md-6">
                            <label>Ngày sinh</label>
                            <input type="date" class="form-control" th:field="*{ngaySinh}">
                        </div>

                        <!-- GIỚI TÍNH -->
                        <div class="col-md-6">
                            <label>Giới tính</label><br>

                            <input type="radio" th:field="*{gioiTinh}" value="true"> Nam
                            <input type="radio" th:field="*{gioiTinh}" value="false" class="ms-3"> Nữ
                        </div>

                        <!-- TRẠNG THÁI (BOOLEAN) -->
                        <div class="col-md-6">
                            <label>Trạng thái</label><br>

                            <input type="radio" th:field="*{trangThai}" value="true"> Hoạt động
                            <input type="radio" th:field="*{trangThai}" value="false" class="ms-3"> Ngừng
                        </div>

                        <div class="col-md-6">
                            <label>Điểm tích lũy</label>
                            <input type="number" class="form-control" th:field="*{diemTichLuy}">
                        </div>

                        <div class="col-md-6">
                            <label>Hạng khách hàng</label>
                            <input class="form-control" th:field="*{hangKhachHang}">
                        </div>

                        <div class="col-md-6">
                            <label>Ngày đăng ký</label>
                            <input type="date" class="form-control bg-light" th:field="*{ngayDangKy}" readonly>
                        </div>

                        <div class="col-md-12">
                            <label>Ghi chú</label>
                            <input class="form-control" th:field="*{ghiChu}">
                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="submit"
                            formaction="/khach-hang/add"
                            class="btn btn-danger">
                        Thêm
                    </button>

                    <button type="submit"
                            formaction="/khach-hang/update"
                            class="btn btn-warning">
                        Sửa
                    </button>

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Đóng
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>
<script th:if="${showModal}">
    document.addEventListener("DOMContentLoaded", function () {
        new bootstrap.Modal(
            document.getElementById('khachHangModal')
        ).show();
    });
</script>
<script>
    function openAddKhachHang() {

        const form = document.querySelector("#khachHangModal form");

        form.querySelector("[name='maKH']").value = "";
        form.querySelector("[name='hoTen']").value = "";
        form.querySelector("[name='sdt']").value = "";
        form.querySelector("[name='email']").value = "";
        form.querySelector("[name='diaChi']").value = "";
        form.querySelector("[name='ngaySinh']").value = "";
        form.querySelector("[name='diemTichLuy']").value = "";
        form.querySelector("[name='hangKhachHang']").value = "";
        form.querySelector("[name='ngayDangKy']").value = "";
        form.querySelector("[name='ghiChu']").value = "";

        form.querySelectorAll("input[name='gioiTinh']").forEach(r => r.checked = false);
        form.querySelectorAll("input[name='trangThai']").forEach(r => r.checked = false);

        document.querySelector("button[formaction='/khach-hang/add']").style.display = "inline-block";
        document.querySelector("button[formaction='/khach-hang/update']").style.display = "none";
    }
</script>

</body>
</html>
