<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Khách Hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="modal fade"
     id="khachHangModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header bg-danger text-white">

                <h5 class="modal-title">
                    Chi Tiết Khách Hàng
                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label>Mã khách hàng</label>
                        <input id="khMaKH"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Họ tên</label>
                        <input id="khHoTen"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Số điện thoại</label>
                        <input id="khSdt"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Email</label>
                        <input id="khEmail"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Ngày sinh</label>
                        <input id="khNgaySinh"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Giới tính</label>
                        <input id="khGioiTinh"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Điểm tích lũy</label>
                        <input id="khDiem"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Hạng khách hàng</label>
                        <input id="khHang"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-12">
                        <label>Địa chỉ</label>
                        <input id="khDiaChi"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Ngày đăng ký</label>
                        <input id="khNgayDangKy"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="col-md-12">
                        <label>Ghi chú</label>
                        <textarea id="khGhiChu"
                                  class="form-control"
                                  rows="3"
                                  readonly></textarea>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<div class="wrapper">

    <!-- Sidebar -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-body">

        <div th:replace="fragments/header :: header('Quản lý khách hàng', 'Khách hàng') "></div>

        <div class="card card-custom mb-4">

        <div class="card-header text-white"
             style="background:#c92327;">
            <h5 class="mb-0">
                <i class="bi bi-pencil-square me-2"></i>
                Thông tin khách hàng
            </h5>
        </div>

        <!-- Form -->
        <div class="filter-card">

            <form th:object="${kh}" method="post">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="filter-label">Mã khách hàng</label>
                        <input type="text"
                               class="form-control bg-light"
                               th:field="*{maKH}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="filter-label">Tên khách hàng</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{hoTen}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="filter-label">Số điện thoại</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{sdt}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="filter-label">Email</label>
                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="filter-label">Địa chỉ</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{diaChi}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="filter-label">Ngày sinh</label>
                        <input type="date"
                               class="form-control"
                               th:field="*{ngaySinh}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="filter-label">Giới tính</label>

                        <div class="mt-2">
                            <input type="radio"
                                   th:field="*{gioiTinh}"
                                   value="true">
                            Nam

                            <input type="radio"
                                   class="ms-3"
                                   th:field="*{gioiTinh}"
                                   value="false">
                            Nữ
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="filter-label">Điểm tích lũy</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{diemTichLuy}">
                    </div>

                    <div class="col-md-6">
                        <label class="filter-label">Hạng khách hàng</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{hangKhachHang}">
                    </div>

                    <div class="col-md-6">
                        <label class="filter-label">Ngày đăng ký</label>
                        <input type="date"
                               class="form-control bg-light"
                               th:field="*{ngayDangKy}"
                               readonly>
                    </div>

                    <div class="col-md-12">
                        <label class="filter-label">Ghi chú</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{ghiChu}">
                    </div>
                </div>



                <div class="d-flex gap-2 mt-4">

                    <button type="submit"
                            class="btn btn-danger action-btn"
                            th:formaction="@{/khach-hang/add}">
                        <i class="bi bi-plus-lg"></i>
                        Thêm
                    </button>

                    <button type="submit"
                            class="btn btn-warning action-btn"
                            th:formaction="@{/khach-hang/update}">
                        Sửa
                    </button>

                    <a th:href="@{/khach-hang/hien-thi}"
                       class="btn btn-secondary action-btn">
                        Reset
                    </a>

                </div>


            </form>

        </div>

        <!-- Table -->
        <div class="table-card mt-4">

            <table class="table-custom">

                <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã KH</th>
                    <th>Họ tên</th>
                    <th>SĐT</th>
                    <th>Email</th>
                    <th>Địa chỉ</th>
                    <th>Ngày sinh</th>
                    <th>Giới tính</th>
                    <th>Hạng KH</th>
                    <th>Ngày đăng ký</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="ok,row : ${khachHang}">

                    <td th:text="${row.count}"></td>

                    <td th:text="${ok.maKH}"></td>

                    <td th:text="${ok.hoTen}"></td>

                    <td th:text="${ok.sdt}"></td>

                    <td th:text="${ok.email}"></td>

                    <td th:text="${ok.diaChi}"></td>

                    <td th:text="${ok.ngaySinh}"></td>

                    <td th:text="${ok.gioiTinh ? 'Nam' : 'Nữ'}"></td>

                    <td th:text="${ok.hangKhachHang}"></td>

                    <td th:text="${ok.ngayDangKy}"></td>

                    <td>

                        <button type="button"
                                class="btn-action-lock"

                                data-bs-toggle="modal"
                                data-bs-target="#khachHangModal"

                                th:data-makh="${ok.maKH}"
                                th:data-hoten="${ok.hoTen}"
                                th:data-sdt="${ok.sdt}"
                                th:data-email="${ok.email}"
                                th:data-diachi="${ok.diaChi}"
                                th:data-ngaysinh="${ok.ngaySinh}"
                                th:data-gioitinh="${ok.gioiTinh}"
                                th:data-diem="${ok.diemTichLuy}"
                                th:data-hang="${ok.hangKhachHang}"
                                th:data-ngaydangky="${ok.ngayDangKy}"
                                th:data-ghichu="${ok.ghiChu}"

                                onclick="showKhachHang(this)">

                            Xem

                        </button>

                        <a class="btn-trash ms-2"
                           th:href="@{'/khach-hang/delete/' + ${ok.maKH}}"
                           onclick="return confirm('Bạn có chắc xóa không?')">

                            <i class="bi bi-trash3"></i>

                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(khachHang)}">
                    <td colspan="11" class="text-center">
                        Không có dữ liệu khách hàng
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>

    function showKhachHang(button){

        document.getElementById("khMaKH").value =
            button.getAttribute("data-makh");

        document.getElementById("khHoTen").value =
            button.getAttribute("data-hoten");

        document.getElementById("khSdt").value =
            button.getAttribute("data-sdt");

        document.getElementById("khEmail").value =
            button.getAttribute("data-email");

        document.getElementById("khDiaChi").value =
            button.getAttribute("data-diachi");

        document.getElementById("khNgaySinh").value =
            button.getAttribute("data-ngaysinh");

        document.getElementById("khDiem").value =
            button.getAttribute("data-diem");

        document.getElementById("khHang").value =
            button.getAttribute("data-hang");

        document.getElementById("khNgayDangKy").value =
            button.getAttribute("data-ngaydangky");

        document.getElementById("khGhiChu").value =
            button.getAttribute("data-ghichu");

        let gt = button.getAttribute("data-gioitinh");

        document.getElementById("khGioiTinh").value =
            gt === "true" ? "Nam" : "Nữ";
    }

</script>
</body>
</html>
