<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý ảnh sản phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-3">

    <h3>Quản lý ảnh sản phẩm</h3>

    <form method="post"
          enctype="multipart/form-data"
          th:action="@{/sanphamha/add}">

        <div class="mb-3">
            <label>Sản phẩm chi tiết</label>

            <select name="maSPCT" class="form-control">
                <option value="">-- Chọn sản phẩm --</option>

                <option th:each="spct : ${listSPCT}"
                        th:value="${spct.maSanPhamChiTiet}"
                        th:text="${spct.maSanPham.tenSanPham + ' - ' + spct.mauSac}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label>Chọn ảnh</label>
            <input type="file" name="file" class="form-control">
        </div>

        <div class="mb-3">
            <input type="checkbox"
                   name="laAnhChinh"
                   value="true">

            <label>Đặt làm ảnh chính</label>
        </div>

        <button type="submit" class="btn btn-success">
            Upload
        </button>

    </form>

    <hr>

    <table class="table table-bordered">

        <thead>
        <tr>
            <th>STT</th>
            <th>Ảnh</th>
            <th>Sản phẩm</th>
            <th>Loại ảnh</th>
            <th>Hành động</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="anh, stt : ${listAnh}">

            <td th:text="${stt.count}"></td>

            <td>
                <img th:src="@{/sanphamha/image/{id}(id=${anh.maHinhAnh})}"
                     width="120"
                     height="120">
            </td>

            <td th:text="${anh.sanPhamChiTiet.maSanPham.tenSanPham + ' - ' + anh.sanPhamChiTiet.mauSac + ' - ' + anh.sanPhamChiTiet.size}"></td>

            <td th:text="${anh.laAnhChinh ? 'Ảnh chính' : 'Ảnh phụ'}"></td>

            <td>

                <a class="btn btn-warning btn-sm"
                   th:href="@{/sanphamha/set-main/{id}(id=${anh.maHinhAnh})}">
                    Ảnh chính
                </a>

                <a class="btn btn-danger btn-sm"
                   th:href="@{/sanphamha/delete/{id}(id=${anh.maHinhAnh})}"
                   onclick="return confirm('Bạn có chắc muốn xóa?')">
                    Xóa
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
