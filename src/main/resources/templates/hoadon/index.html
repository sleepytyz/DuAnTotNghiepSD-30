<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Hóa Đơn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-body">

        <!-- HEADER -->
        <div th:replace="fragments/header :: header('Quản lý hóa đơn', 'Hóa đơn')"></div>


        <section class="card card-custom mb-4">

            <div class="card-header text-white"
                 style="background:#c92327;">
                <h5 class="mb-0">
                    <i class="bi bi-pencil-square me-2"></i>
                    Bộ lọc hoá đơn
                </h5>
            </div>

            <form class="card-body filter-form" method="get" th:action="@{/hoa-don}" >

                <div class="filter-row">

                    <div class="form-group">
                        <label class="filter-label">MÃ HÓA ĐƠN</label>
                        <input type="text"
                               class="form-control"
                               name="keyword"
                               th:value="${keyword}"
                               placeholder="Nhập mã hóa đơn...">
                    </div>

                    <div class="form-group">
                        <label class="filter-label">NGÀY BẮT ĐẦU</label>
                        <input type="date"
                               class="form-control"
                               name="fromDate">
                    </div>

                    <div class="form-group">
                        <label class="filter-label">NGÀY KẾT THÚC</label>
                        <input type="date"
                               class="form-control"
                               name="toDate">
                    </div>

                    <div class="form-group">
                        <label class="filter-label">LOẠI ĐƠN</label>
                        <select class="form-select" name="type">
                            <option value="">Tất cả</option>
                            <option value="ONLINE">Trực tuyến</option>
                            <option value="OFFLINE">Tại quầy</option>
                        </select>
                    </div>

                    <div class="filter-actions">

                        <button type="submit" class="btn-search">
                            <i class="fa fa-search"></i>
                            Tìm kiếm
                        </button>

                        <a th:href="@{/hoa-don}" class="btn-reset">
                            <i class="bi bi-arrow-clockwise"></i>
                            <span>Reset</span>
                        </a>

                    </div>

                </div>

            </form>

        </section>

        <!-- TABLE -->
        <section class="table-card">

            <!-- STATUS FILTER + EXPORT -->
            <div class="table-header">

                <div class="status-tabs">
                    <button class="tab-item active">Tất cả</button>
                    <button class="tab-item">Chờ xác nhận</button>
                    <button class="tab-item">Đã xác nhận</button>
                    <button class="tab-item">Chờ giao</button>
                    <button class="tab-item">Đang giao</button>
                    <button class="tab-item">Hoàn thành</button>
                    <button class="tab-item">Đã huỷ</button>
                </div>

                <button type="button" class="btn-export">
                    <i class="bi bi-file-earmark-excel-fill"></i>
                    Xuất Excel
                </button>

            </div>

            <!-- TABLE -->
            <div class="table-wrapper">

                <table class="table-custom">

                    <thead>
                    <tr>
                        <th>STT</th>
                        <th>MÃ HĐ</th>
                        <th>MÃ NV</th>
                        <th>MÃ KH</th>
                        <th>TỔNG TIỀN</th>
                        <th>THANH TOÁN</th>
                        <th>TRẠNG THÁI</th>
                        <th>HÀNH ĐỘNG</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="hd,stt : ${list}">

                        <td th:text="${stt.count}"></td>

                        <td th:text="'HD' + ${hd.maHoaDon}"></td>

                        <td th:text="${hd.maNhanVien}"></td>

                        <td th:text="${hd.maKhachHang}"></td>

                        <td th:text="${#numbers.formatDecimal(hd.tongTien, 0, 'COMMA', 0, 'POINT')}"></td>

                        <td th:text="${hd.phuongThucThanhToan}"></td>

                        <td>
                           <span th:class="'status-badge status-' + ${hd.trangThai}"
                                 th:text="${hd.trangThai}">
</span>
                        </td>

                        <td class="action-cell">

                            <a class="btn-detail"
                               th:href="@{/hoa-don/detail/{id}(id=${hd.maHoaDon})}"
                               title="Chi tiết">
                                <i class="bi bi-eye-fill"></i>
                            </a>

                            <a class="btn-delete"
                               th:href="@{/hoa-don/delete/{id}(id=${hd.maHoaDon})}"
                               title="Xóa">
                                <i class="bi bi-trash-fill"></i>
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>
</div>

</body>
</html>
