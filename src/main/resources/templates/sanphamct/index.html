<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm chi tiết - FS Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .form-control:focus, .form-select:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
        }
        .filter-section form {
            margin: 0;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div sec:authorize="hasRole('ADMIN')">
        <div th:replace="fragments/sidebaradmin :: sidebar-admin"></div>
    </div>

    <div sec:authorize="hasRole('STAFF')">
        <div th:replace="fragments/sidebarstaff :: sidebar-staff"></div>
    </div>

    <div class="content-body">

        <div th:replace="~{fragments/header :: header('Quản lý sản phẩm chi tiết', 'Sản phẩm chi tiết')}"></div>

        <section class="card card-custom mb-4 shadow-sm border-0 mt-3 filter-section">
            <div class="card-header text-white" style="background:#c92327;">
                <h5 class="mb-0 d-flex align-items-center gap-2 py-1">
                    <i class="bi bi-funnel-fill"></i>
                    <span>Bộ lọc & Tìm kiếm sản phẩm</span>
                </h5>
            </div>

            <div class="card-body bg-white p-4">
                <div class="row g-3 align-items-end">

                    <div class="col-xl-2 col-md-3 d-flex gap-2">
                        <button type="button" class="btn shadow-sm rounded-pill "
                                onclick="openAddModal()"
                                data-bs-toggle="modal" data-bs-target="#spctModal" style="background-color: #c92327 ; color: white">
                            <i class="bi bi-plus-lg me-1"></i> Thêm mới SPCT
                        </button>

                        <a th:href="@{/sanphamct/index}" class="btn btn-outline-secondary d-flex align-items-center justify-content-center px-3"
                           style="height: 38px;" title="Reset bộ lọc">
                            <i class="bi bi-arrow-clockwise fw-bold"></i>
                        </a>
                    </div>

                    <div class="col-xl-2 col-md-3">
                        <label class="form-label fw-semibold text-dark small mb-2"><i class="bi bi-ruters me-1"></i>Kích thước</label>
                        <form action="/sanphamct/locsize" method="get">
                            <select name="size" class="form-select border-secondary-subtle" onchange="this.value === '' ? window.location.href='/sanphamct/index' : this.form.submit()" style="height: 38px;">
                                <option value="" th:selected="${selectedSize == null || selectedSize == ''}">Tất cả</option>
                                <option th:each="s : ${lists}"
                                        th:value="${s.maKichThuoc}"
                                        th:text="${s.tenKichThuoc}"
                                        th:selected="${#strings.equals(s.maKichThuoc, selectedSize)}">
                                </option>
                            </select>
                        </form>
                    </div>

                    <div class="col-xl-2 col-md-3">
                        <label class="form-label fw-semibold text-dark small mb-2"><i class="bi bi-palette me-1"></i>Màu sắc</label>
                        <form action="/sanphamct/locmsac" method="get">
                            <select name="msac" class="form-select border-secondary-subtle" onchange="this.value === '' ? window.location.href='/sanphamct/index' : this.form.submit()" style="height: 38px;">
                                <option value="" th:selected="${selectedMauSac == null || selectedMauSac == ''}">Tất cả</option>
                                <option th:each="m : ${listms}"
                                        th:value="${m.maMauSac}"
                                        th:text="${m.tenMauSac}"
                                        th:selected="${#strings.equals(m.maMauSac, selectedMauSac)}">
                                </option>
                            </select>
                        </form>
                    </div>

                    <div class="col-xl-2 col-md-3">
                        <label class="form-label fw-semibold text-dark small mb-2"><i class="bi bi-check-circle me-1"></i>Trạng thái</label>
                        <form action="/sanphamct/loctt" method="get">
                            <select name="tt" class="form-select border-secondary-subtle" onchange="this.value === '' ? window.location.href='/sanphamct/index' : this.form.submit()" style="height: 38px;">
                                <option value="" th:selected="${selectedStatus == null || selectedStatus == ''}">Tất cả</option>
                                <option value="Còn hàng" th:selected="${selectedStatus == 'Còn hàng'}">Còn hàng</option>
                                <option value="Sắp hết" th:selected="${selectedStatus == 'Sắp hết'}">Sắp hết</option>
                                <option value="Hết hàng" th:selected="${selectedStatus == 'Hết hàng'}">Hết hàng</option>
                                <option value="Ngừng bán" th:selected="${selectedStatus == 'Ngừng bán'}">Ngừng bán</option>
                            </select>
                        </form>
                    </div>

                    <div class="col-xl-4 col-md-12">
                        <label class="form-label fw-semibold text-dark small mb-2"><i class="bi bi-cash-stack me-1"></i>Khoảng giá (VNĐ)</label>
                        <form action="/sanphamct/locgia" method="get">
                            <div class="input-group" style="height: 38px;">
                                <input type="number" name="gia" class="form-control border-secondary-subtle" placeholder="Từ giá">
                                <span class="input-group-text bg-light text-secondary">-</span>
                                <input type="number" name="gia2" class="form-control border-secondary-subtle" placeholder="Đến giá">
                                <button class="btn text-white px-3" style="background:#c92327;"><i class="bi bi-search"></i></button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </section>

        <section class="table-card shadow-sm border-0">
            <div class="table-header bg-white border-bottom p-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
                <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                    <i class="bi bi-list-ul text-danger"></i> Danh sách chi tiết sản phẩm
                </h5>
            </div>

            <div class="table-wrapper p-3">
                <div class="table-responsive">
                    <table class="table-custom align-middle">
                        <thead>
                        <tr>
                            <th style="width: 60px;">STT</th>
                            <th>MÃ SPCT</th>
                            <th>SẢN PHẨM</th>
                            <th>SIZE</th>
                            <th>MÀU SẮC</th>
                            <th>GIÁ NHẬP</th>
                            <th>GIÁ BÁN</th>
                            <th>TỒN KHO</th>
                            <th>TRẠNG THÁI</th>
                            <th>HÌNH ẢNH</th>
                            <th style="width: 90px;">HÀNH ĐỘNG</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c,row : ${listspct}">
                            <td th:text="${row.count}"></td>
                            <td><span class="fw-semibold text-danger" th:text="${'SPCT' + c.maSanPhamChiTiet}"></span></td>
                            <td class="fw-medium text-dark" th:text="${c.sanPham.tenSanPham}"></td>
                            <td th:text="${c.kichThuoc.tenKichThuoc}"></td>
                            <td th:text="${c.mauSac.tenMauSac}"></td>
                            <td th:text="${#numbers.formatDecimal(c.giaNhap, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(c.giaBan, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="fw-semibold" th:text="${c.soLuongTon}"></td>
                            <td>
                                <span th:if="${c.trangThai == 'Còn hàng'}" class="badge bg-success-subtle text-success border border-success-subtle px-2.5 py-1.5 rounded-pill fw-bold">Còn hàng</span>
                                <span th:if="${c.trangThai == 'Sắp hết'}" class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2.5 py-1.5 rounded-pill fw-bold">Sắp hết</span>
                                <span th:if="${c.trangThai == 'Hết hàng'}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-2.5 py-1.5 rounded-pill fw-bold">Hết hàng</span>
                                <span th:if="${c.trangThai == 'Ngừng bán'}" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-2.5 py-1.5 rounded-pill fw-bold">Ngừng bán</span>
                            </td>
                            <td>
                                <th:block th:each="anh : ${c.danhSachAnh}">
                                    <img th:if="${anh.laAnhChinh}" th:src="@{/sanphamct/image/{id}(id=${anh.maHinhAnh})}"
                                         width="55" height="55" class="shadow-sm rounded border" style="object-fit:cover">
                                </th:block>
                            </td>
                            <td>
                                <a class="btn btn-sm btn-outline-danger"
                                   th:href="@{/sanphamct/edit/{id}(id=${c.maSanPhamChiTiet})}"
                                   onclick="openEditModal()">
                                    <i class="bi bi-pencil-fill"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listspct)}">
                            <td colspan="11" class="text-center text-muted py-5">Không tìm thấy sản phẩm chi tiết nào phù hợp.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <div class="modal fade" id="spctModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg">
                    <div class="modal-header text-white" style="background:#c92327;">
                        <h5 class="modal-title fw-bold d-flex align-items-center gap-2">
                            <i class="bi bi-box-seam-fill"></i>
                            <span th:text="${isEdit == null ? 'Thêm thông tin sản phẩm chi tiết' : 'Cập nhật sản phẩm chi tiết'}"></span>
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body p-4 bg-light-subtle">


                        <form method="post" th:object="${sanphamct}">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-dark">Mã SPCT (Tự động)</label>
                                    <input type="text" class="form-control bg-light border-secondary-subtle" id="masanphamct" th:field="*{maSanPhamChiTiet}" readonly placeholder="Mã sinh tự động">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-dark">Sản phẩm cha <span class="text-danger">*</span></label>
                                    <select class="form-select border-secondary-subtle" th:field="*{sanPham.maSanPham}">
                                        <option th:each="c : ${listsp}" th:value="${c.maSanPham}" th:text="${c.maSanPham + ' - ' + c.tenSanPham}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-dark">Kích cỡ (Size) <span class="text-danger">*</span></label>
                                    <select id="size" class="form-select border-secondary-subtle" th:field="*{kichThuoc.maKichThuoc}">
                                        <option th:each="c : ${lists}" th:value="${c.maKichThuoc}" th:text="${c.tenKichThuoc}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-dark">Màu sắc <span class="text-danger">*</span></label>
                                    <select id="mausac" class="form-select border-secondary-subtle" th:field="*{mauSac.maMauSac}">
                                        <option th:each="c : ${listms}" th:value="${c.maMauSac}" th:text="${c.tenMauSac}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-dark">Giá nhập kho (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" step="1" id="gianhap" class="form-control border-secondary-subtle" th:field="*{giaNhap}" placeholder="Nhập giá nhập kho">
                                    <span class="text-danger small" th:if="${#fields.hasErrors('giaNhap')}" th:errors="*{giaNhap}"></span>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-dark">Giá bán sản phẩm (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" step="1" id="giaban" class="form-control border-secondary-subtle" th:field="*{giaBan}" placeholder="Nhập giá bán ra">
                                    <span class="text-danger small" th:if="${#fields.hasErrors('giaBan')}" th:errors="*{giaBan}"></span>
                                </div>

                                <div class="col-md-12"> <label class="form-label fw-semibold small text-dark">Số lượng kho tồn <span class="text-danger">*</span></label>
                                    <input type="number" id="soluongton" class="form-control border-secondary-subtle" th:field="*{soLuongTon}" placeholder="0">
                                    <span class="text-danger small" th:if="${#fields.hasErrors('soLuongTon')}" th:errors="*{soLuongTon}"></span>
                                </div>

                                <div class="col-md-6" id="divNgayTao" th:if="${sanphamct.ngayTao != null}">
                                    <label class="form-label fw-semibold small text-secondary">Ngày tạo hệ thống</label>
                                    <input type="text" class="form-control bg-light border-secondary-subtle text-muted" readonly th:value="${#temporals.format(sanphamct.ngayTao,'dd-MM-yyyy HH:mm')}">
                                </div>

                                <div class="col-md-6" id="divNgayCapNhat" th:if="${sanphamct.ngayCapNhat != null}">
                                    <label class="form-label fw-semibold small text-secondary">Ngày cập nhật cuối</label>
                                    <input type="text" class="form-control bg-light border-secondary-subtle text-muted" readonly th:value="${#temporals.format(sanphamct.ngayCapNhat,'dd-MM-yyyy HH:mm')}">
                                </div>

                            </div>

                            <hr class="text-secondary-subtle my-4">

                            <div class="d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-secondary px-4" onclick="resetForm()">
                                    <i class="bi bi-arrow-clockwise me-1"></i> Làm mới
                                </button>

                                <button id="btnThem" class="btn btn-success px-4" type="submit" formaction="/sanphamct/add">
                                    <i class="bi bi-plus-circle me-1"></i> Thêm mới
                                </button>

                                <button id="btnSua" class="btn btn-warning ..." type="submit" formaction="/sanphamct/update" style="display: none;">
                                    <i class="bi bi-pencil-square me-1"></i> Xác nhận sửa
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function openEditModal() {
        // 1. Hiện nút Sửa, ẩn nút Thêm
        document.getElementById("btnThem").style.display = "none";
        document.getElementById("btnSua").style.display = "inline-block";

        // 2. Hiện các trường ngày tháng
        if(document.getElementById("divNgayTao")) document.getElementById("divNgayTao").style.display = "block";
        if(document.getElementById("divNgayCapNhat")) document.getElementById("divNgayCapNhat").style.display = "block";

        // 3. Cập nhật tiêu đề
        document.querySelector('.modal-title span').innerText = 'Cập nhật sản phẩm chi tiết';
    }

    function openAddModal() {
        const form = document.querySelector('#spctModal form');
        form.reset();

        // 1. Xóa sạch giá trị các input bằng ID
        document.getElementById("masanphamct").value = "";
        document.getElementById("gianhap").value = "";
        document.getElementById("giaban").value = "";
        document.getElementById("soluongton").value = "";

        // 2. Reset các select về lựa chọn đầu tiên
        const selects = form.querySelectorAll('select');
        selects.forEach(select => select.selectedIndex = 0);

        // 3. Xóa thông báo lỗi (nếu có từ lần submit trước)
        document.querySelectorAll('.text-danger').forEach(el => el.textContent = '');

        // 4. Ẩn các trường ngày tháng
        const divNgayTao = document.getElementById("divNgayTao");
        const divNgayCapNhat = document.getElementById("divNgayCapNhat");
        if(divNgayTao) divNgayTao.style.display = "none";
        if(divNgayCapNhat) divNgayCapNhat.style.display = "none";

        // 5. Đổi nút và tiêu đề
        document.getElementById("btnThem").style.display = "inline-block";
        document.getElementById("btnSua").style.display = "none";
        document.querySelector('.modal-title span').innerText = 'Thêm thông tin sản phẩm chi tiết';
    }

</script>
<script th:if="${showModal}" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        var myModal = new bootstrap.Modal(document.getElementById('spctModal'));
        myModal.show();

        var isEdit = /*[[${isEdit != null ? isEdit : false}]]*/ false;

        if (isEdit) {
            openEditModal();
        }
    });
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
