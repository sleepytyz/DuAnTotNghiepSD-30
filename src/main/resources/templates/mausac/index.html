<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý màu sắc - FS Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-wrapper">

        <div th:replace="fragments/header :: header('Quản lý màu sắc', 'Màu sắc')"></div>

        <div class="content-body">

            <div th:if="${mess}" class="alert alert-danger">
                <span th:text="${mess}"></span>
            </div>

            <div class="card card-custom mb-4">

                <div class="card-header text-white" style="background:#c92327;">
                    <h5 class="mb-0">
                        <i class="bi bi-palette"></i>
                        Thêm màu sắc
                    </h5>
                </div>

                <div class="card-body">

                    <form th:action="@{/mausac/add}"
                          th:object="${mausac}"
                          method="post">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Tên màu sắc</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{tenMauSac}"
                                       placeholder="VD: Đỏ, Xanh, Đen...">

                                <div class="alert alert-danger"
                                     th:if="${#fields.hasErrors('tenMauSac')}"
                                     th:text="${#fields.errors('tenMauSac')[0]}">
                                </div>
                            </div>

                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-custom-red">
                                <i class="bi bi-plus-circle"></i>
                                Thêm mới
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <div class="table-card">

                <table class="table-custom">

                    <thead>
                    <tr>
                        <th>STT</th>
                        <th>Mã</th>
                        <th>Màu sắc</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="c,stt : ${listms}">

                        <td th:text="${stt.count}"></td>

                        <td th:text="${'MS' + c.maMauSac}"></td>

                        <td th:text="${c.tenMauSac}"></td>

                    </tr>
                    </tbody>

                </table>

            </div>

        </div>
    </div>
</div>

</body>
</html>
