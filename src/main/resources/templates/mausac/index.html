<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý màu sắc - FS Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .form-control:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
        }

        .pagination .page-item .page-link {
            color: #495057;
            background-color: #f8f9fa;
            transition: all 0.2s ease;
        }
        .pagination .page-item .page-link:hover {
            background-color: #e9ecef;
            color: #c92327;
        }
        .pagination .page-item.active .page-link {
            background-color: #c92327 !important;
            color: #fff !important;
            border-color: #c92327 !important;
            box-shadow: 0 4px 10px rgba(201, 35, 39, 0.2);
        }
        .pagination .page-item.disabled .page-link {
            background-color: #f8f9fa;
            color: #6c757d;
            opacity: 0.5;
        }

        /* ===== TOAST STYLES ===== */
        .toast-container-custom {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 420px;
            width: 100%;
        }
        .toast-custom {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #dc3545;
            animation: slideInRight 0.4s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .toast-custom.success {
            border-left-color: #28a745;
        }
        .toast-custom.warning {
            border-left-color: #ffc107;
        }
        .toast-custom.error {
            border-left-color: #dc3545;
        }
        .toast-custom .toast-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .toast-custom .toast-content {
            flex: 1;
        }
        .toast-custom .toast-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #2d3748;
        }
        .toast-custom .toast-message {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 2px;
        }
        .toast-custom .toast-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #adb5bd;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .toast-custom .toast-close:hover {
            color: #dc3545;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        .input-group-text {
            border-radius: 8px 0 0 8px !important;
        }
        .form-control {
            border-radius: 0 8px 8px 0 !important;
        }
        .form-control[readonly] {
            background-color: #fff8f8 !important;
            border-color: #c92327 !important;
            color: #c92327 !important;
            font-weight: 700 !important;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div th:replace="~{fragments/sidebaradmin :: sidebar-admin}"></div>

    <div class="content-body px-3">

        <!-- Toast Container -->
        <div class="toast-container-custom" id="toastContainer"></div>

        <div th:replace="fragments/header :: header('Quản lý màu sắc', 'Màu sắc')"></div>

        <!-- ===== ẨN ALERT CŨ, CHỈ DÙNG ĐỂ LẤY DỮ LIỆU ===== -->
        <div id="alertData" style="display: none;">
            <div id="successMessage" th:text="${successMess}"></div>
            <div id="warningMessage" th:text="${mess}"></div>
            <div id="errorMessage" th:text="${errorMess}"></div>
        </div>

        <section class="card card-custom mb-4 shadow-sm border-0 mt-3">
            <div class="card-header text-white" style="background:#c92327;">
                <h5 class="mb-0 d-flex align-items-center gap-2 py-1">
                    <i class="bi bi-palette-fill"></i>
                    <span>Thêm màu sắc mới</span>
                </h5>
            </div>

            <div class="card-body bg-white p-4">
                <form th:action="@{/mausac/add}" th:object="${mausac}" method="post" id="addForm">
                    <div class="row g-3 align-items-end">

                        <!-- Mã màu sắc (tự động) -->
                        <div class="col-lg-3 col-md-6">
                            <label class="form-label fw-semibold text-dark small mb-2">Mã màu sắc <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-secondary-subtle text-muted">
                                    <i class="bi bi-tag"></i>
                                </span>
                                <input type="text"
                                       class="form-control bg-light border-secondary-subtle fw-bold text-danger"
                                       th:field="*{maMauSac}"
                                       readonly
                                       style="background-color: #f8f9fa !important; cursor: not-allowed;">
                            </div>
                        </div>

                        <div class="col-lg-6 col-md-8">
                            <label class="form-label fw-semibold text-dark small mb-2">Tên màu sắc <span class="text-danger">*</span></label>
                            <input type="text"
                                   class="form-control border-secondary-subtle"
                                   th:field="*{tenMauSac}"
                                   placeholder="Nhập tên màu (VD: Đỏ, Xanh navy, Đen nhám...)"
                                   style="height: 38px;"
                                   id="tenMauSacInput">

                            <div class="text-danger small mt-1 fw-medium"
                                 th:if="${#fields.hasErrors('tenMauSac')}"
                                 th:text="${#fields.errors('tenMauSac')[0]}">
                            </div>
                        </div>

                        <div class="col-lg-3 col-md-4">
                            <button type="submit" class="btn text-white fw-semibold px-4 w-100 d-flex align-items-center justify-content-center gap-2" style="background: #c92327; height: 38px;">
                                <i class="bi bi-plus-circle"></i> Thêm mới
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </section>

        <section class="card card-custom shadow-sm border-0 mt-4">
            <div class="card-header bg-white border-bottom p-3">
                <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                    <i class="bi bi-list-stars text-danger"></i> Danh sách màu sắc hệ thống
                    <span class="badge bg-secondary ms-2" th:text="${#lists.size(listms)} + ' màu'"></span>
                </h5>
            </div>

            <div class="table-card p-3 pb-0">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th style="width: 80px;">STT</th>
                        <th>MÃ MÀU SẮC</th>
                        <th>TÊN MÀU SẮC</th>
                        <th>TRẠNG THÁI</th>
                        <th>HÀNH ĐỘNG</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="kg,stt : ${listms}">
                        <td th:text="${(currentPage * 5) + stt.count}"></td>
                        <td class="fw-semibold text-secondary" th:text="${kg.maMauSac}"></td>
                        <td class="fw-bold text-dark" th:text="${kg.tenMauSac}"></td>
                        <td>
                            <span th:if="${kg.trangThai}" class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">Đang hoạt động</span>
                            <span th:unless="${kg.trangThai}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1">Ngừng hoạt động</span>
                        </td>

                        <td>
                            <a th:if="${kg.trangThai}"
                               th:href="@{/mausac/capnhatt/{id}(id=${kg.maMauSac})}"
                               class="btn btn-sm btn-link text-success p-1 border-0"
                               title="Đang hoạt động - Nhấn để ngừng"
                               onclick="return confirm('Bạn có chắc chắn muốn NGỪNG hoạt động màu sắc này?')">
                                <i class="bi bi-toggle2-on fs-4"></i>
                            </a>

                            <a th:unless="${kg.trangThai}"
                               th:href="@{/mausac/capnhatt/{id}(id=${kg.maMauSac})}"
                               class="btn btn-sm btn-link text-secondary p-1 border-0"
                               title="Đang ngừng hoạt động - Nhấn để kích hoạt lại"
                               onclick="return confirm('Bạn có muốn KÍCH HOẠT LẠI màu sắc này không?')">
                                <i class="bi bi-toggle2-off fs-4"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listms)}">
                        <td colspan="5" class="text-center text-muted py-4">Chưa có dữ liệu màu sắc nào được tạo.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center px-4 py-3" th:if="${totalPages > 0}">
                <div class="small text-muted fw-semibold">
                    Tổng số bản ghi: <span class="fw-semibold text-dark" th:text="${totalItems}">0</span>
                    (Trang <span class="fw-semibold text-dark" th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span>)
                </div>

                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0 gap-1">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link rounded-2 border-0 d-flex align-items-center justify-content-center text-danger"
                               th:href="@{/mausac/index(page=${currentPage - 1})}"
                               style="width: 32px; height: 32px;">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${currentPage == i} ? 'active' : ''">
                            <a class="page-link rounded-2 border-0 d-flex align-items-center justify-content-center fw-semibold"
                               th:href="@{/mausac/index(page=${i})}"
                               th:text="${i + 1}"
                               th:style="${currentPage == i} ? 'background-color:#c92327; border-color:#c92327; color:#fff;' : 'color:#212529; width: 32px; height: 32px;'">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled' : ''">
                            <a class="page-link rounded-2 border-0 d-flex align-items-center justify-content-center text-danger"
                               th:href="@{/mausac/index(page=${currentPage + 1})}"
                               style="width: 32px; height: 32px;">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </section>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ===== SHOW TOAST =====
    function showToast(message, type, title) {
        var container = document.getElementById('toastContainer');
        if (!container) return;

        var icons = {
            error: 'bi bi-x-circle-fill text-danger',
            success: 'bi bi-check-circle-fill text-success',
            warning: 'bi bi-exclamation-triangle-fill text-warning'
        };

        var titles = {
            error: 'Lỗi!',
            success: 'Thành công!',
            warning: 'Cảnh báo!'
        };

        var toast = document.createElement('div');
        toast.className = 'toast-custom ' + type;
        toast.innerHTML = `
            <div class="toast-icon">
                <i class="${icons[type] || icons.error}"></i>
            </div>
            <div class="toast-content">
                <div class="toast-title">${title || titles[type] || 'Thông báo'}</div>
                <div class="toast-message">${message}</div>
            </div>
            <button class="toast-close" onclick="this.closest('.toast-custom').remove()">
                <i class="bi bi-x"></i>
            </button>
        `;

        container.appendChild(toast);

        setTimeout(function() {
            if (toast.parentNode) {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(function() { toast.remove(); }, 300);
            }
        }, 5000);
    }

    // ===== HIỂN THỊ TOAST KHI TRANG LOAD =====
    document.addEventListener("DOMContentLoaded", function() {
        // Lấy message từ flash attribute (ẩn trong div)
        var successMsg = document.getElementById('successMessage')?.textContent?.trim();
        var warningMsg = document.getElementById('warningMessage')?.textContent?.trim();
        var errorMsg = document.getElementById('errorMessage')?.textContent?.trim();

        if (successMsg && successMsg !== '' && successMsg !== 'null' && successMsg !== 'undefined') {
            showToast(successMsg, 'success');
        } else if (warningMsg && warningMsg !== '' && warningMsg !== 'null' && warningMsg !== 'undefined') {
            showToast(warningMsg, 'warning');
        } else if (errorMsg && errorMsg !== '' && errorMsg !== 'null' && errorMsg !== 'undefined') {
            showToast(errorMsg, 'error');
        }

        // Lấy message từ sessionStorage
        var storedMessage = sessionStorage.getItem('toastMessage');
        var storedType = sessionStorage.getItem('toastType');

        if (storedMessage && storedMessage !== '' && storedMessage !== 'null' && storedMessage !== 'undefined') {
            showToast(storedMessage, storedType || 'success');
            sessionStorage.removeItem('toastMessage');
            sessionStorage.removeItem('toastType');
        }
    });

    // Lưu message vào sessionStorage trước khi form submit
    document.addEventListener('submit', function(e) {
        sessionStorage.removeItem('toastMessage');
        sessionStorage.removeItem('toastType');
    });
</script>

</body>
</html>
