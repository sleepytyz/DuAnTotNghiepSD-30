<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý kích thước - FS Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .form-control:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-body">

        <div th:replace="fragments/header :: header('Quản lý kích thước', 'Kích thước')"></div>

        <div th:if="${mess}" class="alert alert-danger alert-dismissible fade show mt-3 shadow-sm border-0" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${mess}" class="fw-medium"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <section class="card card-custom mb-4 shadow-sm border-0 mt-3">
            <div class="card-header text-white" style="background:#c92327;">
                <h5 class="mb-0 d-flex align-items-center gap-2 py-1">
                    <i class="bi bi-plus-circle-fill"></i>
                    <span>Thêm kích thước mới</span>
                </h5>
            </div>

            <div class="card-body bg-white p-4">
                <form th:action="@{/kichthuoc/add}" th:object="${kichthuoc}" method="post">
                    <div class="row g-3 align-items-end">

                        <div class="col-xl-6 col-md-8">
                            <label class="form-label fw-semibold text-dark small mb-2">Tên kích thước <span class="text-danger">*</span></label>
                            <input type="text"
                                   class="form-control border-secondary-subtle"
                                   th:field="*{tenKichThuoc}"
                                   placeholder="Nhập kích thước (VD: S, M, L, 39, 40...)"
                                   style="height: 38px;">

                            <div class="text-danger small mt-1 fw-medium"
                                 th:if="${#fields.hasErrors('tenKichThuoc')}"
                                 th:text="${#fields.errors('tenKichThuoc')[0]}">
                            </div>
                        </div>

                        <div class="col-xl-3 col-md-4">
                            <button type="submit" class="btn text-white fw-semibold px-4 w-100 d-flex align-items-center justify-content-center gap-2" style="background: #c92327; height: 38px;">
                                <i class="bi bi-plus-circle"></i> Thêm mới
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </section>

        <section class="table-card shadow-sm border-0">
            <div class="table-header bg-white border-bottom p-3">
                <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                    <i class="bi bi-list-stars text-danger"></i> Danh sách kích thước hệ thống
                </h5>
            </div>

            <div class="table-wrapper p-3">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th style="width: 80px;">STT</th>
                        <th>MÃ KÍCH THƯỚC</th>
                        <th>TÊN KÍCH THƯỚC</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c,stt : ${listk}">
                        <td th:text="${stt.count}"></td>
                        <td class="fw-semibold text-secondary" th:text="${'KT' + c.maKichThuoc}"></td>
                        <td class="fw-bold text-dark" th:text="${c.tenKichThuoc}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listk)}">
                        <td colspan="3" class="text-center text-muted py-4">Chưa có dữ liệu kích thước nào được tạo.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
