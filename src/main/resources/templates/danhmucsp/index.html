<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Danh mục sản phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-control:focus, .form-select:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div sec:authorize="hasRole('ADMIN')">
        <div th:replace="fragments/sidebaradmin :: sidebar-admin"></div>
    </div>

    <div sec:authorize="hasRole('STAFF')">
        <div th:replace="fragments/sidebarstaff :: sidebar-staff"></div>
    </div>

    <div class="content-body">

        <div th:replace="fragments/header :: header('Danh mục sản phẩm','Danh mục sản phẩm')"></div>

        <div class="page-content px-3">

            <div th:if="${mess}" class="alert alert-warning alert-dismissible fade show mt-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${mess}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card card-custom mb-4 shadow-sm border-0 mt-3">
                <div class="card-header text-white" style="background:#c92327;">
                    <h5 class="mb-0 d-flex align-items-center gap-2 py-1">
                        <i class="bi bi-pencil-square"></i>
                        <span>Thông tin danh mục</span>
                    </h5>
                </div>

                <div class="card-body bg-white p-4">
                    <form method="post" th:object="${danhmuc}">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">


                        <div class="row g-3">

                            <div class="col-md-2">
                                <label class="form-label fw-semibold text-dark small">Mã danh mục</label>
                                <input type="text" class="form-control bg-light border-secondary-subtle" th:field="*{maDanhMuc}" readonly placeholder="Tự động tăng">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold text-dark small">Tên danh mục <span class="text-danger">*</span></label>
                                <input type="text" class="form-control border-secondary-subtle" th:field="*{tenDanhMuc}" placeholder="Nhập tên danh mục...">
                                <div class="text-danger small mt-1" th:errors="*{tenDanhMuc}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold text-dark small">Mô tả</label>
                                <input type="text" class="form-control border-secondary-subtle" th:field="*{moTa}" placeholder="Nhập mô tả ngắn...">
                                <div class="text-danger small mt-1" th:errors="*{moTa}"></div>
                            </div>

                        </div>

                        <hr class="text-secondary-subtle my-4">

                        <div class="d-flex gap-2 justify-content-start">
                            <button class="btn fw-semibold text-white px-4 d-flex align-items-center gap-1" type="submit" formaction="/danhmucsp/add" style="background:#c92327;">
                                <i class="bi bi-plus-circle"></i> Thêm mới
                            </button>

                            <button type="button" class="btn btn-outline-secondary fw-semibold px-4 d-flex align-items-center gap-1" onclick="resetForm()">
                                <i class="bi bi-arrow-clockwise"></i> Reset
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card card-custom border-0 shadow-sm mt-4">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                        <i class="bi bi-list-ul text-danger"></i>
                        <span>Danh sách danh mục sản phẩm</span>
                    </h5>
                </div>

                <div class="table-card p-3">
                    <table class="table-custom">
                        <thead>
                        <tr>
                            <th style="width:80px">STT</th>
                            <th style="width:120px">Mã DM</th>
                            <th>Tên danh mục</th>
                            <th>Mô tả</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="dm,row : ${listdmsp}">
                            <td th:text="${row.count}"></td>
                            <td>
                                <span class="fw-bold text-dark" th:text="${'DM' + dm.maDanhMuc}"></span>
                            </td>
                            <td class="fw-medium" th:text="${dm.tenDanhMuc}"></td>
                            <td th:text="${dm.moTa}"></td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(listdmsp)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-inbox me-1"></i> Chưa có dữ liệu danh mục hiển thị
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function resetForm() {
        window.location.href = "/danhmucsp/index";
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
