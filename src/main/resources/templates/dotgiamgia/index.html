<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Đợt Giảm Giá</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content-body">

        <div th:replace="fragments/header :: header('Quản lý đợt giảm giá', 'Đợt giảm giá')"></div>


        <div class="card card-custom mb-4">

            <div class="card-header text-white"
                 style="background:#c92327;">
                <h5 class="mb-0">
                    <i class="bi bi-pencil-square me-2"></i>
                    Thông tin đợt giảm giá
                </h5>
            </div>

            <form th:action="${dgg.maGiamGia == null}
                    ? @{/dot-giam-gia/add}
                    : @{/dot-giam-gia/update}"
                  th:object="${dgg}"
                  method="post" class="card-body">

                <input type="hidden" th:field="*{maGiamGia}">

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="filter-label">Tên giảm giá</label>
                        <input type="text" class="form-control" th:field="*{tenGiamGia}">
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Loại giảm giá</label>
                        <select class="form-select" th:field="*{loaiGiamGia}">
                            <option value="Phần trăm">Phần trăm</option>
                            <option value="Tiền mặt">Tiền mặt</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Giá trị giảm</label>
                        <input type="number" class="form-control" th:field="*{giaTriGiam}">
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Giảm tối đa</label>
                        <input type="number" class="form-control" th:field="*{giamToiDa}">
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Ngày bắt đầu</label>
                        <input type="date" class="form-control" th:field="*{ngayBatDau}">
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Ngày kết thúc</label>
                        <input type="date" class="form-control" th:field="*{ngayKetThuc}">
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Trạng thái</label>
                        <select class="form-select" th:field="*{trangThai}">
                            <option th:value="true">Hoạt động</option>
                            <option th:value="false">Ngừng hoạt động</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Mã nhân viên</label>
                        <input type="number" class="form-control" th:field="*{maNhanVienTao}">
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Ngày tạo</label>
                        <input type="date" class="form-control" th:field="*{ngayTao}">
                    </div>

                    <div class="col-md-12">
                        <label class="filter-label">Mô tả</label>
                        <textarea class="form-control" rows="3" th:field="*{moTa}"></textarea>
                    </div>

                </div>

                <!-- BUTTON -->
                <div class="d-flex gap-2 mt-3">

                    <button type="submit" class="btn-add-account">
                        <i class="bi bi-plus-lg"></i> Lưu
                    </button>

                    <a href="/dot-giam-gia/hien-thi" class="btn btn-secondary">
                        <i class="bi bi-arrow-clockwise"></i> Làm mới
                    </a>

                </div>

            </form>
        </div>

        <!-- SEARCH CARD -->
        <div class="filter-card mt-3">

            <div class="row g-3 align-items-end">

                <div class="col-md-4">
                    <label class="filter-label">Tìm kiếm</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Tìm kiếm tên giảm giá, mã...">
                </div>

                <div class="col-md-2">
                    <label class="filter-label">Trạng thái</label>
                    <select class="form-select">
                        <option>Tất cả</option>
                        <option>Hoạt động</option>
                        <option>Ngừng hoạt động</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="filter-label">Loại giảm</label>
                    <select class="form-select">
                        <option>Tất cả</option>
                        <option>Phần trăm</option>
                        <option>Tiền mặt</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="filter-label">Mã nhân viên</label>
                    <select class="form-select" name="maNhanVien">
                        <option value="">Tất cả</option>

                        <option th:each="nv : ${listNhanVien}"
                                th:value="${nv.maNhanVien}"
                                th:text="${nv.maNhanVien}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100">
                        <i class="bi bi-funnel-fill"></i> Lọc
                    </button>
                </div>

            </div>

        </div>

        <!-- TABLE -->
        <div class="table-card mt-3">

            <table class="table-custom">

                <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã</th>
                    <th>Tên</th>
                    <th>Loại</th>
                    <th>Giá trị</th>
                    <th>Tối đa</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Trạng thái</th>
                    <th>Nhân viên</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="dgg,stt : ${listDGG}">

                    <td th:text="${stt.count}"></td>
                    <td th:text="${dgg.maGiamGia}"></td>
                    <td th:text="${dgg.tenGiamGia}"></td>
                    <td th:text="${dgg.loaiGiamGia}"></td>
                    <td th:text="${dgg.giaTriGiam}"></td>
                    <td th:text="${dgg.giamToiDa}"></td>

                    <td th:text="${#dates.format(dgg.ngayBatDau,'dd/MM/yyyy')}"></td>
                    <td th:text="${#dates.format(dgg.ngayKetThuc,'dd/MM/yyyy')}"></td>

                    <td>
                        <span th:if="${dgg.trangThai}" class="badge-active">Hoạt động</span>
                        <span th:unless="${dgg.trangThai}" class="badge-locked">Ngừng</span>
                    </td>

                    <td th:text="${dgg.maNhanVienTao}"></td>

                    <td>
                        <a class="btn-action-lock"
                           th:href="@{/dot-giam-gia/detail/{id}(id=${dgg.maGiamGia})}">
                            Sửa
                        </a>

                        <a class="btn-trash ms-2"
                           th:href="@{/dot-giam-gia/delete/{id}(id=${dgg.maGiamGia})}"
                           onclick="return confirm('Bạn có chắc muốn xóa?')">
                            <i class="bi bi-trash3"></i>
                        </a>
                    </td>

                </tr>
                </tbody>

            </table>

        </div>

    </div>
</div>

</body>
</html>
