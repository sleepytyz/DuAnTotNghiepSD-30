<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý chất liệu - FS Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-control:focus {
            border-color: #c92327 !important;
            box-shadow: 0 0 0 0.25rem rgba(201, 35, 39, 0.15) !important;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div sec:authorize="hasRole('ADMIN')">
        <div th:replace="fragments/sidebaradmin :: sidebar-admin"></div>
    </div>

    <div sec:authorize="hasRole('STAFF')">
        <div th:replace="fragments/sidebarstaff :: sidebar-staff"></div>
    </div>

    <div class="content-wrapper">

        <div th:replace="fragments/header :: header('Quản lý chất liệu', 'Chất liệu')"></div>

        <div class="content-body px-3">

            <div th:if="${mess}" class="alert alert-warning alert-dismissible fade show mt-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${mess}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card card-custom mb-4 shadow-sm border-0 mt-3">
                <div class="card-header text-white" style="background:#c92327;">
                    <h5 class="mb-0 d-flex align-items-center gap-2 py-1">
                        <i class="bi bi-plus-circle"></i>
                        <span>Thêm chất liệu mới</span>
                    </h5>
                </div>

                <div class="card-body bg-white p-4">
                    <form th:action="@{/chatlieu/add}" th:object="${chatlieu}" method="post">
                        <div class="row g-3 align-items-end">

                            <div class="col-md-8">
                                <label class="form-label fw-semibold text-dark small">Tên chất liệu <span class="text-danger">*</span></label>
                                <input type="text"
                                       class="form-control border-secondary-subtle py-2"
                                       th:field="*{tenChatLieu}"
                                       placeholder="Ví dụ: Cotton, Kaki, Lụa, Da tổng hợp...">

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('tenChatLieu')}"
                                     th:text="${#fields.errors('tenChatLieu')[0]}">
                                </div>
                            </div>

                            <div class="col-md-4">
                                <button type="submit" class="btn fw-semibold text-white px-4 py-2 d-flex align-items-center gap-1 w-100 justify-content-center" style="background:#c92327;">
                                    <i class="bi bi-plus-circle"></i> Thêm mới
                                </button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>

            <div class="card card-custom border-0 shadow-sm mt-4">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold text-dark d-flex align-items-center gap-2">
                        <i class="bi bi-list-stars text-danger"></i>
                        <span>Danh sách chất liệu sản phẩm</span>
                    </h5>
                </div>

                <div class="table-card p-3">
                    <table class="table-custom">
                        <thead>
                        <tr>
                            <th style="width: 120px;">STT</th>
                            <th style="width: 250px;">Mã chất liệu</th>
                            <th>Tên chất liệu</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="c,stt : ${listcl}">
                            <td th:text="${stt.count}"></td>
                            <td>
                                <span class="fw-bold text-dark" th:text="${'CL' + c.maChatLieu}"></span>
                            </td>
                            <td class="fw-medium" th:text="${c.tenChatLieu}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listcl)}">
                            <td colspan="3" class="text-center text-muted py-4">
                                <i class="bi bi-inbox me-1"></i> Hệ thống chưa ghi nhận dữ liệu chất liệu nào
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
