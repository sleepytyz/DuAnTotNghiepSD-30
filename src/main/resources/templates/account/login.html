<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo img {
            width: 60px;
        }

        .title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #dc3545;
        }

        .btn-login {
            background: #dc3545;
            color: white;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #bb2d3b;
        }

        .small-link {
            font-size: 13px;
            text-decoration: none;
        }
        body {
            background: #f5f6fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }

        /* label mềm hơn */
        label {
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        /* input mềm + bo nhẹ */
        .form-control {
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding: 10px 12px;
            transition: all 0.2s ease-in-out;
            font-size: 14px;
        }

        /* focus đẹp hơn */
        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.15rem rgba(220, 53, 69, 0.15);
        }

        /* input group icon */
        .input-group-text {
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            border-right: none;
            border-radius: 8px 0 0 8px;
        }

        /* input trong group */
        .input-group .form-control {
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>

<body>

<div class="login-box">

    <!-- LOGO -->
    <div class="logo">
        <img src="/images/img.png" alt="logo">
    </div>

    <div class="title">ĐĂNG NHẬP HỆ THỐNG</div>

    <form method="post" action="/login">

        <!-- USER -->
        <div class="mb-3">
            <label>Tên đăng nhập</label>
            <input type="text" name="username" class="form-control" placeholder="Nhập tài khoản">
        </div>

        <!-- PASSWORD -->
        <div class="mb-2">
            <label>Mật khẩu</label>

            <div class="input-group">
                <input type="password" name="password" id="password" class="form-control" placeholder="Nhập mật khẩu">

                <span class="input-group-text" style="cursor:pointer" onclick="togglePassword()">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </span>
            </div>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="remember">
            <label class="form-check-label">
                Remember me
            </label>
        </div>

        <!-- ERROR -->
        <div class="text-danger text-center mb-2" th:text="${error}"></div>

        <!-- BUTTON -->
        <button class="btn btn-login w-100 mt-2">
            <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
        </button>

        <!-- FORGOT -->
        <div class="text-center mt-3">
            <a href="/forgot" class="small-link text-danger">
                Quên mật khẩu?
            </a>
        </div>

    </form>

</div>

<script>
    function togglePassword() {
        let pass = document.getElementById("password");
        let icon = document.getElementById("eyeIcon");

        if (pass.type === "password") {
            pass.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        } else {
            pass.type = "password";
            icon.classList.add("bi-eye");
            icon.classList.remove("bi-eye-slash");
        }
    }
</script>

</body>
</html>
