<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký – FS Shoes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #F5F6FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0;
        }
        .register-wrapper {
            display: flex;
            width: 980px;
            max-width: 96vw;
            min-height: 560px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,.10);
        }
        .brand-panel {
            flex: 1;
            background: #E53935;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 36px;
            gap: 20px;
            color: #fff;
        }
        .brand-panel .logo-box { width: 90px; height: 90px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
        .brand-panel .logo-box img { width: 64px; }
        .brand-panel h1 { font-size: 28px; font-weight: 800; }
        .brand-panel p  { font-size: 14px; opacity: .88; text-align: center; line-height: 1.6; }
        .form-panel { width: 480px; background: #fff; display: flex; flex-direction: column; justify-content: center; padding: 44px 44px; }
        .form-panel h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .form-panel .sub { font-size: 13px; color: #6B7280; margin-bottom: 22px; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; color: #9CA3AF; }
        .input-wrap input { width: 100%; padding: 10px 12px 10px 38px; border: 1.5px solid #E5E7EB; border-radius: 8px; font-size: 14px; outline: none; transition: border-color .15s; }
        .input-wrap input:focus { border-color: #E53935; }
        .input-wrap input.is-invalid { border-color: #B71C1C; }
        .field-error { font-size: 11.5px; color: #B71C1C; margin-top: 4px; }
        .btn-register { width: 100%; padding: 11px; margin-top: 6px; background: #E53935; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; }
        .btn-register:hover { background: #B71C1C; }
        .form-footer { text-align: center; margin-top: 18px; font-size: 13px; color: #6B7280; }
        .form-footer a { color: #E53935; font-weight: 600; text-decoration: none; }
        .form-footer a:hover { text-decoration: underline; }
        @media (max-width: 760px) {
            .brand-panel { display: none; }
            .form-panel  { width: 100%; padding: 36px 24px; }
            .row-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="register-wrapper">
    <div class="brand-panel">
        <div class="logo-box"><img th:src="@{/images/img.png}" onerror="this.style.display='none'" alt="FS Shoes"></div>
        <h1>FS Shoes</h1>
        <p>Tạo tài khoản để mua sắm,<br>theo dõi đơn hàng và nhận ưu đãi riêng</p>
    </div>

    <div class="form-panel">
        <h2>Đăng ký tài khoản</h2>
        <p class="sub">Điền thông tin bên dưới để tạo tài khoản mới.</p>

        <form th:action="@{/register}" th:object="${dangKy}" method="post">

            <div class="row-2">
                <div class="field">
                    <label>Họ và tên</label>
                    <div class="input-wrap">
                        <i class="bi bi-person-badge"></i>
                        <input type="text" th:field="*{hoTen}" placeholder="Nguyễn Văn A"
                               th:classappend="${#fields.hasErrors('hoTen')} ? 'is-invalid'">
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                </div>
                <div class="field">
                    <label>Số điện thoại</label>
                    <div class="input-wrap">
                        <i class="bi bi-telephone"></i>
                        <input type="text" th:field="*{sdt}" placeholder="09xxxxxxxx"
                               th:classappend="${#fields.hasErrors('sdt')} ? 'is-invalid'">
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('sdt')}" th:errors="*{sdt}"></div>
                </div>
            </div>

            <div class="field">
                <label>Email</label>
                <div class="input-wrap">
                    <i class="bi bi-envelope"></i>
                    <input type="email" th:field="*{email}" placeholder="ban@email.com"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="field">
                <label>Tên đăng nhập</label>
                <div class="input-wrap">
                    <i class="bi bi-person"></i>
                    <input type="text" th:field="*{tenDangNhap}" placeholder="Nhập tên đăng nhập" autofocus
                           th:classappend="${#fields.hasErrors('tenDangNhap')} ? 'is-invalid'">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('tenDangNhap')}" th:errors="*{tenDangNhap}"></div>
            </div>

            <div class="row-2">
                <div class="field">
                    <label>Mật khẩu</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock"></i>
                        <input type="password" th:field="*{matKhau}" placeholder="Tối thiểu 6 ký tự"
                               th:classappend="${#fields.hasErrors('matKhau')} ? 'is-invalid'">
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('matKhau')}" th:errors="*{matKhau}"></div>
                </div>
                <div class="field">
                    <label>Xác nhận mật khẩu</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" th:field="*{xnMatKhau}" placeholder="Nhập lại mật khẩu"
                               th:classappend="${#fields.hasErrors('xnMatKhau')} ? 'is-invalid'">
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('xnMatKhau')}" th:errors="*{xnMatKhau}"></div>
                </div>
            </div>

            <button type="submit" class="btn-register">Đăng ký</button>
        </form>

        <div class="form-footer">Đã có tài khoản? <a href="/login">Đăng nhập</a></div>
    </div>
</div>

</body>
</html>
